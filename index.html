  `);

  /* ======================= game ======================= */
  PP.registerGame({
    id: 'drums',
    title: 'Drums',
    domain: 'music',
    icon: '🥁',
    tileColor: '#FF8A3D',
    order: 51,
    create(stage, ctx) {
      const probe = ctx.el('div', { style: { position: 'absolute', visibility: 'hidden', pointerEvents: 'none', paddingTop: 'var(--safe-t)', paddingRight: 'var(--safe-r)', paddingBottom: 'var(--safe-b)', paddingLeft: 'var(--safe-l)' } });
      const floor = ctx.el('div', { class: 'bd-floor' });
      const conf = ctx.el('div', { class: 'bd-confetti' });
      for (let i = 0; i < 14; i++) conf.appendChild(ctx.el('i', { style: { left: ctx.rand(2, 98) + '%', top: ctx.rand(4, 70) + '%', background: ctx.pick(['#FF6FB5', '#FFD21F', '#4D96FF', '#6BCB77', '#FF8C1A', '#B276F5']), transform: `scale(${ctx.rand(0.6, 1.4)})` } }));
      const spot = ctx.el('div', { class: 'bd-spot' });
      const buddy = ctx.el('div', { class: 'bd-buddy', html: BUDDY });
      const dots = ctx.el('div', { class: 'bd-dots', style: { opacity: 0 } });
      const fx = ctx.el('div', { class: 'bd-fx' });
      const stick = ctx.el('div', { class: 'bd-stick', html: STICK });
      stage.append(probe, floor, conf, spot, buddy, dots);

      const q = (s) => buddy.querySelector(s);
      const B = { bod: q('.bd-bod'), armL: q('.bd-arm-l'), armR: q('.bd-arm-r'), footL: q('.bd-foot-l'), footR: q('.bd-foot-r'), tuft: q('.bd-tuft'), shadow: q('.bd-shadow'), pupils: buddy.querySelectorAll('.bd-pupil') };

      const pads = PADS.map((def, i) => {
        const el = ctx.el('div', { class: 'bd-pad', 'data-pad': def.id, 'aria-label': def.name, style: { '--bg': def.bg, '--bg2': U.shade(def.bg, -0.1), '--sh': U.shade(def.bg, -0.28), '--c': def.color } });
        const inner = ctx.el('div', { class: 'bd-pad-in' });
        inner.appendChild(ctx.el('div', { class: 'bd-plate' }));
        inner.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 200 200" aria-hidden="true">${ART[def.id]}</svg>`);
        el.appendChild(inner);
        stage.appendChild(el);
        const P = { def, i, el, inner, plate: inner.firstChild, svg: inner.querySelector('svg'), x: 0, y: 0, s: 0, lastWord: 0 };
        ctx.tap(el, (e) => hitPad(P, { user: true }), { cooldown: 70 });
        return P;
      });

      const mkBtn = (cls, label, html, c, d, l) => {
        const b = ctx.el('button', { class: 'bd-btn pp-noripple ' + cls, 'aria-label': label, html, style: { '--c': c, '--d': d, '--l': l } });
        stage.appendChild(b);
        return b;
      };
      const playBtn = mkBtn('bd-play invite', 'Play music', PLAY);
      const turtleBtn = mkBtn('bd-turtle', 'Slow', '<span class="pp-emoji">🐢</span>', '#3DBE4B', '#23873A', '#DDF6DF');
      const rabbitBtn = mkBtn('bd-rabbit', 'Fast', '<span class="pp-emoji">🐇</span>', '#FF8C1A', '#D3660A', '#FFE8CF');
      turtleBtn.style.setProperty('--wob', '1.1s');
      rabbitBtn.style.setProperty('--wob', '.22s');
      stage.append(stick, fx);

      /* ---------------- state ---------------- */
      let groove = null;
      let tempo = 'mid';
      let beatCount = 0;
      const named = new Set();
      let lastTalk = 0;
      let streak = 0, lastBeatHit = null, lastBeatTap = -1, lastBeatPraise = -1e9;
      let call = null, lastCallEnd = performance.now(), tapsSinceCall = 0;
      let idleN = 0, idleSince = performance.now();
      let geo = { pip: 110 };

      /* ---------------- layout ---------------- */
      function insets() {
        const cs = getComputedStyle(probe);
        return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
      }
      function put(el, x, y, w, h) { Object.assign(el.style, { left: Math.round(x) + 'px', top: Math.round(y) + 'px', width: Math.round(w) + 'px', height: Math.round(h == null ? w : h) + 'px' }); }
      function putBtn(b, x, y, s) { put(b, x, y, s); b.style.setProperty('--s', s + 'px'); }
      function layout() {
        const { w, h } = ctx.size();
        if (!w || !h) return;
        const S = insets();
        const m = Math.round(U.clamp(Math.min(w, h) * 0.025, 10, 22));
        const L = S.l + m, R = w - S.r - m, T = S.t + m, Bm = h - S.b - m;
        const W = R - L, H = Bm - T;
        const ar = w / h;
        const gap = Math.round(U.clamp(Math.min(w, h) * 0.022, 10, 22));
        const pb = Math.round(U.clamp(Math.min(w, h) * 0.2, 84, 128)); // play button
        const tb = Math.round(U.clamp(Math.min(w, h) * 0.15, 72, 104)); // tempo buttons
        let region; // where the buddy goes
        if (ar >= 1.65) {
          // phone landscape: one row of six pads along the floor
          const slot = W / 6;
          const ps = Math.round(Math.min(slot - gap, H * 0.4, 230));
          const py = Bm - ps;
          pads.forEach((P, i) => setPad(P, L + slot * i + (slot - ps) / 2, py, ps));
          floor.style.height = h - (py + ps * 0.45) + 'px';
          const top = T, bot = py - gap;
          const cy = (top + bot) / 2;
          const dh = Math.min(bot - top, W * 0.34);
          region = { cx: w / 2, top, h: dh };
          const dw = dh * 200 / 224;
          putBtn(playBtn, w / 2 - dw / 2 - gap * 2 - pb, cy - pb / 2, pb);
          const tx = w / 2 + dw / 2 + gap * 2;
          if (bot - top >= tb * 2 + gap) {
            putBtn(rabbitBtn, tx, cy - tb - gap / 2, tb);
            putBtn(turtleBtn, tx, cy + gap / 2, tb);
          } else {
            putBtn(turtleBtn, tx, cy - tb / 2, tb);
            putBtn(rabbitBtn, tx + tb + gap, cy - tb / 2, tb);
          }
        } else if (ar > 1) {
          // tablet landscape: three pads down each side, buddy in the middle
          const top0 = Math.max(T, S.t + 100);
          const ps = Math.round(Math.min((Bm - top0 - 2 * gap) / 3, W * 0.22, 250));
          const colH = 3 * ps + 2 * gap;
          const y0 = top0 + (Bm - top0 - colH) / 2;
          pads.forEach((P, i) => {
            const col = i % 2, row = Math.floor(i / 2);
            const x = col === 0 ? L + (row === 1 ? ps * 0.12 : 0) : R - ps - (row === 1 ? ps * 0.12 : 0);
            setPad(P, x, y0 + row * (ps + gap), ps);
          });
          floor.style.height = h * 0.16 + 'px';
          const cL = L + ps * 1.12 + gap, cR = R - ps * 1.12 - gap;
          const cw = cR - cL;
          const rowY = Bm - pb;
          const rowW = tb * 2 + pb + gap * 4;
          const rx = cL + (cw - rowW) / 2;
          putBtn(turtleBtn, rx, rowY + (pb - tb) / 2, tb);
          putBtn(playBtn, rx + tb + gap * 2, rowY, pb);
          putBtn(rabbitBtn, rx + tb + pb + gap * 4, rowY + (pb - tb) / 2, tb);
          const dh = Math.min(rowY - gap - T, cw * 0.95 * 224 / 200);
          region = { cx: w / 2, top: T, h: dh };
        } else {
          // portrait: buddy on top, controls, then a grid of pads
          const cols = W < 600 ? 2 : 3, rows = 6 / cols;
          const ps = Math.round(Math.min((W - (cols - 1) * gap * 1.6) / cols, (H * (cols === 2 ? 0.54 : 0.47) - (rows - 1) * gap) / rows, 250));
          const gw = cols * ps + (cols - 1) * gap * 1.6;
          const gh = rows * ps + (rows - 1) * gap;
          const gx = L + (W - gw) / 2, gy = Bm - gh;
          pads.forEach((P, i) => setPad(P, gx + (i % cols) * (ps + gap * 1.6), gy + Math.floor(i / cols) * (ps + gap), ps));
          floor.style.height = h - (gy + ps * 0.4) + 'px';
          const rowY = gy - gap * 1.4 - pb;
          const rowW = tb * 2 + pb + gap * 4;
          const rx = L + (W - rowW) / 2;
          putBtn(turtleBtn, rx, rowY + (pb - tb) / 2, tb);
          putBtn(playBtn, rx + tb + gap * 2, rowY, pb);
          putBtn(rabbitBtn, rx + tb + pb + gap * 4, rowY + (pb - tb) / 2, tb);
          const dh = Math.min(rowY - gap - T, W * 0.72 * 224 / 200);
          region = { cx: w / 2, top: T, h: dh };
        }
        // buddy + beat dots + spotlight
        const dotS = Math.round(U.clamp(region.h * 0.07, 12, 22));
        const dh = region.h - dotS - 8;
        const dw = dh * 200 / 224;
        put(buddy, region.cx - dw / 2, region.top + dotS + 8, dw, dh);
        dots.style.setProperty('--ds', dotS + 'px');
        put(dots, region.cx - dw / 2, region.top, dw, dotS);
        const sp = dh * 1.25;
        put(spot, region.cx - sp / 2, region.top + dotS + 8 + dh / 2 - sp / 2, sp);
        geo = { pip: Math.round(U.clamp(Math.min(w, h) * 0.2, 84, 150)), w, h, buddy: { x: region.cx - dw / 2, y: region.top + dotS + 8, w: dw, h: dh } };
        if (call && call.pip) placePip(call.pad);
      }
      function setPad(P, x, y, s) {
        put(P.el, x, y, s);
        P.x = x + s / 2; P.y = y + s / 2; P.s = s;
      }

      /* ---------------- sounds ---------------- */
      function sound(P, vel, at) {
        const pan = U.clamp((P.x / (geo.w || 1)) * 2 - 1, -1, 1) * 0.5;
        const o = (v, extra) => Object.assign({ vel: v * vel, pan }, at ? { at } : null, extra || null);
        const t = at || ctx.audio.now() + 0.005;
        switch (P.def.id) {
          case 'bass': ctx.drum('kick', o(0.85)); ctx.drum('tom', o(0.32, { pitch: 92 })); break;
          case 'snare': ctx.drum('snare', o(0.55)); ctx.drum('tom', o(0.14, { pitch: 220 })); break;
          case 'tamb': ctx.drum('tamb', o(0.75)); break;
          case 'maracas': ctx.drum('shaker', o(0.8)); ctx.drum('shaker', Object.assign(o(0.5), { at: t + 0.075 })); break;
          case 'cymbal': ctx.drum('cymbal', o(0.42)); break;
          case 'block': ctx.drum('woodblock', o(0.75)); break;
        }
      }

      /* ---------------- visuals ---------------- */
      const ANIM = {
        bass: (P) => {
          P.inner.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.1, .88)', offset: 0.18 }, { transform: 'scale(.97, 1.04)', offset: 0.5 }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' });
          anim(P, '.bd-head', [{ transform: 'scale(1)' }, { transform: 'scale(.9)', offset: 0.15 }, { transform: 'scale(1.04)', offset: 0.45 }, { transform: 'scale(1)' }], 380);
        },
        snare: (P) => {
          P.inner.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-5px,2px)', offset: 0.15 }, { transform: 'translate(5px,-1px)', offset: 0.35 }, { transform: 'translate(-3px,1px)', offset: 0.6 }, { transform: 'translate(0,0)' }], { duration: 300 });
          anim(P, '.bd-sticks', [{ transform: 'translateY(0)' }, { transform: 'translateY(14px)', offset: 0.2 }, { transform: 'translateY(-8px)', offset: 0.55 }, { transform: 'translateY(0)' }], 360);
        },
        tamb: (P) => {
          P.inner.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-14deg)', offset: 0.18 }, { transform: 'rotate(10deg)', offset: 0.42 }, { transform: 'rotate(-5deg)', offset: 0.7 }, { transform: 'rotate(0)' }], { duration: 480, easing: 'ease-out' });
          anim(P, '.bd-zils', [{ transform: 'rotate(0)' }, { transform: 'rotate(6deg)', offset: 0.25 }, { transform: 'rotate(-6deg)', offset: 0.55 }, { transform: 'rotate(0)' }], 420);
        },
        maracas: (P) => {
          anim(P, '.bd-mar1', [{ transform: 'rotate(0)' }, { transform: 'rotate(-14deg)', offset: 0.2 }, { transform: 'rotate(10deg)', offset: 0.45 }, { transform: 'rotate(-6deg)', offset: 0.7 }, { transform: 'rotate(0)' }], 360);
          anim(P, '.bd-mar2', [{ transform: 'rotate(0)' }, { transform: 'rotate(14deg)', offset: 0.2 }, { transform: 'rotate(-10deg)', offset: 0.45 }, { transform: 'rotate(6deg)', offset: 0.7 }, { transform: 'rotate(0)' }], 360);
          P.inner.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-6px)', offset: 0.3 }, { transform: 'translateY(0)' }], { duration: 300 });
        },
        cymbal: (P) => {
          anim(P, '.bd-cym', [{ transform: 'rotate(0)' }, { transform: 'rotate(-9deg) scaleY(.85)', offset: 0.12 }, { transform: 'rotate(7deg)', offset: 0.32 }, { transform: 'rotate(-5deg)', offset: 0.52 }, { transform: 'rotate(3deg)', offset: 0.72 }, { transform: 'rotate(0)' }], 1000);
        },
        block: (P) => {
          anim(P, '.bd-blk', [{ transform: 'scale(1)' }, { transform: 'scale(1.08, .86)', offset: 0.2 }, { transform: 'scale(.97, 1.05)', offset: 0.5 }, { transform: 'scale(1)' }], 260);
          anim(P, '.bd-mallet', [{ transform: 'rotate(0)' }, { transform: 'rotate(-22deg)', offset: 0.25 }, { transform: 'rotate(0)' }], 260);
        },
      };
      function anim(P, sel, kf, dur) {
        const e = P.svg.querySelector(sel);
        if (e) e.animate(kf, { duration: dur, easing: 'ease-out' });
      }
      let liveFx = 0;
      function rings(P) {
        for (let k = 0; k < 2; k++) {
          if (liveFx > 30) return;
          liveFx++;
          const r = ctx.el('div', { class: 'bd-ring' });
          P.el.appendChild(r);
          const a = r.animate([
            { transform: 'translate(-50%,-50%) scale(.75)', opacity: 0.85 },
            { transform: `translate(-50%,-50%) scale(${1.45 + k * 0.25})`, opacity: 0 },
          ], { duration: 560 + k * 120, delay: k * 90, easing: 'cubic-bezier(.2,.7,.3,1)' });
          a.onfinish = () => { r.remove(); liveFx--; };
        }
      }
      function hitVisual(P, quiet) {
        ANIM[P.def.id](P);
        rings(P);
        const now = performance.now();
        if (!quiet && now - P.lastWord > 420) {
          P.lastWord = now;
          PP.fx.floatText(P.x + ctx.rand(-P.s * 0.2, P.s * 0.2), P.y - P.s * 0.42, P.def.word, { color: P.def.color, size: Math.round(U.clamp(P.s * 0.2, 26, 50)), duration: 900 });
        }
      }

      /* ---------------- the buddy ---------------- */
      function look(x) {
        const r = buddy.getBoundingClientRect();
        const dx = U.clamp((x - (r.left + r.width / 2)) / 120, -1, 1) * 5;
        B.pupils.forEach((p) => { p.style.transform = `translateX(${dx}px)`; });
      }
      function react(P) {
        look(P.x);
        if (groove) return;
        B.bod.animate([{ transform: 'translateY(0) scale(1.05,.94)' }, { transform: 'translateY(-14px) scale(.97,1.04)', offset: 0.4 }, { transform: 'translateY(0)' }], { duration: 330, easing: 'ease-out' });
        const arm = P.x < (geo.w || 0) / 2 ? B.armL : B.armR;
        const deg = arm === B.armL ? 70 : -70;
        arm.style.transform = `rotate(${deg}deg)`;
        ctx.setTimeout(() => { if (!groove) arm.style.transform = ''; }, 260);
      }
      function danceBeat(n, bd) {
        const dur = Math.max(200, bd * 1000) * 1.08;
        const move = Math.floor(n / 8) % 3;
        const side = n % 2 ? 1 : -1;
        if (move === 0) {
          B.bod.animate([{ transform: 'translateY(0) scale(1.06,.92)' }, { transform: `translateY(-16px) scale(.97,1.04) rotate(${side * 4}deg)`, offset: 0.42 }, { transform: 'translateY(0) scale(1,1)' }], { duration: dur, easing: 'ease-out' });
          B.armL.style.transform = side < 0 ? 'rotate(115deg)' : 'rotate(10deg)';
          B.armR.style.transform = side > 0 ? 'rotate(-115deg)' : 'rotate(-10deg)';
          B.footL.style.transform = side < 0 ? 'translateY(-9px)' : '';
          B.footR.style.transform = side > 0 ? 'translateY(-9px)' : '';
        } else if (move === 1) {
          B.bod.animate([{ transform: `translateX(${-side * 10}px) rotate(${-side * 7}deg)` }, { transform: `translateX(${side * 12}px) translateY(-6px) rotate(${side * 8}deg)`, offset: 0.55 }, { transform: `translateX(${side * 10}px) rotate(${side * 7}deg)` }], { duration: dur, easing: 'ease-in-out', fill: 'none' });
          B.armL.style.transform = `rotate(${side > 0 ? 60 : 30}deg)`;
          B.armR.style.transform = `rotate(${side > 0 ? -30 : -60}deg)`;
          B.footL.style.transform = side > 0 ? 'translateY(-6px)' : '';
          B.footR.style.transform = side < 0 ? 'translateY(-6px)' : '';
        } else {
          const big = n % 4 === 0;
          B.bod.animate([{ transform: 'translateY(0) scale(1.1,.88)' }, { transform: `translateY(${big ? -30 : -12}px) scale(.95,1.06)`, offset: 0.45 }, { transform: 'translateY(0) scale(1,1)' }], { duration: dur, easing: 'ease-out' });
          B.armL.style.transform = big ? 'rotate(140deg)' : 'rotate(40deg)';
          B.armR.style.transform = big ? 'rotate(-140deg)' : 'rotate(-40deg)';
          B.footL.style.transform = B.footR.style.transform = big ? 'translateY(-4px)' : '';
        }
        B.tuft.animate([{ transform: 'rotate(0)' }, { transform: `rotate(${side * 16}deg)`, offset: 0.5 }, { transform: 'rotate(0)' }], { duration: dur * 1.1, delay: 40 });
        B.shadow.animate([{ transform: 'scale(1)' }, { transform: 'scale(.82)', offset: 0.42 }, { transform: 'scale(1)' }], { duration: dur });
        spot.animate([{ opacity: 1, transform: 'scale(1.06)' }, { opacity: 0.7, transform: 'scale(1)' }], { duration: dur, easing: 'ease-out' });
      }
      function restPose() {
        [B.armL, B.armR, B.footL, B.footR].forEach((e) => { e.style.transform = ''; });
      }
      function cheer() {
        buddy.classList.add('happy');
        B.armL.style.transform = 'rotate(150deg)';
        B.armR.style.transform = 'rotate(-150deg)';
        B.bod.animate([{ transform: 'translateY(0) scale(1.1,.88)' }, { transform: 'translateY(-46px) scale(.94,1.08) rotate(-8deg)', offset: 0.4 }, { transform: 'translateY(-16px) rotate(6deg)', offset: 0.7 }, { transform: 'translateY(0)' }], { duration: 750, iterations: 2, easing: 'ease-out' });
        ctx.setTimeout(() => { buddy.classList.remove('happy'); if (!groove) restPose(); }, 1500);
      }
      ctx.setInterval(() => {
        buddy.classList.add('blink');
        ctx.setTimeout(() => buddy.classList.remove('blink'), 130);
      }, 3400);
      ctx.tap(buddy, (e) => {
        cheer();
        ctx.sfx('boing', { vel: 0.5 });
        if (!groove) startGroove();
      });

      /* ---------------- pads ---------------- */
      function hitPad(P, o) {
        o = o || {};
        const user = !!o.user;
        if (user) { idleN = 0; idleSince = performance.now(); tapsSinceCall++; }
        sound(P, o.vel || 1, o.at);
        hitVisual(P, o.quiet);
        if (!user) return;
        react(P);
        playBtn.classList.remove('invite');
        // name it the first time, then only now and then
        const now = performance.now();
        if (!named.has(P.def.id) && !(call && call.phase === 'demo')) {
          named.add(P.def.id);
          lastTalk = now;
          ctx.say(P.def.name + '!');
        } else if (now - lastTalk > 12000 && Math.random() < 0.12 && !call) {
          lastTalk = now;
          ctx.say(P.def.name + '!', { mode: 'skip' });
        }
        if (groove) checkBeat(ctx.audio.now());
        if (call && call.phase === 'turn') callTap(P);
      }

      /* ---------------- groove ---------------- */
      function startGroove(t) {
        if (t) tempo = t;
        if (groove) { groove.setBpm(TEMPO[tempo]); updateTempoBtns(); return; }
        beatCount = 0;
        streak = 0; lastBeatHit = null;
        groove = ctx.loop({
          bpm: TEMPO[tempo],
          steps: 32,
          stepsPerBeat: 2,
          vel: 0.5,
          tracks: {
            kick: [0.9, 0, 0, 0, 0.6, 0, 0, 0],
            hat: [0.55, 0.85, 0.5, 0.85, 0.55, 0.85, 0.5, 0.85],
          },
          notes: {
            bass: { inst: 'bass', seq: BASS, vel: 0.5, len: 1.7 },
            keys: { inst: 'marimba', seq: KEYS, vel: 0.2, len: 1 },
          },
          onStep(s, when) {
            if (s % 2) return;
            const bd = groove ? groove.beatDur() : 60 / TEMPO[tempo];
            danceBeat(beatCount++, bd);
            pads.forEach((P) => {
              if (call && call.pad === P) return;
              P.plate.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.07)', offset: 0.2 }, { transform: 'scale(1)' }], { duration: Math.min(320, bd * 700), easing: 'ease-out' });
            });
          },
        });
        playBtn.classList.add('on');
        playBtn.classList.remove('invite');
        playBtn.innerHTML = PAUSE;
        dots.style.opacity = 1;
        updateDots();
        updateTempoBtns();
        buddy.querySelector('.bd-bod').style.animation = 'none';
      }
      function stopGroove() {
        if (!groove) return;
        groove.stop();
        groove = null;
        playBtn.classList.remove('on');
        playBtn.innerHTML = PLAY;
        dots.style.opacity = 0;
        restPose();
        buddy.querySelector('.bd-bod').style.animation = '';
        updateTempoBtns();
      }
      function updateTempoBtns() {
        turtleBtn.classList.toggle('on', tempo === 'slow');
        rabbitBtn.classList.toggle('on', tempo === 'fast');
      }
      function press(b) { idleSince = performance.now(); b.classList.add('pressed'); ctx.setTimeout(() => b.classList.remove('pressed'), 140); }
      ctx.tap(playBtn, () => {
        press(playBtn);
        idleN = 0;
        if (groove) { stopGroove(); ctx.sfx('slidedown', { vel: 0.35 }); return; }
        startGroove();
        if (!named.has('_dance')) { named.add('_dance'); ctx.say("Let's dance!"); }
      });
      ctx.tap(turtleBtn, () => {
        press(turtleBtn);
        idleN = 0;
        const next = tempo === 'slow' && groove ? 'mid' : 'slow';
        if (next === 'slow') ctx.say('Slow…', { rate: 0.55, pitch: 0.85 });
        else ctx.sfx('pop', { vel: 0.4 });
        startGroove(next);
      });
      ctx.tap(rabbitBtn, () => {
        press(rabbitBtn);
        idleN = 0;
        const next = tempo === 'fast' && groove ? 'mid' : 'fast';
        if (next === 'fast') ctx.say('Fast!', { rate: 1.45, pitch: 1.4 });
        else ctx.sfx('pop', { vel: 0.4 });
        startGroove(next);
      });

      /* ---------------- steady beat ---------------- */
      function needBeats() { return [4, 4, 4, 5, 6, 8][ctx.level] || 4; }
      function updateDots() {
        const n = needBeats();
        while (dots.children.length < n) dots.appendChild(ctx.el('div', { class: 'bd-dot' }));
        while (dots.children.length > n) dots.lastChild.remove();
        [...dots.children].forEach((d, i) => d.classList.toggle('on', i < streak));
      }
      function checkBeat(now) {
        if (!groove) return;
        const ac = ctx.audio.ctx;
        const lat = ac ? Math.min(0.08, ac.outputLatency || ac.baseLatency || 0) : 0;
        if (now - lastBeatTap < 0.12) return; // second hand of a two-handed whack
        lastBeatTap = now;
        const t = now - lat;
        const bd = groove.beatDur(), bt = groove.beatTime();
        let best = bt, err = Infinity;
        [bt - 2 * bd, bt - bd, bt, bt + bd].forEach((c) => { const e = Math.abs(t - c); if (e < err) { err = e; best = c; } });
        const win = ctx.level >= 5 ? 0.11 : 0.13;
        if (err <= win) {
          if (lastBeatHit != null && Math.abs(best - lastBeatHit) < bd * 0.3) return; // same beat
          const g = lastBeatHit == null ? 0 : (best - lastBeatHit) / bd;
          streak = lastBeatHit != null && g > 0.6 && g < 2.4 ? streak + 1 : 1;
          lastBeatHit = best;
          const d = dots.children[Math.min(streak, dots.children.length) - 1];
          if (d) d.animate([{ transform: 'scale(1.8)' }, { transform: 'scale(1.25)' }], { duration: 250, easing: 'ease-out' });
          updateDots();
          if (streak >= needBeats()) beatReward();
        } else {
          streak = 0;
          lastBeatHit = null;
          updateDots();
        }
      }
      function beatReward() {
        const now = performance.now();
        streak = 0;
        lastBeatHit = null;
        if (now - lastBeatPraise < 22000 || call) { ctx.setTimeout(updateDots, 300); return; }
        lastBeatPraise = now;
        const r = buddy.getBoundingClientRect();
        ctx.sfx('sparkle', { vel: 0.6 });
        PP.fx.burst(r.left + r.width / 2, r.top + r.height * 0.3, { emoji: ['✨', '⭐', '🌟'], count: 10, distance: Math.max(110, r.width * 0.7) });
        cheer();
        ctx.success(true);
        ctx.celebrate({ x: r.left + r.width / 2, y: r.top + r.height * 0.4, say: "You're keeping the beat!", sound: false });
        ctx.setTimeout(updateDots, 400);
      }

      /* ---------------- call & response (level 3+) ---------------- */
      function placePip(P) {
        // Pip hops in beside the buddy, on the side of the instrument it's about to play
        const el = ctx.mascot.el;
        if (!el || !geo.buddy) return;
        const s = geo.pip, b = geo.buddy;
        el.style.width = el.style.height = s + 'px';
        const left = P.x < geo.w / 2;
        let x = left ? b.x + b.w * 0.12 - s * 0.6 : b.x + b.w * 0.88 - s * 0.4;
        let y = b.y + b.h - s * 0.92;
        x = U.clamp(x, 6, geo.w - s - 6);
        y = U.clamp(y, 6, geo.h - s - 6);
        if (x < 104 && y < 104) y = 104;
        Object.assign(el.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto' });
      }
      function showPip(P) {
        const m = ctx.mascot.show({ corner: 'none', size: geo.pip + 'px' });
        m.el.dataset.corner = 'none';
        placePip(P);
        m.el.animate([{ transform: 'scale(0) translateY(40px)', opacity: 0 }, { transform: 'scale(1.1)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' });
        ctx.mascot.mood('wave');
      }
      function hidePip() {
        const el = ctx.mascot.el;
        if (!el || el.style.display === 'none') return;
        const a = el.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0) translateY(40px)', opacity: 0 }], { duration: 300, easing: 'ease-in' });
        a.onfinish = () => { if (!call) ctx.mascot.hide(); };
      }
      function placeStick(P) {
        const s = P.s * 0.55;
        put(stick, P.x - s * 0.08, P.y - s * 0.95, s);
      }
      /** schedule the pattern on the audio clock (locked to the groove's beat when it's playing) */
      function demoPattern(c) {
        const P = c.pad, pat = c.pattern;
        const now = ctx.audio.now();
        let t0, unit;
        if (groove) {
          unit = groove.beatDur();
          t0 = groove.beatTime();
          while (t0 < now + 0.3) t0 += unit;
        } else {
          unit = 0.5;
          t0 = now + 0.3;
        }
        placeStick(P);
        stick.classList.add('on');
        pat.forEach((p) => {
          const when = t0 + p * unit;
          sound(P, 0.95, when);
          ctx.setTimeout(() => {
            if (call !== c) return;
            hitVisual(P);
            stick.animate([{ transform: 'rotate(-30deg)' }, { transform: 'rotate(4deg)', offset: 0.3 }, { transform: 'rotate(-30deg)' }], { duration: 260, easing: 'ease-out' });
            ctx.mascot.mood('happy');
          }, Math.max(0, (when - now) * 1000));
        });
        const end = t0 + pat[pat.length - 1] * unit + 0.35;
        return ctx.wait(Math.max(0, (end - now) * 1000)).then(() => stick.classList.remove('on'));
      }
      async function startCall() {
        const lvl = ctx.level;
        const P = ctx.pick(pads.filter((p) => named.has(p.def.id)).concat(pads.slice(0, 1)));
        let pattern = P.def.pattern;
        if (lvl >= 5 && Math.random() < 0.5) pattern = pattern.length === 2 ? [0, 1, 1.5] : [0, 0.5, 1, 2];
        const c = { pad: P, pattern, need: lvl >= 4 ? pattern.length : 2, got: 0, others: 0, tries: 0, phase: 'demo', pip: true };
        call = c;
        showPip(P);
        ctx.setPrompt('Your turn!');
        await ctx.say('Listen!');
        if (call !== c) return;
        await demoRound(c);
      }
      async function demoRound(c) {
        c.phase = 'demo';
        c.got = 0;
        c.pad.el.classList.remove('callme');
        const said = ctx.say(c.pad.def.call);
        await Promise.all([demoPattern(c), said]);
        if (call !== c) return;
        c.phase = 'turn';
        c.turnAt = performance.now();
        c.pad.el.classList.add('callme');
        ctx.mascot.mood('wave');
        ctx.say('Your turn!');
      }
      function callTap(P) {
        const c = call;
        if (P !== c.pad) { c.others++; return; }
        c.got++;
        c.turnAt = performance.now();
        if (c.got >= c.need) {
          c.phase = 'done';
          endCall(true);
        }
      }
      async function endCall(ok) {
        const c = call;
        if (!c) return;
        c.pad.el.classList.remove('callme');
        stick.classList.remove('on');
        if (ok) {
          ctx.success(c.tries === 0 && c.others <= 2);
          cheer();
          ctx.mascot.mood('cheer');
          await ctx.celebrate({ x: c.pad.x, y: c.pad.y, say: ctx.pick(['You did it!', 'Just like me!', 'Great copying!', 'Yay! Same!']), sound: 'sparkle' });
        } else {
          ctx.mascot.mood('wave');
          ctx.say("Let's play!");
          await ctx.wait(900);
        }
        if (call !== c) return;
        call = null;
        hidePip();
        lastCallEnd = performance.now();
        tapsSinceCall = 0;
        ctx.setPrompt('Tap the drums!');
      }
      ctx.setInterval(() => {
        const now = performance.now();
        if (call) {
          // child's turn: gentle re-demo once, then let it go
          if (call.phase === 'turn' && now - call.turnAt > 7500 && !PP.speech.speaking()) {
            if (call.tries < 1) { call.tries++; ctx.say('Listen again!').then(() => { if (call && call.phase === 'turn') demoRound(call); }); call.turnAt = now + 4000; }
            else { if (call.got === 0) ctx.miss(); endCall(false); }
          }
          return;
        }
        if (ctx.level < 3 || PP.speech.speaking() || PP.app.overlayPromise) return;
        const gapMs = ctx.level >= 4 ? 20000 : 28000;
        if (now - lastCallEnd > gapMs && tapsSinceCall >= 8 && now - idleSince < 6000) startCall();
      }, 1000);

      /* ---------------- idle ---------------- */
      ctx.idle(8000, () => {
        if (call) return;
        idleN++;
        if (groove && performance.now() - idleSince > 45000) { stopGroove(); return; }
        if (idleN > 5) return;
        if (groove) {
          ctx.say(ctx.pick(['Tap along!', 'Boom, boom! Tap along!']));
          pads.forEach((P, k) => ctx.setTimeout(() => P.inner.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 380 }), k * 80));
        } else if (idleN % 2 === 1) {
          const P = ctx.pick(pads);
          ctx.say(`Tap the ${P.def.name.toLowerCase()}!`);
          P.el.classList.add('callme');
          ctx.setTimeout(() => { if (!call || call.pad !== P) P.el.classList.remove('callme'); }, 2600);
        } else {
          ctx.say('Press play!');
          playBtn.classList.add('invite');
        }
      });

      /* ---------------- go ---------------- */
      stage.__bd = { state: () => ({ groove: !!groove, tempo, streak, call: call && { pad: call.pad.def.id, phase: call.phase, got: call.got, need: call.need }, named: [...named], bpm: groove && groove.bpm }), startCall: () => startCall(), pads: () => pads.map((P) => ({ id: P.def.id, x: P.x, y: P.y, s: P.s })), loop: () => groove };
      layout();
      ctx.onResize(layout);
      ctx.setPrompt('Tap the drums!');
      ctx.setTimeout(() => ctx.say('Tap the drums!'), 450);
      return { destroy() { if (groove) groove.stop(); } };
    },
  });
})();

</script>
<script data-src="games/music-xylophone.js">
/* Xylophone — tap the rainbow bars, then "play" real nursery songs in magic mode.
 *
 * Music skills: cause & effect, high (short bars) vs low (long bars), and the melody + rhythm of real tunes.
 *   Level 1: short song versions, ANY tap plays the next note (glow + mallet show where it comes from).
 *   Level 2: full songs, any tap plays the next note.
 *   Level 3: tap the glowing bar (a mallet points at it); other bars just play softly — no penalty.
 *   Level 4: glow only.
 *   Level 5: the glow appears only after a short pause (play it from memory / by ear).
 * A soft piano + bass accompaniment (correct harmony) follows every melody note.
 * "Listen" plays the whole song (melody + oom-pah accompaniment) while a mallet strikes the bars.
 * Happy Birthday is played in F, so — like a real Orff xylophone — the B bar is swapped for a B-flat bar.
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;

  /* ======================= the instrument ======================= */
  const BARS = [
    { n: 'C4', letter: 'C', color: '#EF3B36', word: 'red' },
    { n: 'D4', letter: 'D', color: '#FF8C1A', word: 'orange' },
    { n: 'E4', letter: 'E', color: '#FFC81A', word: 'yellow' },
    { n: 'F4', letter: 'F', color: '#3DBE4B', word: 'green' },
    { n: 'G4', letter: 'G', color: '#14B8AE', word: 'teal' },
    { n: 'A4', letter: 'A', color: '#2F7BEA', word: 'blue' },
    { n: 'B4', letter: 'B', color: '#8E4FD6', word: 'purple' },
    { n: 'C5', letter: 'C', color: '#FF4D8D', word: 'pink' },
  ];
  const B_FLAT = { n: 'Bb4', letter: 'B♭', color: '#6A4FE3', word: 'purple' };
  // Real bars shrink ~1/sqrt(f); exaggerate a little so "short = high" is obvious.
  const barLen = (note) => Math.pow(2, -((PP.audio.midi(note) - 60) / 12) * 0.62);
  const barIndexFor = (n) => (n === 'Bb4' ? 6 : BARS.findIndex((b) => b.n === n));

  /* ======================= harmony ======================= */
  // Close voicings below the melody (E3..C4) + a bass line kept between F2 and E3.
  const CHORDS = {
    C: { bass: 'C3', b5: 'G2', v: ['E3', 'G3', 'C4'] },
    F: { bass: 'F2', b5: 'C3', v: ['F3', 'A3', 'C4'] },
    G: { bass: 'G2', b5: 'D3', v: ['D3', 'G3', 'B3'] },
    G7: { bass: 'G2', b5: 'D3', v: ['D3', 'F3', 'B3'] },
    C7: { bass: 'C3', b5: 'G2', v: ['E3', 'G3', 'Bb3'] },
    F7: { bass: 'F2', b5: 'C3', v: ['Eb3', 'A3', 'C4'] },
    Bb: { bass: 'Bb2', b5: 'F2', v: ['D3', 'F3', 'Bb3'] },
    D7: { bass: 'D3', b5: 'A2', v: ['F#3', 'A3', 'C4'] },
  };
  const BAR_BEATS = { '4/4': 4, '3/4': 3, '6/8': 3 }; // in quarter-note beats

          const gap = Math.min(26, (avail - n * s) / (n - 1));
          const rowW = n * s + (n - 1) * gap;
          let x = x0 + (avail - rowW) / 2;
          const y = S.t + m;
          btns.forEach((b) => { place(b, x, y, s); x += s + gap; });
          area = { l: S.l + m, r: w - S.r - m, t: y + s + m * 1.3, b: h - S.b - m };
        } else {
          const y0 = S.t + m, y1 = h - S.b - m;
          const avail = y1 - y0;
          s = Math.max(60, Math.min(s, Math.floor((avail - (n - 1) * 8) / n)));
          const gap = Math.min(30, (avail - n * s) / (n - 1));
          const colH = n * s + (n - 1) * gap;
          const x = w - S.r - m - s;
          let y = y0 + (avail - colH) / 2;
          // listen first (top), then songs
          [listenBtn].concat(songBtns).forEach((b) => { place(b, x, y, s); y += s + gap; });
          area = { l: S.l + m, r: x - m * 1.2, t: S.t + HOME, b: h - S.b - m };
        }
        // leave room for the rails' end knobs
        const k = U.clamp(Math.min(w, h) * 0.045, 16, 40);
        if (!portrait) { area.l += k; area.r -= k; } else { area.t += k * 0.6; area.b -= k; }
        layoutBars(area);
        drawFrame();
        const hr = U.clamp(thick * 0.3, 14, 30);
        malletGeo = malletSVG(hr);
        malletGeo.hr = hr;
        malletIn.innerHTML = malletGeo.svg;
        malletIn.style.transformOrigin = `${malletGeo.ox}px ${malletGeo.oy}px`;
        if (mode === 'magic') showNext(true);
      }
      function place(b, x, y, s) {
        Object.assign(b.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px' });
        b.style.setProperty('--s', s + 'px');
      }
      function layoutBars(a) {
        const W = a.r - a.l, H = a.b - a.t;
        if (!portrait) {
          const pitch = W / 8;
          thick = Math.round(Math.min(pitch * 0.8, 132, H * 0.3));
          const gap = Math.min(pitch - thick, thick * 0.34);
          const total = 8 * thick + 7 * gap;
          const x0 = a.l + (W - total) / 2;
          const cy = a.t + H / 2;
          barEls.forEach((B, i) => {
            const len = Math.round(H * barLen(B.def.n));
            B.rect = { x: x0 + i * (thick + gap), y: cy - len / 2, w: thick, h: len };
            B.len = len;
            B.gap = gap;
            renderBar(B);
          });
        } else {
          const pitch = H / 8;
          thick = Math.round(Math.min(pitch * 0.8, 120, W * 0.32));
          const gap = Math.min(pitch - thick, thick * 0.3);
          const total = 8 * thick + 7 * gap;
          const y0 = a.t + (H - total) / 2;
          const cx = a.l + W / 2;
          barEls.forEach((B, i) => {
            const len = Math.round(W * barLen(B.def.n));
            B.rect = { x: cx - len / 2, y: y0 + (7 - i) * (thick + gap), w: len, h: thick };
            B.len = len;
            B.gap = gap;
            renderBar(B);
          });
        }
      }
      function renderBar(B) {
        const r = B.rect;
        Object.assign(B.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
        const t = portrait ? r.h : r.w;
        const sd = Math.max(4, Math.round(t * 0.09));
        B.el.style.setProperty('--sd', sd + 'px');
        B.el.style.setProperty('--r', Math.round(t * 0.26) + 'px');
        B.el.style.setProperty('--c', U.rgba(B.def.color, 0.75));
        B.art.innerHTML = barSVG(B.def, r.w, r.h, !portrait);
        B.t = t;
        B.sd = sd;
      }
      function drawFrame() {
        const { w, h } = ctx.size();
        frame.setAttribute('width', w);
        frame.setAttribute('height', h);
        frame.setAttribute('viewBox', `0 0 ${w} ${h}`);
        const rw = Math.max(10, thick * 0.24);
        const rails = [[], []];
        barEls.forEach((B) => {
          const r = B.rect;
          if (!portrait) {
            const x = r.x + r.w / 2, fh = r.h - B.sd;
            rails[0].push([x, r.y + fh * 0.224]);
            rails[1].push([x, r.y + fh * 0.776]);
          } else {
            const y = r.y + (r.h - B.sd) / 2;
            rails[0].push([r.x + r.w * 0.224, y]);
            rails[1].push([r.x + r.w * 0.776, y]);
          }
        });
        const ext = (pts) => {
          // extend the rail a little past the first/last bar
          const a = pts[0], b = pts[1], y = pts[pts.length - 1], z = pts[pts.length - 2];
          const e = thick * 0.42;
          const da = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, dz = Math.hypot(y[0] - z[0], y[1] - z[1]) || 1;
          return [[a[0] + (a[0] - b[0]) / da * e, a[1] + (a[1] - b[1]) / da * e]].concat(pts, [[y[0] + (y[0] - z[0]) / dz * e, y[1] + (y[1] - z[1]) / dz * e]]);
        };
        let svg = '';
        rails.forEach((pts) => {
          const p = ext(pts);
          const d = 'M' + p.map((q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
          svg += `<path d="${d}" stroke="rgba(80,40,10,.18)" stroke-width="${rw + 8}" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0 6)"/>`;
          svg += `<path d="${d}" stroke="#9C6230" stroke-width="${rw + 5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
          svg += `<path d="${d}" stroke="#D99A5B" stroke-width="${rw}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
          svg += `<path d="${d}" stroke="#F2C48D" stroke-width="${rw * 0.28}" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".8" transform="translate(${-rw * 0.15} ${-rw * 0.18})"/>`;

      }

      /* ---------------- sound ---------------- */
      function panFor(i) { return (i - 3.5) / 3.5 * 0.45; }
      function noteSound(i, vel, when) {
        const n = barEls[i].def.n;
        const o = { vel, pan: panFor(i) };
        if (when) o.at = when;
        ctx.play('xylo', n, o);
        ctx.play('marimba', n, Object.assign({}, o, { vel: vel * 0.3 }));
      }
      function accomp(chName, kind, when, beat) {
        const ch = CHORDS[chName];
        if (!ch) return;
        if (kind === 'bass') ctx.play('bass', ch.bass, { at: when, dur: beat * 0.9, vel: 0.42 });
        else if (kind === 'bass5') ctx.play('bass', ch.b5, { at: when, dur: beat * 0.9, vel: 0.34 });
        else if (kind === 'chord') ctx.play('piano', ch.v, { at: when, dur: beat * 0.8, vel: 0.24 });
        else if (kind === 'final') {
          ctx.play('piano', ch.v, { at: when, dur: beat * 2.5, vel: 0.32 });
          ctx.play('bass', ch.bass, { at: when, dur: beat * 2.5, vel: 0.45 });
        }
      }
      /** soft accompaniment under a note the child just "played" in magic mode */
      function accompanyLive(k) {
        const ev = notes[k];
        if (!ev.chord) return;
        const pos = ev.t - song.pickup;
        const bb = BAR_BEATS[song.meter];
        const inBar = ((pos % bb) + bb) % bb;
        const near = (arr) => arr.some((p) => Math.abs(p - inBar) < 0.01);
        const nowMs = performance.now();
        const stale = nowMs - lastChordAt > 1600;
        const ch = CHORDS[ev.chord];
        if (ev.change || near(STRONG[song.meter]) || stale) {
          ctx.play('piano', ch.v, { dur: 1.1, vel: 0.3 });
          ctx.play('bass', ch.bass, { dur: 0.9, vel: 0.4 });
          lastChordAt = nowMs;
        } else if (near(WEAK[song.meter])) {
          ctx.play('piano', ch.v, { dur: 0.7, vel: 0.17 });
          lastChordAt = nowMs;
        }
      }

      /* ---------------- visuals ---------------- */
      function barCenter(i) {
        const B = barEls[i], r = B.rect;
        return { x: r.x + r.w / 2, y: r.y + (r.h - B.sd) / 2 };
      }
      function hitBar(i, o) {
        o = o || {};
        const B = barEls[i];
        const soft = o.soft;
        const sx = portrait ? 1.02 : 0.9, sy = portrait ? 0.9 : 1.02;
        B.inner.animate([
          { transform: 'none' },
          { transform: `scale(${soft ? (1 + sx) / 2 : sx}, ${soft ? (1 + sy) / 2 : sy})`, offset: 0.14 },
          { transform: `scale(${2 - sx * 0.98}, ${2 - sy * 0.98}) rotate(${portrait ? 0.8 : 1.2}deg)`, offset: 0.38 },
          { transform: `rotate(${portrait ? -0.5 : -0.8}deg)`, offset: 0.6 },
          { transform: `rotate(${portrait ? 0.25 : 0.4}deg)`, offset: 0.8 },
          { transform: 'none' },
        ], { duration: soft ? 300 : 460, easing: 'ease-out' });
        B.flash.animate([{ opacity: soft ? 0.25 : 0.6 }, { opacity: 0 }], { duration: soft ? 180 : 320, easing: 'ease-out' });
        if (!soft) B.glow.animate([{ opacity: 0.95 }, { opacity: 0 }], { duration: 650, easing: 'ease-out' });
        const c = barCenter(i);
        const x = o.x == null ? c.x : o.x, y = o.y == null ? c.y : o.y;
        burstNotes(x, y, B.def.color, soft ? 1 : o.big ? 3 : 2);
      }
      let liveNotes = 0;
      function burstNotes(x, y, color, n) {
        for (let k = 0; k < n; k++) {
          if (liveNotes > 36) return;
          liveNotes++;
          const e = ctx.el('div', { class: 'xy-note', text: ctx.pick(['♪', '♫', '♪', '♬']), style: { color, fontSize: Math.round(U.clamp(thick * 0.5, 26, 54) * ctx.rand(0.8, 1.15)) + 'px' } });
          fx.appendChild(e);
          const dx = ctx.rand(-60, 60), dy = -ctx.rand(70, 150), rot = ctx.rand(-30, 30);
          const a = e.animate([
            { transform: `translate(${x}px, ${y}px) translate(-50%,-50%) scale(.4) rotate(0deg)`, opacity: 0 },
            { transform: `translate(${x + dx * 0.4}px, ${y + dy * 0.4}px) translate(-50%,-50%) scale(1.1) rotate(${rot * 0.5}deg)`, opacity: 1, offset: 0.3 },
            { transform: `translate(${x + dx}px, ${y + dy}px) translate(-50%,-50%) scale(.9) rotate(${rot}deg)`, opacity: 0 },

      }
      function wave(up, withSound) {
        const order = up ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];

        order.forEach((i, k) => {
          if (withSound) noteSound(i, 0.22, t0 + k * 0.07);
          ctx.setTimeout(() => {
            const B = barEls[i];
            B.inner.animate([{ transform: 'none' }, { transform: portrait ? 'translateX(-10px) scale(1.04)' : 'translateY(-14px) scale(1.04)', offset: 0.4 }, { transform: 'none' }], { duration: 420, easing: 'ease-in-out' });

        });
      }
      function moveMallet(i) {
        if (!malletGeo) return;

        mallet.style.top = c.y - malletGeo.hr + 'px';
      }
      function strike(dur) {
        malletIn.animate([
          { transform: 'rotate(-26deg)' },
          { transform: 'rotate(2deg)', offset: 0.3 },
          { transform: 'rotate(-18deg)' },

      function ringOff() { ring.classList.remove('on'); }

      /* ---------------- B / B-flat swap (Orff style) ---------------- */
      function setFlat(on) {
        if (flat === on) return;
        flat = on;
        const B = barEls[6];
        const ax = portrait ? 'scaleY' : 'scaleX';

        };
        ctx.sfx('magic', { vel: 0.35 });
      }

      /* ---------------- free play ---------------- */
      function freeTap(i, x, y, glide) {
        noteSound(i, glide ? 0.6 : 0.78);
        hitBar(i, { x, y });
        if (mode !== 'free' || demo) return;
        const now = performance.now();
        if ((i === 0 || i === 7) && now - lastHiLo > 22000 && Math.random() < 0.6 && !glide) {
          lastHiLo = now;
          ctx.setTimeout(() => {
            if (i === 0) ctx.say('Low!', { mode: 'skip', pitch: 0.6, rate: 0.8 });
            else ctx.say('High!', { mode: 'skip', pitch: 1.9, rate: 1.05 });
          }, 250);
        }
      }

      /* ---------------- songs / magic mode ---------------- */
      function setActiveBtn() {
        songBtns.forEach((b, k) => b.classList.toggle('on', !!song && SONGS[k] === song && mode !== 'free'));
        listenBtn.classList.toggle('on', !!(demo && demo.kind === 'full'));

      }
      function pickSong(s, opts) {
        opts = opts || {};
        stopDemo();

        }
        song = s;
        notes = versionFor(s, ctx.level);
        idx = 0;
        offTaps = 0;
        missDone = false;
        lastAdvance = 0;
        mode = 'magic';
        idleCount = 0;
        setFlat(s.flat);
        setActiveBtn();
        showNext();
        ctx.setPrompt(ctx.level >= 3 ? 'Tap the sparkly bar!' : 'Tap, tap, tap!');

        (async () => {
          await ctx.say(s.title + '!');

          if (lvl >= 3 && !hintedOnce.aim) { hintedOnce.aim = true; ctx.say('Tap the sparkly bar!', { mode: 'queue' }); }
          else if (lvl < 3 && !hintedOnce.any) { hintedOnce.any = true; ctx.say('Tap, tap, tap!', { mode: 'queue' }); }

      }
      function targetIndex() { return notes && idx < notes.length ? barIndexFor(notes[idx].n) : -1; }
      function showNext(instant) {

        if (ti < 0 || mode !== 'magic') { ringOff(); mallet.classList.remove('on'); return; }
        const lvl = ctx.level;
        const useMallet = lvl <= 3;
        if (useMallet) { moveMallet(ti); mallet.classList.add('on'); } else mallet.classList.remove('on');
        if (lvl >= 5 && !instant) {

        } else {

        }
      }
      function magicTap(i, x, y, glide) {

        const lvl = ctx.level;
        const now = performance.now();
        if (lvl <= 2 || i === ti) {
          if (now - lastAdvance < 130) { hitBar(i, { soft: true, x, y }); return; }
          lastAdvance = now;

          // aiming levels: other bars just play softly — never a penalty
          offTaps++;

          if (offTaps % 4 === 0) {
            ringTo(ti);
            if (lvl <= 3) strike(300);
            ctx.say(`The ${barEls[ti].def.word} one!`, { mode: 'skip' });
          }

        }
      }
      function playSongNote(k) {
        const ev = notes[k];
        const bi = barIndexFor(ev.n);
        noteSound(bi, 0.85);
        hitBar(bi, { big: true });
        accompanyLive(k);
        if (mallet.classList.contains('on')) { moveMallet(bi); strike(220); }

      }
      async function finishSong() {
        const s = song;
        mode = 'done';

        mallet.classList.remove('on');

        wave(true, false);
        // a little cadence in the song's key, then applause
        const tonic = PP.audio.midi(s.key);
        const t0 = ctx.audio.now() + 0.05;
        [0, 4, 7, 12].forEach((iv, k) => ctx.play('bell', tonic + 12 + iv, { at: t0 + k * 0.08, vel: 0.28 }));
        ctx.sfx('applause', { vel: 0.75, delay: 0.25 });
        ctx.success(firstTry);

      }

      /* ---------------- demonstrations ---------------- */
      function stopDemo() {

        demo = null;

        if (mode === 'magic') showNext(true);
        else mallet.classList.remove('on');
      }
      /** Play list[from..to) at the song's tempo with accompaniment; the mallet strikes along. */
      function playDemo(s, list, from, to, kind) {
        stopDemo();
        const beat = 60 / s.bpm;
        const t0 = list[from].t;
        const items = [];
        for (let k = from; k < to; k++) {
          const ev = list[k];
          const bi = barIndexFor(ev.n);
          const dur = ev.d * beat;
          items.push({ t: (ev.t - t0) * beat, a: (when) => noteSound(bi, 0.75, when), v: () => { moveMallet(bi); strike(dur * 1000); hitBar(bi); } });
        }

            const gb = bar + p;

          });

        const lastCh = chordAt(list, last.t);

        const ok = await playDemo(s, list, 0, list.length, 'full');

      }
      /** idle help: play the next little phrase from where the child is, then hand it back */
      async function phraseHint() {
        if (!notes) return;

        ctx.say('Your turn!');
      }
      async function freeDemo() {
        const s = ctx.pick(SONGS.slice(0, 5));
        const list = s.notes;
        let to = 0;
        while (to < list.length && to < 8) { to++; if (list[to - 1].d >= 2) break; }
        await ctx.say(s.title + '!');
        if (mode !== 'free' || demo) return;
        setFlat(s.flat);
        const ok = await playDemo(s, list, 0, to, 'phrase');
        if (!ok || mode !== 'free') { if (mode === 'free') setFlat(false); return; }
        pickSong(s, { silent: true, force: true });
        ctx.say('Your turn!');
      }

      /* ---------------- input: multi-touch + glissando ---------------- */
      function hitTest(x, y, strict) {
        let best = -1, bestD = 1e9;
        barEls.forEach((B, i) => {
          const r = B.rect;
          if (!r) return;
          const padX = strict ? 0 : portrait ? 14 : B.gap / 2 + 1;
          const padY = strict ? 0 : portrait ? B.gap / 2 + 1 : 14;
          if (x >= r.x - padX && x <= r.x + r.w + padX && y >= r.y - padY && y <= r.y + r.h + padY) {
            const c = barCenter(i);
            const d = portrait ? Math.abs(y - c.y) : Math.abs(x - c.x);
            if (d < bestD) { bestD = d; best = i; }
          }
        });
        return best;
      }
      const pointers = new Map();
      function onBar(i, x, y, glide) {
        idleCount = 0;
        if (mode === 'magic' && !(demo && demo.kind === 'full')) magicTap(i, x, y, glide);
        else if (demo && demo.kind === 'full') { noteSound(i, 0.4); hitBar(i, { soft: true, x, y }); }
        else freeTap(i, x, y, glide);
      }
      ctx.on(stage, 'pointerdown', (e) => {
        if (e.target.closest && e.target.closest('.xy-btn, .pp-game-pip')) return;
        e.preventDefault();
        const i = hitTest(e.clientX, e.clientY, false);
        pointers.set(e.pointerId, i);
        if (i >= 0) onBar(i, e.clientX, e.clientY, false);
        else burstNotes(e.clientX, e.clientY, ctx.pick(BARS).color, 1);
      });
      ctx.on(stage, 'pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        const i = hitTest(e.clientX, e.clientY, true);
        if (i >= 0 && i !== pointers.get(e.pointerId)) {
          pointers.set(e.pointerId, i);
          onBar(i, e.clientX, e.clientY, true);
        } else if (i < 0 && hitTest(e.clientX, e.clientY, false) < 0) {
          pointers.set(e.pointerId, -1);
        }
      });
      const up = (e) => pointers.delete(e.pointerId);
      ctx.on(stage, 'pointerup', up);
      ctx.on(stage, 'pointercancel', up);

      /* ---------------- idle help ---------------- */
      ctx.idle(7500, () => {
        if (demo) return;
        idleCount++;
        if (idleCount > 6) return; // don't nag forever
        if (mode === 'magic') {
          const ti = targetIndex();
          if (ti < 0) return;
          if (idleCount % 2 === 1) {
            ringTo(ti);
            moveMallet(ti);
            if (ctx.level <= 3) { mallet.classList.add('on'); strike(320); }
            ctx.say(ctx.level <= 2 ? ctx.pick(['Keep playing!', 'Tap, tap, tap!']) : `Tap the ${barEls[ti].def.word} one!`);
          } else {
            phraseHint();
          }
        } else if (mode === 'free') {
          const k = idleCount % 3;
          if (k === 1) { ctx.say('Tap the bars!'); wave(true, true); }
          else if (k === 2) { ctx.say('Pick a song!'); wiggleSongs(); }
          else freeDemo();
        }
      });

      /* ---------------- go ---------------- */
      // read-only hook for automated tests
      stage.__xy = { state: () => ({ mode, idx, n: notes ? notes.length : 0, target: targetIndex(), song: song && song.id, demo: demo && demo.kind, flat, portrait, thick }), bars: () => barEls.map((B) => B.rect) };
      layout();
      ctx.onResize(layout);
      ctx.setPrompt('Tap the bars!');
      ctx.setTimeout(() => { wave(true, true); ctx.say('Tap the bars!'); }, 500);

      return { destroy() { stopDemo(); } };
    },
  });
})();

</script>

 * them with the child (fish light up one by one), then 2–3 numeral bubbles are offered.

  PP.registerGame({

      <circle cx="40" cy="56" r="34" fill="url(#bb-ic)"/><ellipse cx="28" cy="38" rx="8" ry="5" fill="#fff" transform="rotate(-35 28 38)"/>
      <text x="40" y="70" text-anchor="middle" font-size="40" font-weight="900" fill="#fff" stroke="#1D3B7A" stroke-width="4" paint-order="stroke" font-family="system-ui, sans-serif">2</text>
      <circle cx="80" cy="26" r="16" fill="url(#bb-ic)"/><circle cx="78" cy="68" r="9" fill="url(#bb-ic)"/></svg>`,
    tileColor: '#1FA9E1',
    order: 21,
    create(stage, ctx) {
      /* ---------- scene ---------- */

      const wave = ctx.el('div', { class: 'bb-wave', html: WAVE });

      function measure() {

        const s = Math.min(w, h);

      function place(el, x, y, w, h) {

      function layout() {

        bubbles.forEach((b) => {

      /* ---------- state ---------- */
      const bubbles = [];

      /* ---------- bubbles ---------- */
      function makeBubble(n, x, y, o) {

      function spawn(forceN) {

      }
      function riseSpeed() {

      function posBubble(b) {

      /** Pop animation (+ droplets). loud=false for the quiet "reached the surface" pop. */

      function spawnInterval() { return (G.waterH / riseSpeed()) / G.conc; }

      /* ---------- fish friends ---------- */
      function makeFriend(i) {

      /* ---------- little decorative bubbles ---------- */

      /* ---------- "How many fish?" ---------- */
      /** Geometry of the "how many" round: the school of fish on top, a row of answer bubbles below, centred in the water. */
      function hmGeom(n, nc) {
        const left = G.safe.l + 12, right = G.w - G.safe.r - 12, W = right - left;
        let size = U.clamp(G.s * 0.2, 70, 150);

        ctx.setPrompt(reprompt);

        let wrong = 0, hintedHM = false;
        const right = choices.find((c) => c.n === n);
        const stopIdle = ctx.idle(7000, () => {

        const top = G.surfaceY;
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          b.t += dt;
          b.y -= b.speed * dt;
          b.x = b.x0 + Math.sin(b.t * 1.9 + b.ph) * b.amp;
          if (b.y - b.D * 0.5 < top + 4) {
            // reached the surface: quiet pop
            b.popped = true;
            bubbles.splice(i, 1);
            popFx(b, false);
            continue;
          }
          posBubble(b);
        }
        if (mode === 'play' || mode === 'celebrate' || mode === 'intro') {
          spawnClock += dt;
          const iv = spawnInterval();
          if (mode !== 'celebrate' && spawnClock >= iv && bubbles.length < G.conc + 2) {
            spawnClock = U.rand(-0.25, 0.25) * iv;
            spawn();
          }
        }
        for (const f of friends) {
          f.t += dt;
          if (f.boost > 0) f.boost = Math.max(0, f.boost - dt * 1.4);
          const sp = f.speed * (1 + f.boost * 7);
          f.x += f.dir * sp * dt;
          const m = f.size * 0.6;
          if (f.boost > 0.05) {
            if (f.x > G.w + m * 1.5) f.x = -m * 1.4;
            else if (f.x < -m * 1.5) f.x = G.w + m * 1.4;
          } else if (f.x > G.w - m && f.dir > 0) f.dir = -1;
          else if (f.x < m && f.dir < 0) f.dir = 1;
          placeFriend(f);
        }
      });

      /* ---------- input ---------- */
      ctx.on(stage, 'pointerdown', (e) => {
        if (e.button > 0) return;
        const t = e.target;
        if (!t || !t.closest || t.closest('.pp-game-pip')) return;
        const be = t.closest('.bb-bubble');
        if (be && be._bb) { e.preventDefault(); tapBubble(be._bb); return; }
        const ce = t.closest('.bb-choice');
        if (ce && ce._ch) { e.preventDefault(); if (choiceTap) choiceTap(ce._ch); return; }
        const sf = t.closest('.bb-fish');
        if (sf && sf._fr) { dart(sf._fr); return; }
        if (sf && sf._sf) {
          sf.classList.remove('hl'); void sf.offsetWidth; sf.classList.add('hl');
          ctx.sfx('bubble', { vel: 0.5 });
          return;
        }
        if (t.closest('.bb-octo')) {
          ctx.sfx('boing', { vel: 0.5 });
          octo.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.15,.85)' }, { transform: 'scale(.92,1.1)' }, { transform: 'scale(1,1)' }], { duration: 500, easing: 'ease-out' });
          const r = octo.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          miniBubbles(r.left - sr.left + r.width * 0.5, r.top - sr.top + r.height * 0.1, 5);
          return;
        }
        if (t.closest('.bb-badge')) {
          badge.classList.remove('pulse'); void badge.offsetWidth; badge.classList.add('pulse');
          ctx.sfx('ding', { vel: 0.4 });
          if (target && mode === 'play') ctx.say(`Number ${NUM[target]}!`);
          return;
        }
        // water: a few little bubbles
        const sr = stage.getBoundingClientRect();
        miniBubbles(e.clientX - sr.left, e.clientY - sr.top, 3);
        ctx.sfx('bubble', { vel: 0.35 });
      });

      ctx.idle(7000, () => {
        if (mode !== 'play' || !target) return;
        hint();
        ctx.mascot.mood('wave');
        ctx.say(`Pop number ${NUM[target]}!`);
      });

      // start: a few bubbles already on their way up, then the first request
      (async () => {
        const pre = Math.min(3, G.lanes.length);
        for (let i = 0; i < pre; i++) {
          const b = spawn(U.randInt(1, MAX[ctx.level]));
          b.y = G.sandY - (G.sandY - G.surfaceY) * (0.15 + i * 0.28);
          posBubble(b);
        }
        await ctx.wait(500);
        newRequest(true);
      })();

      return { destroy() {} };
    },
  });
})();
