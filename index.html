      offResize(fn) { const i = resizeFns.indexOf(fn); if (i >= 0) resizeFns.splice(i, 1); },
      size() { return { w: stage.clientWidth, h: stage.clientHeight }; },
      /**
       * Call fn() whenever the child hasn't touched the stage for `ms`. Repeats every `ms` while idle.
       * Returns cancel(). Typical: ctx.idle(7000, () => { ctx.prompt(); hint(); })
       */
      idle(ms, fn, opts) {
        // At most `max` (default 3) nudges per quiet stretch; a real touch re-arms it. No endless nagging.
        const w = { ms, fn, lastFire: performance.now(), count: 0, max: (opts && opts.max) || 3, touchAt: lastTouch };
        idleWatchers.add(w);
        return () => idleWatchers.delete(w);
      },
      /** Reset the idle clock (e.g. after a long animation) */
      poke() { lastTouch = performance.now(); },

      /* ---------- progress & rewards ---------- */
      /** Record an accomplishment. firstTry=false if the child needed help/mistakes. */
      success(firstTry) {
        if (!alive) return {};
        const r = PP.store.recordSuccess(game.id, firstTry);
        if (r.sticker) PP.app.queueSticker(r.sticker);
        if (r.leveledUp) PP.bus.emit('level:up', { game: game.id, level: r.level });
        return r;
      },
      /** Record a struggle — call at most once per round. */
      miss() { return alive ? PP.store.recordMiss(game.id) : {}; },
      praise: () => PP.data.praise(),
      /**
       * Celebrate! Confetti + happy sound + Pip cheers + spoken praise.
       *   opts: { x, y, say: string|false, big: bool, colors: [...], sound: sfxName|false }
       * Resolves when the praise is done (and after any sticker reward that was earned is shown).
       */
      celebrate(o) {
        o = o || {};
        if (!alive) return new Promise(() => {});
        const x = o.x == null ? innerWidth / 2 : o.x;
        const y = o.y == null ? innerHeight * 0.45 : o.y;
        if (o.sound !== false) ctx.sfx(o.sound || (o.big ? 'tada' : 'success'));
        PP.fx.confetti({ x, y, count: o.big ? 170 : 70, colors: o.colors, power: o.big ? 1.2 : 0.9 });
        if (o.big) PP.fx.burst(x, y, { emoji: ['⭐', '🌟', '✨'], count: 10, distance: 160 });
        if (mascot) mascot.mood('cheer');
        const text = o.say === false ? null : o.say || PP.data.praise();
        const minWait = ctx.wait(o.big ? 1500 : 800);
        const sp = text ? PP.speech.say(text) : Promise.resolve();
        return Promise.all([minWait, sp]).then(() => {
          if (!alive) return new Promise(() => {});
          if (PP.app.pendingSticker) return PP.app.showPendingSticker();
        }).then(() => (alive ? undefined : new Promise(() => {})));
      },

      /* ---------- Pip in the game ---------- */
      mascot: {
        /** Show Pip in a corner. opts: {corner:'bl'|'br'|'tl'|'tr', size:'110px'} . Tapping Pip repeats the prompt. */
        show(opts) {
          opts = opts || {};
          if (!mascot) {
            mascot = PP.mascot.create({ size: opts.size || 'clamp(80px, 14vmin, 140px)', cls: 'pp-game-pip' });
            stage.appendChild(mascot.el);
            ctx.tap(mascot.el, () => { mascot.mood('wiggle'); if (promptText) ctx.prompt(); else ctx.sfx('boing'); });
          }
          mascot.el.dataset.corner = opts.corner || 'bl';
          mascot.el.style.display = '';
          return mascot;
        },
        hide() { if (mascot) mascot.el.style.display = 'none'; },
        mood(m, ms) { if (mascot) mascot.mood(m, ms); },
        get el() { return mascot && mascot.el; },
      },

      exit() { PP.app.goHome(); },

      /* internal */
      _destroy() {
        alive = false;
        timers.forEach(clearTimeout);
        intervals.forEach(clearInterval);
        rafStops.forEach((s) => s());
        listeners.forEach(([el, type, fn, opts]) => el.removeEventListener(type, fn, opts));
        handles.forEach((h) => { try { (h.stop || h.destroy || (() => {})).call(h); } catch (e) {} });
        idleWatchers.clear();
        stage.removeEventListener('pointerdown', onStageDown, { capture: true });
        clearInterval(idleIv);
        if (mascot) mascot.destroy();
      },
      _resize() { resizeFns.forEach((f) => { try { f(ctx.size()); } catch (e) { console.error(e); } }); },
    };

    let quietSince = performance.now();
    const idleIv = setInterval(() => {
      if (!alive) return;
      const now = performance.now();
      // Talking, celebrating and sticker breaks count as activity — idle time only accrues in silence.
      if (PP.app.overlayPromise || PP.speech.speaking()) { quietSince = now; return; }
      const since = Math.max(lastTouch, quietSince);
      idleWatchers.forEach((w) => {
        if (w.touchAt !== lastTouch) { w.touchAt = lastTouch; w.count = 0; }
        if (w.count >= w.max) return;
        if (now - since >= w.ms && now - w.lastFire >= w.ms) {
          w.lastFire = now;
          w.count++;
          try { w.fn(); } catch (e) { console.error(e); }
        }
      });
    }, 400);

    return ctx;
  };
})();

</script>
<script data-src="core/08-kit.js">
/* Pip's Playroom — shared building blocks for games.
 *   PP.kit.emoji(char, {size})                      -> <span class="pp-emoji">
 *   PP.kit.card(content, {color, size})             -> rounded tappable card element
 *   PP.kit.findRound(ctx, opts) -> Promise<{firstTry, misses}>   "Find the ___!" round (errorless-learning flow)
 *   PP.kit.drag(el, opts) -> {stop(), reset()}      pointer dragging with snap-back
 *   PP.kit.nextButton(ctx, onTap, {parent})        big bouncing "go on" arrow
 *   PP.kit.speakerButton(ctx, {parent})            replays the current prompt
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const K = (PP.kit = {});

  K.emoji = function (ch, o) {
    o = o || {};
    return U.el('span', { class: 'pp-emoji ' + (o.cls || ''), text: ch, style: o.size ? { fontSize: o.size } : null });
  };

  K.card = function (content, o) {
    o = o || {};
    const c = U.el('div', { class: 'pp-card ' + (o.cls || ''), style: Object.assign({}, o.color ? { '--card': o.color } : {}, o.size ? { width: o.size + 'px', height: o.size + 'px', '--s': o.size + 'px' } : {}) });
    if (content) c.appendChild(content);
    return c;
  };

  /**
   * A complete "find it" round with built-in errorless-learning behavior.
   *  opts:
   *    container   element to render cards into (cleared). Defaults to a full-stage area.
   *    choices     [{ id, name, render: () => Element, color? }]   name is spoken when tapped wrongly ("That's the cat")
   *    targetId    id of the correct choice
   *    prompt      'Find the dog!'   (also set as ctx prompt; Pip/idle repeats it)
   *    intro       optional text said before the prompt (e.g., 'Let's find animals!')
   *    sayWrong    (choice) => text   default: `That's ${a(name)}.`
   *    sayRight    (choice) => text   default: `${praise} ${Cap(name)}!`   (set false for none)
   *    cardColor   background css color of cards (default white)
   *    maxCard     max card px (default 260)
   *    hintAfter   misses before the right card glows (default 2)
   *    celebrate   true (default) => confetti etc. on success
   *  Resolves after the success celebration. Records ctx.success / ctx.miss automatically.
   */
  K.findRound = function (ctx, o) {
    const container = o.container || ctx.stage;
    container.innerHTML = '';
    const grid = U.el('div', { class: 'pp-findgrid' });
    container.appendChild(grid);
    const cards = [];
    let misses = 0;
    let done = false;
    let hinted = false;
    let missReported = false;

    function layout() {
      const w = container.clientWidth, h = container.clientHeight;
      const n = o.choices.length;
      const gap = Math.max(12, Math.min(28, Math.min(w, h) * 0.035));
      const g = U.layoutGrid(n, w, h, gap);
      const size = Math.min(o.maxCard || 330, g.size);
      grid.style.gridTemplateColumns = `repeat(${g.cols}, ${size}px)`;
      grid.style.gap = gap + 'px';
      cards.forEach((c) => { c.style.width = c.style.height = size + 'px'; c.style.setProperty('--s', size + 'px'); });
    }

    o.choices.forEach((ch, i) => {
      const card = K.card(ch.render(), { color: ch.color || o.cardColor, cls: 'pp-findcard' });
      card.dataset.id = ch.id;
      card.style.animationDelay = i * 70 + 'ms';
      cards.push(card);
      grid.appendChild(card);
    });
    layout();
    ctx.onResize(layout);
    ctx.poke();
    const offs = [];

    const target = o.choices.find((c) => c.id === o.targetId);
    const targetCard = cards.find((c) => c.dataset.id === o.targetId);
    ctx.setPrompt(o.prompt);

    return new Promise((resolve) => {
      (async () => {
        if (o.intro) await ctx.say(o.intro);
        if (!done) ctx.say(o.prompt);
      })();

      const stopIdle = ctx.idle(o.idleMs || 7000, () => {
        if (done) return;
        ctx.say(o.prompt);
        if (!hinted) { hinted = true; PP.fx.glow(targetCard); }
      });

      cards.forEach((card, i) => {
        const ch = o.choices[i];
        offs.push(ctx.tap(card, async () => {
          if (done) return;
          if (ch.id === o.targetId) {
            done = true;
            stopIdle();
            card.classList.remove('pp-glow');
            card.classList.add('pp-correct');
            cards.forEach((c) => { if (c !== card) c.classList.add('pp-dim'); });
            const p = U.center(card);
            PP.fx.burst(p.x, p.y, { emoji: ['⭐', '✨', '🌟'], count: 7, distance: 110 });
            ctx.success(misses === 0);
            const right = o.sayRight === false ? false
              : o.sayRight ? o.sayRight(ch)
              : `${PP.data.praise()} ${U.cap(target.name)}!`;
            if (o.celebrate === false) {
              ctx.sfx('success');
              if (right) await ctx.say(right);
              else await ctx.wait(700);
            } else {
              await ctx.celebrate({ x: p.x, y: p.y, say: right });
            }
            offs.forEach((f) => f());
            ctx.offResize(layout);
            resolve({ firstTry: misses === 0, misses });
          } else {
            misses++;
            ctx.sfx('oops', { vel: 0.6 });
            card.classList.remove('pp-wiggle');
            void card.offsetWidth;
            card.classList.add('pp-wiggle');
            if (ctx.mascot.el) ctx.mascot.mood('think');
            const wrong = o.sayWrong ? o.sayWrong(ch) : `That's ${PP.data.a(ch.name)}.`;
            if (misses >= (o.hintAfter || 2)) {
              if (!missReported) { missReported = true; ctx.miss(); }
              hinted = true;
              PP.fx.glow(targetCard);
            }
            ctx.say(`${wrong} ${o.prompt}`);
          }
        }));
      });
    });
  };

  /**
   * Drag an element with the finger. Uses transforms; element should be position:absolute or relative.
   *  opts: { onStart(e), onMove(e, {dx, dy, x, y}), onEnd(e, {dx, dy, x, y}) -> return 'keep' to stay, else snaps back
   *          lift: scale while dragging (1.12) }
   *  returns { stop(), reset(), setEnabled(bool) }
   */
  K.drag = function (el, opts) {
    opts = opts || {};
    let id = null, sx = 0, sy = 0, dx = 0, dy = 0, enabled = true;
    const lift = opts.lift || 1.12;
    function down(e) {
      if (!enabled || id !== null) return;
      id = e.pointerId;
      try { el.setPointerCapture(id); } catch (err) {}
      sx = e.clientX; sy = e.clientY; dx = dy = 0;
      el.classList.add('pp-dragging');
      el.style.transition = 'none';
      el.style.transform = `translate(0px,0px) scale(${lift})`;
      e.preventDefault();
      opts.onStart && opts.onStart(e);
    }
    function move(e) {
      if (e.pointerId !== id) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      el.style.transform = `translate(${dx}px,${dy}px) scale(${lift})`;
      opts.onMove && opts.onMove(e, { dx, dy, x: e.clientX, y: e.clientY });
    }
    function up(e) {
      if (e.pointerId !== id) return;
      id = null;
      el.classList.remove('pp-dragging');
      const r = opts.onEnd ? opts.onEnd(e, { dx, dy, x: e.clientX, y: e.clientY }) : null;
      if (r !== 'keep') reset();
    }
    function reset() {
      el.style.transition = 'transform .35s cubic-bezier(.3,1.6,.5,1)';
      el.style.transform = 'translate(0px,0px) scale(1)';
    }
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    return {
      reset,
      setEnabled(v) { enabled = !!v; },
      stop() {
        el.removeEventListener('pointerdown', down);
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
      },
    };
  };

  /** Big bouncing arrow button (bottom-right by default). Returns the element. */
  K.nextButton = function (ctx, onTap, o) {
    o = o || {};
    const b = U.el('button', { class: 'pp-next ' + (o.cls || ''), 'aria-label': 'Next' });
    b.innerHTML = '<svg viewBox="0 0 100 100"><path d="M30 18 L74 50 L30 82 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>';
    (o.parent || ctx.stage).appendChild(b);
    ctx.tap(b, () => { ctx.sfx('whoosh'); onTap(); });
    return b;
  };

  /** Round button that repeats the current prompt (top-right by default). */
  K.speakerButton = function (ctx, o) {
    o = o || {};
    const b = U.el('button', { class: 'pp-speaker ' + (o.cls || ''), 'aria-label': 'Say it again' });
    b.innerHTML = '<svg viewBox="0 0 100 100"><path d="M18 38 H36 L58 20 V80 L36 62 H18 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><path d="M68 34 Q78 50 68 66 M78 26 Q94 50 78 74" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/></svg>';
    (o.parent || ctx.stage).appendChild(b);
    ctx.tap(b, () => ctx.prompt());
    return b;
  };
})();

</script>
<script data-src="core/09-app.js">
/* Pip's Playroom — app shell: start screen, home, game host, stickers, parent settings. */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const el = U.el;

  const DOMAINS = {
    colors: { name: 'Colors', color: '#FF6B6B' },
    numbers: { name: 'Numbers', color: '#4D96FF' },
    words: { name: 'Words', color: '#6BCB77' },
    shapes: { name: 'Shapes', color: '#FFB547' },
    music: { name: 'Music', color: '#B276F5' },
  };

  const app = (PP.app = {
    current: null, // {game, ctx, inst, stage}
    pendingSticker: null,
    overlayPromise: null,
  });

  let root, homeEl, gameEl, stageEl, homePip, gridEl;

  /* ======================= build DOM ======================= */
  function build() {
    root = document.getElementById('app');

    /* ---------- home ---------- */
    homeEl = el('section', { id: 'home', class: 'screen' });
    const sky = el('div', { class: 'home-sky', 'aria-hidden': 'true' });
    for (let i = 0; i < 5; i++) sky.appendChild(el('div', { class: 'cloud c' + i }));
    sky.appendChild(U.html(`<svg class="home-hills" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 120 Q 150 40 320 110 T 650 100 T 950 90 T 1200 110 V200 H0 Z" fill="#9BE08F"/><path d="M0 150 Q 200 90 420 150 T 820 140 T 1200 150 V200 H0 Z" fill="#79CF6E"/></svg>`));
    homeEl.appendChild(sky);

    const header = el('header', { class: 'home-header' });
    homePip = PP.mascot.create({ size: 'clamp(76px, 15vmin, 150px)', cls: 'home-pip' });
    const title = el('h1', { class: 'home-title', 'aria-label': "Pip's Playroom" });
    let li = 0;
    ["Pip's", 'Playroom'].forEach((word, wi) => {
      const w = el('span', { class: 'home-title-word' });
      word.split('').forEach((ch) => {
        w.appendChild(el('span', { text: ch, style: { color: ['#EF3B36', '#FF8C1A', '#E8B400', '#3DBE4B', '#2F7BEA', '#8E4FD6', '#FF6FB5'][li % 7], animationDelay: li * 0.08 + 's' } }));
        li++;
      });
      if (wi) title.appendChild(document.createTextNode(' '));
      title.appendChild(w);
    });
    const stickerBtn = el('button', { class: 'home-sticker-btn', 'aria-label': 'Sticker book' },
      el('span', { class: 'pp-emoji', text: '📒' }), el('span', { class: 'sticker-count', text: '0' }));
    const gear = el('button', { class: 'home-gear', 'aria-label': 'Grown-ups: hold for settings' });
    gear.innerHTML = '<svg viewBox="0 0 100 100"><circle class="gear-ring" cx="50" cy="50" r="46" fill="none" stroke-width="6"/><path fill="currentColor" d="M50 30a20 20 0 1 0 0.01 0zM44 8h12l2 10 7 3 9-6 8 8-6 9 3 7 10 2v12l-10 2-3 7 6 9-8 8-9-6-7 3-2 10H44l-2-10-7-3-9 6-8-8 6-9-3-7-10-2V44l10-2 3-7-6-9 8-8 9 6 7-3z" fill-rule="evenodd"/></svg><span class="gear-tip">hold</span>';
    header.append(homePip.el, title, el('div', { class: 'home-actions' }, stickerBtn, gear));
    homeEl.appendChild(header);

    gridEl = el('div', { class: 'home-grid' });
    homeEl.appendChild(el('div', { class: 'home-scroll' }, gridEl));
    root.appendChild(homeEl);

    // home interactions
    homePip.el.addEventListener('pointerdown', () => {
      homePip.mood(U.pick(['cheer', 'wiggle', 'happy']));
      PP.audio.sfx('boing');
      PP.speech.say(U.pick(["Hi! I'm Pip!", 'Pick a game!', "Let's play!", 'Tickle tickle! Hee hee!', 'What should we play?']));
    });
    stickerBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); PP.audio.sfx('tap'); openStickerBook(); });
    holdButton(gear, 1600, openSettings, () => PP.speech.say('That button is for grown-ups!', { mode: 'skip' }));

    /* ---------- game screen ---------- */
    gameEl = el('section', { id: 'game', class: 'screen hidden' });
    stageEl = el('div', { class: 'pp-stage' });
    const homeBtn = el('button', { class: 'pp-home-btn pp-noripple', 'aria-label': 'Home' });
    homeBtn.innerHTML = '<svg viewBox="0 0 100 100"><circle class="hold-ring" cx="50" cy="50" r="46" fill="none" stroke-width="7"/><path d="M50 22 L82 50 H72 V78 H58 V60 H42 V78 H28 V50 H18 Z" fill="#FF7A45" stroke="#FF7A45" stroke-width="6" stroke-linejoin="round"/></svg>';
    gameEl.append(stageEl, homeBtn);
    root.appendChild(gameEl);
    let homeHold = null;
    const leave = () => { history.state && history.state.game ? history.back() : app.goHome(); };
    const homeMode = () => (PP.store.settings.lockHome ? 'hold' : PP.store.settings.homeMode || 'double');
    let armedAt = 0, disarmT = null;
    homeBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const mode = homeMode();
      if (mode === 'hold') return;
      if (mode === 'tap' || performance.now() - armedAt < 2600) {
        clearTimeout(disarmT);
        homeBtn.classList.remove('armed');
        armedAt = 0;
        PP.audio.sfx('tap');
        leave();
        return;
      }
      // First tap only "arms" the button (it grows and pulses); a second tap goes home.
      armedAt = performance.now();
      homeBtn.classList.add('armed');
      PP.audio.sfx('click');
      clearTimeout(disarmT);
      disarmT = setTimeout(() => { homeBtn.classList.remove('armed'); armedAt = 0; }, 2600);
    });
    homeHold = holdButton(homeBtn, 1200, leave, null, () => homeMode() === 'hold');

    window.addEventListener('popstate', () => { if (app.current) app.goHome(true); });
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

    PP.bus.on('games:changed', renderHome);
    PP.bus.on('settings:changed', renderHome);
    renderHome();
  }

  let resizeT = null;
  function onResize() {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => { if (app.current) app.current.ctx._resize(); }, 120);
  }

  /** Press-and-hold helper (parent gate). onHold fires after ms; onShort on quick taps. enabledFn gates it. */
  function holdButton(btn, ms, onHold, onShort, enabledFn) {
    let t = null, start = 0;
    const ring = btn.querySelector('.gear-ring, .hold-ring');
    const C = 2 * Math.PI * 46;
    if (ring) { ring.style.strokeDasharray = C; ring.style.strokeDashoffset = C; }
    function down(e) {
      if (enabledFn && !enabledFn()) return;
      e.preventDefault();
      start = performance.now();
      btn.classList.add('holding');
      if (ring) { ring.style.transition = `stroke-dashoffset ${ms}ms linear`; ring.style.strokeDashoffset = 0; }
      t = setTimeout(() => { t = null; reset(); PP.audio.sfx('ding'); onHold(); }, ms);
    }
    function reset() {
      btn.classList.remove('holding');
      if (ring) { ring.style.transition = 'stroke-dashoffset .2s'; ring.style.strokeDashoffset = C; }
    }
    function up() {
      if (t) {
        clearTimeout(t);
        t = null;
        reset();
        if (performance.now() - start < 400 && onShort) onShort();
      }
    }
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  }

  /* ======================= home ======================= */
  function renderHome() {
    if (!gridEl) return;
    gridEl.innerHTML = '';
    const hidden = new Set(PP.store.settings.hidden || []);
    PP.games.filter((g) => !hidden.has(g.id)).forEach((g, i) => {
      const dom = DOMAINS[g.domain] || DOMAINS.words;
      const color = g.tileColor || dom.color;
      const tile = el('button', { class: 'home-tile', style: { '--tile': color, '--tile-dark': U.shade(color, -0.25), '--tile-light': U.shade(color, 0.35), animationDelay: i * 45 + 'ms' }, 'aria-label': g.title });
      const icon = el('div', { class: 'tile-icon' });
      if (typeof g.icon === 'string' && g.icon.trim().startsWith('<')) icon.innerHTML = g.icon;
      else icon.appendChild(el('span', { class: 'pp-emoji', text: g.icon || '⭐' }));
      tile.append(icon, el('div', { class: 'tile-title', text: g.title }), el('div', { class: 'tile-domain', text: dom.name }));
      tile.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (tile.dataset.busy) return;
        tile.dataset.busy = '1';
        PP.audio.sfx('tap');
        tile.classList.add('pressed');
        homePip.mood('happy');
        PP.speech.say(g.title + '!');
        setTimeout(() => { delete tile.dataset.busy; tile.classList.remove('pressed'); app.openGame(g.id); }, 420);
      });
      gridEl.appendChild(tile);
    });
    updateStickerCount();
  }
  function updateStickerCount() {
    const c = document.querySelector('.sticker-count');
    if (c) c.textContent = PP.store.stickers.length;
  }

  /* ======================= game host ======================= */
  app.openGame = function (id, opts) {
    const game = PP.games.find((g) => g.id === id);
    if (!game) { console.warn('no game', id); return; }
    if (app.current) app.goHome(true);
    PP.speech.cancel();
    homeEl.classList.add('hidden');
    gameEl.classList.remove('hidden');
    stageEl.innerHTML = '';
    stageEl.className = 'pp-stage g-' + game.id;
    stageEl.style.background = game.background || '';
    const ctx = PP.makeCtx(game, stageEl);
    PP.store.game(id).plays++;
    PP.store.save();
    app.current = { game, ctx, inst: null };
    if (!(opts && opts.noHistory)) {
      try { history.pushState({ game: id }, '', location.pathname + location.search); } catch (e) {}
    }
    try {
      app.current.inst = game.create(stageEl, ctx) || {};
    } catch (e) {
      console.error('Game crashed on start:', id, e);
      PP.speech.say('Oops! Let’s play something else.');
      setTimeout(() => app.goHome(), 600);
    }
    PP.bus.emit('game:open', id);
  };

  app.goHome = function (fromPop) {
    const cur = app.current;
    if (cur) {
      app.current = null;
      try { cur.inst && cur.inst.destroy && cur.inst.destroy(); } catch (e) { console.error(e); }
      cur.ctx._destroy();
      PP.audio.hush();
      PP.speech.cancel();
      stageEl.innerHTML = '';
      closeOverlay(true);
      app.pendingSticker = null;
      if (!fromPop && history.state && history.state.game) {
        try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      }
    }
    gameEl.classList.add('hidden');
    homeEl.classList.remove('hidden');
    renderHome();
    homePip.mood('wave');
  };

  /* ======================= overlays ======================= */
  let overlayEl = null, overlayResolve = null;
  function openOverlay(cls, content, opts) {
    closeOverlay(true);
    opts = opts || {};
    overlayEl = el('div', { class: 'pp-overlay ' + cls });
    overlayEl.appendChild(content);
    document.body.appendChild(overlayEl);
    requestAnimationFrame(() => overlayEl && overlayEl.classList.add('show'));
    app.overlayPromise = new Promise((r) => (overlayResolve = r));
    return overlayEl;
  }
  function closeOverlay(immediate) {
    if (!overlayEl) return;
    const o = overlayEl;
    overlayEl = null;
    o.classList.remove('show');
    setTimeout(() => o.remove(), immediate ? 0 : 300);
    const r = overlayResolve;
    overlayResolve = null;
    app.overlayPromise = null;
    if (r) r();
  }
  app.closeOverlay = closeOverlay;

  /* ---------- sticker reward ---------- */
  let stickerFallback = null;
  app.queueSticker = function (s) {
    app.pendingSticker = s;
    clearTimeout(stickerFallback);
    // Games that celebrate at the end of every set can ask to hold the sticker until ctx.celebrate().
    if (app.current && app.current.game.stickersAtCelebrate) return;
    // If the game doesn't call ctx.celebrate(), show it on our own shortly.
    const t0 = performance.now();
    const check = () => {
      if (!app.pendingSticker) return;
      const quiet = !PP.speech.speaking() && !app.overlayPromise;
      if (quiet || performance.now() - t0 > 7000) { if (!app.overlayPromise) app.showPendingSticker(); }
      else stickerFallback = setTimeout(check, 400);
    };
    stickerFallback = setTimeout(check, 1800);
  };
  app.showPendingSticker = function () {
    const s = app.pendingSticker;
    if (!s) return Promise.resolve();
    app.pendingSticker = null;
    clearTimeout(stickerFallback);
    const big = el('div', { class: 'sticker-award' },
      el('div', { class: 'sticker-rays' }),
      el('div', { class: 'sticker-big pp-emoji', text: s.emoji }),
      el('div', { class: 'sticker-label', text: 'New sticker!' }));
    const ov = openOverlay('sticker-overlay', big);
    const done = app.overlayPromise;
    PP.audio.sfx('tada');
    PP.fx.confetti({ count: 140 });
    PP.speech.say(`You got a sticker! ${U.cap(PP.data.a(s.word))}!`).then(() => {});
    let closed = false;
    const finish = () => {
      if (closed) return;
      closed = true;
      const bigEl = big.querySelector('.sticker-big');
      const homeBtn = document.querySelector('.pp-home-btn');
      PP.fx.flyTo(bigEl, homeBtn && !gameEl.classList.contains('hidden') ? homeBtn : { x: innerWidth - 60, y: 60 }, { scale: 0.2, duration: 650 });
      bigEl.style.visibility = 'hidden';
      PP.audio.sfx('swish');
      setTimeout(() => closeOverlay(), 250);
      updateStickerCount();
    };
    setTimeout(() => ov.addEventListener('pointerdown', finish), 900);
    setTimeout(finish, 3600);
    return done;
  };

  /* ---------- sticker book ---------- */
  function openStickerBook() {
    const owned = new Set(PP.store.stickers);
    const grid = el('div', { class: 'book-grid' });
    PP.data.STICKERS.forEach((s) => {
      const has = owned.has(s.id);
      const cell = el('div', { class: 'book-cell' + (has ? ' has' : '') }, el('span', { class: 'pp-emoji', text: has ? s.emoji : '?' }));
      if (has) cell.addEventListener('pointerdown', () => {
        cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop');
        PP.audio.sfx('bubble');
        PP.speech.say(U.cap(PP.data.a(s.word)) + '!');
      });
      grid.appendChild(cell);
    });
    const close = el('button', { class: 'book-close', 'aria-label': 'Close' });
    close.innerHTML = '<svg viewBox="0 0 100 100"><path d="M28 28 L72 72 M72 28 L28 72" stroke="#fff" stroke-width="14" stroke-linecap="round"/></svg>';
    const panel = el('div', { class: 'book' },
      el('div', { class: 'book-head' }, el('span', { class: 'pp-emoji', text: '📒' }), el('h2', { text: 'My Stickers' }), el('span', { class: 'book-count', text: `${owned.size} / ${PP.data.STICKERS.length}` })),
      el('div', { class: 'book-scroll' }, grid), close);
    openOverlay('book-overlay', panel);
    close.addEventListener('pointerdown', (e) => { e.preventDefault(); PP.audio.sfx('tap'); closeOverlay(); });
    PP.speech.say(owned.size ? `You have ${owned.size} sticker${owned.size === 1 ? '' : 's'}!` : 'Play games to win stickers!');
  }
  app.openStickerBook = openStickerBook;

  /* ---------- parent settings ---------- */
  function openSettings() {
    const s = PP.store.settings;
    const row = (label, control, help) => el('label', { class: 'set-row' }, el('span', { class: 'set-label', text: label }), control, help ? el('small', { class: 'set-help', text: help }) : null);

    const name = el('input', { type: 'text', value: s.childName || '', placeholder: 'e.g. Sam', maxlength: '20', autocomplete: 'off', autocapitalize: 'words' });
    name.addEventListener('change', () => PP.store.set('childName', name.value.trim()));

    const voiceSel = el('select');
    function fillVoices() {
      voiceSel.innerHTML = '';
      const list = PP.speech.listVoices();
      voiceSel.appendChild(el('option', { value: '', text: 'Automatic (best available)' }));
      list.forEach((v) => voiceSel.appendChild(el('option', { value: v.voiceURI, text: `${v.name} (${v.lang})` })));
      voiceSel.value = s.voiceURI || '';
    }
    fillVoices();
    const offVoices = PP.bus.on('speech:voices', fillVoices);
    voiceSel.addEventListener('change', () => { PP.store.set('voiceURI', voiceSel.value); PP.speech.setVoice(voiceSel.value); testVoice(); });
    const testBtn = el('button', { class: 'set-btn', text: '▶︎ Test voice', type: 'button' });
    function testVoice() { PP.speech.say(`Hi${s.childName ? ' ' + s.childName : ''}! I'm Pip. Let's find the red balloon!`); }
    testBtn.addEventListener('click', testVoice);

    const range = (key, min, max, step, apply) => {
      const r = el('input', { type: 'range', min, max, step, value: s[key] });
      r.addEventListener('input', () => { apply(parseFloat(r.value)); });
      r.addEventListener('change', () => { PP.store.set(key, parseFloat(r.value)); });
      return r;
    };
    const rate = range('rate', 0.6, 1.2, 0.02, (v) => PP.speech.setRate(v));
    rate.addEventListener('change', testVoice);
    const pitch = range('pitch', 0.8, 1.5, 0.02, (v) => PP.speech.setPitch(v));
    pitch.addEventListener('change', testVoice);
    const vol = range('volume', 0, 1, 0.05, (v) => PP.audio.setVolume(v));
    vol.addEventListener('change', () => PP.audio.sfx('ding'));

    const toggle = (key, apply) => {
      const c = el('input', { type: 'checkbox' });
      c.checked = !!s[key];
      c.addEventListener('change', () => { PP.store.set(key, c.checked); apply && apply(c.checked); });
      return c;
    };

    const challenge = el('select');
    [['auto', 'Automatic — adjusts as they play (recommended)'], ['gentle', 'Gentle — keep it easy'], ['big', 'Big kid — start harder']].forEach(([v, t]) => challenge.appendChild(el('option', { value: v, text: t })));
    challenge.value = s.challenge;
    challenge.addEventListener('change', () => PP.store.set('challenge', challenge.value));

    const homeSel = el('select');
    [['double', 'Tap twice (recommended)'], ['tap', 'One tap'], ['hold', 'Press and hold (most locked)']].forEach(([v, t]) => homeSel.appendChild(el('option', { value: v, text: t })));
    homeSel.value = s.lockHome ? 'hold' : s.homeMode || 'double';
    homeSel.addEventListener('change', () => { PP.store.set('lockHome', false); PP.store.set('homeMode', homeSel.value); });

    const playLimitSel = el('select');
    [[0, 'Off'], [10, '10 minutes'], [15, '15 minutes'], [20, '20 minutes'], [30, '30 minutes'], [45, '45 minutes']].forEach(([v, t]) => playLimitSel.appendChild(el('option', { value: v, text: t })));
    playLimitSel.value = String(s.playLimit || 0);
    playLimitSel.addEventListener('change', () => { PP.store.set('playLimit', parseInt(playLimitSel.value, 10)); app.resetPlayTimer(); });

    const gamesBox = el('div', { class: 'set-games' });
    PP.games.forEach((g) => {
      const c = el('input', { type: 'checkbox' });
      c.checked = !(s.hidden || []).includes(g.id);
      c.addEventListener('change', () => {
        const h = new Set(PP.store.settings.hidden || []);
        if (c.checked) h.delete(g.id); else h.add(g.id);
        PP.store.set('hidden', [...h]);
      });
      const lvl = PP.store.game(g.id).level;
      gamesBox.appendChild(el('label', { class: 'set-game' }, c, el('span', { class: 'pp-emoji', text: typeof g.icon === 'string' && !g.icon.startsWith('<') ? g.icon : '⭐' }), el('span', { text: g.title }), el('small', { text: `level ${lvl}` })));
    });

    const reset = el('button', { class: 'set-btn danger', text: 'Reset stickers & levels', type: 'button' });
    reset.addEventListener('click', () => {
      if (reset.dataset.armed) { PP.store.resetProgress(); reset.textContent = 'Done ✓'; delete reset.dataset.armed; updateStickerCount(); return; }
      reset.dataset.armed = '1';
      reset.textContent = 'Tap again to confirm';
    });

    const close = el('button', { class: 'set-close', text: 'Done', type: 'button' });
    const panel = el('div', { class: 'settings' },
      el('div', { class: 'set-head' }, el('h2', { text: 'Grown-up Settings' }), close),
      el('div', { class: 'set-body' },
        el('h3', { text: 'Child' }),
        row("Child's name", name, 'Pip will sometimes cheer for them by name.'),
        el('h3', { text: 'Voice' }),
        row('Voice', voiceSel),
        el('div', { class: 'set-inline' }, testBtn),
        row('Talking speed', rate),
        row('Voice pitch', pitch),
        el('p', { class: 'set-tip', html: 'Tip: for a much nicer voice on iPad/iPhone, open <b>Settings → Accessibility → Spoken Content → Voices → English</b> and download an <b>Enhanced</b> or <b>Premium</b> voice (Ava, Zoe and Samantha are great). Then pick it above.' }),
        el('h3', { text: 'Sound' }),
        row('Volume', vol),
        row('Background music', toggle('music', (v) => PP.audio.setMusic(v)), 'Drum grooves and backing tracks. Tapped instruments always play.'),
        el('h3', { text: 'Play' }),
        row('Challenge', challenge),
        row('Home button in games', homeSel, 'Toddlers brush the corner a lot. “Tap twice” makes the button grow on the first tap and go home on the second.'),
        row('Play timer', playLimitSel, 'After this much play, Pip yawns, plays a lullaby and says bye-bye. Hold the moon button for 2 seconds to keep playing.'),
        el('h3', { text: 'Activities' }),
        gamesBox,
        el('h3', { text: 'Make it toddler-proof' }),
        el('p', { class: 'set-tip', html: '<b>1. Add to Home Screen:</b> in Safari tap Share → <i>Add to Home Screen</i>. It opens full-screen like a real app.<br><b>2. Guided Access:</b> Settings → Accessibility → Guided Access → On. Then open the app and triple-click the top (or home) button to lock the iPad into it.' }),
        el('h3', { text: 'Progress' }),
        el('p', { class: 'set-tip', text: `Stickers earned: ${PP.store.stickers.length} · Successes: ${PP.store.successTotal}` }),
        reset,
        el('p', { class: 'set-ver', text: "Pip's Playroom v" + PP.version + ' · all sounds and art are generated in your browser' })
      )
    );
    openOverlay('settings-overlay', panel);
    close.addEventListener('click', () => { offVoices(); PP.audio.sfx('tap'); closeOverlay(); renderHome(); });
  }
  app.openSettings = openSettings;

  /* ======================= start screen ======================= */
  app.showStart = function (then) {
    const pip = PP.mascot.create({ size: 'min(42vmin, 300px)', cls: 'start-pip' });
    const play = el('button', { class: 'start-play', 'aria-label': 'Play' });
    play.innerHTML = '<svg viewBox="0 0 100 100"><path d="M36 24 L78 50 L36 76 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>';
    const start = el('section', { id: 'start', class: 'screen' },
      el('div', { class: 'start-bubbles', 'aria-hidden': 'true' }),
      pip.el,
      el('h1', { class: 'start-title', html: 'Pip’s<br>Playroom' }),
      play);
    const bubbles = start.querySelector('.start-bubbles');
    for (let i = 0; i < 14; i++) {
      bubbles.appendChild(el('span', { style: { left: U.rand(0, 100) + '%', width: (i % 4 + 2) * 14 + 'px', height: (i % 4 + 2) * 14 + 'px', animationDelay: -U.rand(0, 14) + 's', animationDuration: U.rand(9, 16) + 's', background: U.pick(['#FFD21F', '#FF6FB5', '#4D96FF', '#6BCB77', '#FF8C1A', '#B276F5']) } }));
    }
    root.appendChild(start);
    pip.mood('wave');
    let go = false;
    // iOS only counts touchEND / pointerUP / click as a user gesture for audio + speech, so start on release.
    start.addEventListener('pointerdown', () => { play.classList.add('pressed'); pip.mood('surprise'); });
    const begin = (e) => {
      if (go) return;
      go = true;
      if (e.cancelable) e.preventDefault();
      PP.audio.unlock();
      const nm = PP.store.settings.childName;
      PP.speech.unlock(`Hi${nm ? ' ' + nm : ''}! I'm Pip! Let's play!`);
      PP.audio.sfx('magic');
      pip.mood('cheer');
      start.classList.add('leaving');
      PP.bus.emit('started');
      setTimeout(() => { pip.destroy(); start.remove(); then && then(); }, 650);
    };
    ['pointerup', 'touchend', 'click'].forEach((t) => start.addEventListener(t, begin));
  };

  /* ======================= play timer ("time for a break") ======================= */
  let playMs = 0, lastTick = performance.now(), started = false, sleeping = false;
  app.resetPlayTimer = () => { playMs = 0; };
  setInterval(() => {
    const now = performance.now(), dt = now - lastTick;
    lastTick = now;
    if (!started || sleeping || document.hidden) return;
    playMs += Math.min(dt, 2000);
    const lim = PP.store.settings.playLimit || 0;
    if (lim > 0 && playMs >= lim * 60000 && !app.overlayPromise) app.sleep();
  }, 1000);
  PP.bus.on('started', () => { started = true; });

  // Brahms' Lullaby (public domain), first phrase
  const LULLABY = [['E4', .5], ['E4', .5], ['G4', 2], ['E4', .5], ['E4', .5], ['G4', 2], ['E4', .5], ['G4', .5], ['C5', 1], ['B4', 1.5], ['A4', .5], ['A4', 1], ['G4', 1],
    ['D4', .5], ['E4', .5], ['F4', 1], ['D4', 1], ['D4', .5], ['E4', .5], ['F4', 2], ['D4', .5], ['F4', .5], ['B4', .5], ['A4', .5], ['G4', 1], ['B4', 1], ['C5', 3]];

  app.sleep = function () {
    if (sleeping) return;
    sleeping = true;
    app.goHome();
    const pip = PP.mascot.create({ size: 'min(44vmin, 300px)', cls: 'sleep-pip m-sleep' });
    const sky = el('div', { class: 'sleep-sky' });
    for (let i = 0; i < 40; i++) sky.appendChild(el('span', { class: 'sleep-star', style: { left: U.rand(0, 100) + '%', top: U.rand(0, 70) + '%', animationDelay: -U.rand(0, 4) + 's', transform: `scale(${U.rand(0.4, 1.2)})` } }));
    const zzz = el('div', { class: 'sleep-z' }, el('span', { text: 'z' }), el('span', { text: 'z' }), el('span', { text: 'Z' }));
    const moon = el('button', { class: 'sleep-moon', 'aria-label': 'Grown-ups: hold to keep playing' });
    moon.innerHTML = '<svg viewBox="0 0 100 100"><circle class="hold-ring" cx="50" cy="50" r="46" fill="none" stroke-width="6"/><path d="M62 22 A30 30 0 1 0 78 64 A24 24 0 1 1 62 22 Z" fill="#FFE68A"/></svg>';
    const wrap = el('div', { class: 'sleep-wrap' }, sky, el('div', { class: 'sleep-center' }, zzz, pip.el, el('div', { class: 'sleep-text', text: 'Bye-bye!' })), moon);
    openOverlay('sleep-overlay', wrap);
    const nm = PP.store.settings.childName;
    PP.speech.say(`Yawn! Time for a break${nm ? ', ' + nm : ''}! Bye-bye! See you soon!`, { rate: 0.8 });
    const playLullaby = () => PP.audio.sequence(LULLABY, { bpm: 72, inst: 'kalimba', vel: 0.45, bus: 'sfx', delay: 2.5 });
    let lull = playLullaby();
    const again = setInterval(() => { lull = playLullaby(); }, 24000);
    holdButton(moon, 2000, () => {
      clearInterval(again);
      lull.stop();
      PP.audio.hush();
      sleeping = false;
      playMs = 0;
      pip.destroy();
      closeOverlay();
      PP.speech.say('Yay! More playing!');
    });
  };

  app.build = build;
  app.renderHome = renderHome;
  app.DOMAINS = DOMAINS;
})();

</script>
<script data-src="games/colors-balloons.js">
/* Balloon Pop — colors.
 * Glossy balloons float up from behind the hills. Tap → POP! with shards in the balloon's color, the color word
 * floats up and is spoken. After a few free pops Pip asks for a color ("Can you pop a red balloon?") and shows a
 * balloon of that color in a speech bubble (visual matching cue). Other colors still pop and get named — no penalty.
 * Every 10 pops fills the garland at the top → BALLOON PARTY. Rare rainbow / star balloons give a sparkle shower.
 *
 * Level 1: 3 colors, 4 balloons on screen, slow, request after 5 pops, many target balloons.
 * Level 5: 10 colors, 7 balloons on screen, a bit quicker, requests every 2–3 pops, fewer target balloons.
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const D = PP.data;

  const INK = '#2B2340';
  const BODY = 'M50 4 C 21 4 4 27 4 54 C 4 82 29 103 50 112 C 71 103 96 82 96 54 C 96 27 79 4 50 4 Z';
  function starPts(cx, cy, R, r) {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r : R;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return p.join(' ');
  }
  const STAR = starPts(50, 58, 50, 25);

  U.addDefs('balloons', `
    <radialGradient id="bp-shine" cx="34%" cy="26%" r="58%">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/><stop offset=".45" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bp-shade" cx="36%" cy="30%" r="78%">
      <stop offset=".55" stop-color="#1a0f33" stop-opacity="0"/><stop offset="1" stop-color="#1a0f33" stop-opacity=".34"/>
    </radialGradient>
    <linearGradient id="bp-rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF3B36"/><stop offset=".17" stop-color="#EF3B36"/>
      <stop offset=".17" stop-color="#FF8C1A"/><stop offset=".33" stop-color="#FF8C1A"/>
      <stop offset=".33" stop-color="#FFD21F"/><stop offset=".5" stop-color="#FFD21F"/>
      <stop offset=".5" stop-color="#3DBE4B"/><stop offset=".67" stop-color="#3DBE4B"/>
      <stop offset=".67" stop-color="#2F7BEA"/><stop offset=".83" stop-color="#2F7BEA"/>
      <stop offset=".83" stop-color="#8E4FD6"/><stop offset="1" stop-color="#8E4FD6"/>
    </linearGradient>
    <linearGradient id="bp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3A6"/><stop offset=".35" stop-color="#FFD21F"/><stop offset=".7" stop-color="#F5B400"/><stop offset="1" stop-color="#FFE36B"/>
    </linearGradient>
    <radialGradient id="bp-sunglow" cx="50%" cy="50%" r="50%">
      <stop offset=".45" stop-color="#FFF6B0" stop-opacity=".9"/><stop offset="1" stop-color="#FFF6B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bp-sunbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
  `);

  U.addStyles('balloons', `
    .g-balloons { background: linear-gradient(180deg, #49B3F2 0%, #86D2FF 38%, #C6ECFF 72%, #E6F7FF 100%); }
    .bp-sky, .bp-layer, .bp-front, .bp-fx { position: absolute; inset: 0; pointer-events: none; }
    .bp-sky { z-index: 1; }
    .bp-layer { z-index: 10; }
    .bp-front { z-index: 12; }
    .bp-fx { z-index: 30; overflow: hidden; }

    .bp-sun { position: absolute; pointer-events: auto; width: var(--sun); height: var(--sun);
      right: calc(var(--safe-r) - var(--sun) * .2); top: calc(var(--safe-t) - var(--sun) * .2); }
    .bp-sun svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .bp-rays { transform-box: view-box; transform-origin: 100px 100px; animation: bp-spin 40s linear infinite; }
    .bp-sun.bp-happy .bp-rays { animation: bp-spin 1.2s cubic-bezier(.2,.8,.3,1) 1; }
    .bp-sunface { transform-box: view-box; transform-origin: 100px 100px; }
    .bp-sun.bp-happy .bp-sunface { animation: pp-yay .8s cubic-bezier(.3,1.6,.5,1); }
    @keyframes bp-spin { to { transform: rotate(360deg) } }

    .bp-cloud { position: absolute; left: 0; pointer-events: auto; will-change: transform; animation: bp-drift linear infinite; }
    .bp-cloud svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .bp-cloud .bp-puff { transform-box: fill-box; transform-origin: 50% 80%; }
    .bp-cloud.bp-squish .bp-puff { animation: bp-squish .5s cubic-bezier(.3,1.6,.5,1); }
    @keyframes bp-drift { from { transform: translateX(-30vw) } to { transform: translateX(115vw) } }
    @keyframes bp-squish { 0% { transform: scale(1) } 35% { transform: scale(1.18, .82) } 70% { transform: scale(.94, 1.06) } 100% { transform: scale(1) } }

    .bp-hills { position: absolute; left: 0; bottom: 0; width: 100%; display: block; }
    .bp-hills.back { height: 22%; }

    .bp-slot.fly > svg { animation: bp-flyup 1.1s cubic-bezier(.4,0,.7,.4) forwards; }

    .bp-ask { position: absolute; z-index: 44; pointer-events: auto; width: var(--ask); height: var(--ask);
      left: calc(var(--safe-l) + var(--pip) + 4px); bottom: calc(var(--safe-b) + var(--pip) * .55);
      transform-origin: 0% 100%; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
    .bp-ask.show { transform: scale(1); }

    @keyframes bp-bump { 0% { transform: scale(1) } 40% { transform: scale(1.18) rotate(-4deg) } 100% { transform: scale(1) } }
    .bp-ask > svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .bp-ask .bp-askb { transform-box: fill-box; transform-origin: 50% 100%; animation: pp-bob 1.4s ease-in-out infinite; }
  `);

  function balloonMarkup(kind, c) {
    const str = '<path class="bp-string" d="M50 119 C 41 133, 59 147, 50 161 S 43 185, 50 198" stroke="rgba(70,70,110,.55)" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    if (kind === 'star') {
      return `<svg viewBox="0 0 100 200" aria-hidden="true">
        <path class="bp-string" d="M50 86 C 41 104, 59 122, 50 140 S 43 175, 50 196" stroke="rgba(70,70,110,.55)" stroke-width="2.2" fill="none" stroke-linecap="round"/>

      ${str}
      <path d="M43 121 L50 110 L57 121 Q50 125 43 121 Z" fill="${knot}"/>

      <path d="M74 86 Q82 76 84 64" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".28"/>

  const MINI = 'M30 4 C 13 4 4 17 4 32 C 4 48 18 60 30 66 C 42 60 56 48 56 32 C 56 17 47 4 30 4 Z';
  function slotMarkup() {
    return `<svg viewBox="0 0 60 88" aria-hidden="true">
      <path d="M30 70 C 25 76, 35 80, 30 86" stroke="rgba(255,255,255,.85)" stroke-width="2" fill="none"/>
