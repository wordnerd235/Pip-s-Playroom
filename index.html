  const CLOUD = '<svg viewBox="0 0 220 110" aria-hidden="true"><g class="bp-puff"><path d="M38 96 C 10 96 6 64 30 58 C 26 32 58 20 76 36 C 84 10 128 6 140 34 C 160 20 192 30 188 58 C 214 60 214 96 186 96 Z" fill="#fff"/><path d="M40 92 C 70 100 150 100 184 92" stroke="#DCEFFF" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="88" cy="54" rx="22" ry="10" fill="#fff" opacity=".9"/></g></svg>';

  const SUN = `<svg viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="98" fill="url(#bp-sunglow)"/>
    <g class="bp-rays">${Array.from({ length: 12 }, (_, i) => `<path d="M100 8 L110 30 L90 30 Z" fill="#FFD84A" stroke="#FFC21F" stroke-width="4" stroke-linejoin="round" transform="rotate(${i * 30} 100 100)"/>`).join('')}</g>
    <g class="bp-sunface">
      <circle cx="100" cy="100" r="56" fill="url(#bp-sunbody)" stroke="#F7A91B" stroke-width="4"/>
      <ellipse cx="80" cy="76" rx="16" ry="9" fill="#fff" opacity=".45" transform="rotate(-28 80 76)"/>
      <path d="M74 98 Q82 90 90 98 M110 98 Q118 90 126 98" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M84 114 Q100 130 116 114" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="72" cy="114" rx="9" ry="6" fill="#FF8A6B" opacity=".55"/><ellipse cx="128" cy="114" rx="9" ry="6" fill="#FF8A6B" opacity=".55"/>
    </g></svg>`;

  function flowerMarkup(c) {
    return `<svg viewBox="0 0 24 34" aria-hidden="true"><path d="M12 33 V16" stroke="#3E9E50" stroke-width="3" stroke-linecap="round"/>` +
      `<path d="M12 26 Q5 22 4 17 Q10 18 12 24" fill="#5FC25A"/>` +
      `<circle cx="6.5" cy="11" r="5.5" fill="${c}"/><circle cx="17.5" cy="11" r="5.5" fill="${c}"/><circle cx="12" cy="5.5" r="5.5" fill="${c}"/><circle cx="12" cy="16.5" r="5.5" fill="${c}"/>` +
      `<circle cx="12" cy="11" r="4" fill="#FFB627"/></svg>`;
  }

  const PENTA = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7', 'D6', 'E6'];

  PP.registerGame({
    id: 'balloons',
    title: 'Balloons',
    domain: 'colors',
    icon: '🎈',
    tileColor: '#FF6B6B',
    order: 10,
    create(stage, ctx) {
      /* ---------------- scene ---------------- */
      const sky = ctx.el('div', { class: 'bp-sky' });
      const sun = ctx.html(`<div class="bp-sun">${SUN}</div>`);
      sky.appendChild(sun);
      const clouds = [];
      [[0.13, 70, -8, 1], [0.34, 95, -52, 0.75], [0.52, 82, -30, 0.95], [0.24, 120, -95, 0.6]].forEach(([top, dur, delay, sc]) => {
        const c = ctx.html(`<div class="bp-cloud">${CLOUD}</div>`);
        c.style.top = top * 100 + '%';
        c.style.animationDuration = dur + 's';
        c.style.animationDelay = delay + 's';
        c.dataset.sc = sc;
        clouds.push(c);
        sky.appendChild(c);
      });
      sky.appendChild(ctx.html(`<svg class="bp-hills back" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 120 C 140 40 300 50 420 110 C 540 160 640 60 800 70 C 950 80 1050 150 1200 100 V220 H0 Z" fill="#A6E39A"/>
        <path d="M0 160 C 180 100 360 120 520 160 C 700 200 860 110 1020 130 C 1100 140 1160 150 1200 150 V220 H0 Z" fill="#86D67A"/>
      </svg>`));
      const layer = ctx.el('div', { class: 'bp-layer' });
      const front = ctx.html(`<svg class="bp-hills front" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 50 C 200 10 380 30 600 52 C 820 74 1000 20 1200 40 V120 H0 Z" fill="#5FC25A"/>
        <path d="M0 78 C 260 56 520 70 760 84 C 940 94 1080 74 1200 70 V120 H0 Z" fill="#4CB04A"/>
      </svg>`);
      const frontWrap = ctx.el('div', { class: 'bp-front' });
      frontWrap.appendChild(front);
      ['#FF6FB5', '#FFD21F', '#fff', '#FF8C1A', '#C9A6F2', '#FF6FB5', '#fff', '#FFD21F', '#C9A6F2', '#FF8C1A'].forEach((c, i) => {
        const f = ctx.html(`<div class="bp-fl">${flowerMarkup(c)}</div>`);
        f.style.left = (14 + i * 8.6 + ((i * 37) % 5)) + '%';
        f.style.bottom = (1.2 + ((i * 7) % 5) * 1.1) + '%';
        f.firstChild.style.animationDelay = -(i % 5) * 0.6 + 's';
        frontWrap.appendChild(f);
      });
      const fxl = ctx.el('div', { class: 'bp-fx' });

      const garland = ctx.el('div', { class: 'bp-garland' });
      const slots = [];
      for (let i = 0; i < 10; i++) {
        const s = ctx.html(`<span class="bp-slot">${slotMarkup()}</span>`);
        slots.push(s);
        garland.appendChild(s);
      }
      const ask = ctx.html(`<div class="bp-ask"><svg viewBox="0 0 120 120" aria-hidden="true">
        <path d="M18 8 H106 Q116 8 116 18 V92 Q116 102 106 102 H34 L10 116 L18 98 Q8 96 8 86 V18 Q8 8 18 8 Z" fill="#fff" stroke="#D8E6F5" stroke-width="3" stroke-linejoin="round"/>
        <g class="bp-askb"><g transform="translate(36 12) scale(.5)"><path class="bp-askstr" d="M50 119 C 41 133, 59 147, 50 160" stroke="rgba(70,70,110,.55)" stroke-width="3" fill="none"/>
          <path class="bp-askknot" d="M43 121 L50 110 L57 121 Q50 125 43 121 Z" fill="#999"/>
          <path class="bp-askbody" d="${BODY}" fill="#999" stroke="rgba(0,0,0,.2)" stroke-width="2"/>
          <path d="${BODY}" fill="url(#bp-shade)"/><path d="${BODY}" fill="url(#bp-shine)"/>
          <ellipse cx="30" cy="36" rx="8" ry="15" transform="rotate(28 30 36)" fill="#fff" opacity=".72"/></g></g>
      </svg></div>`);
      stage.append(sky, layer, frontWrap, fxl, garland, ask);
      ctx.mascot.show({ corner: 'bl' });

      /* ---------------- layout ---------------- */
      let w = 0, h = 0, BW = 100;
      function layout() {
        const s = ctx.size();
        // on rotation, carry balloons over proportionally so none are stranded off-screen
        if (w && s.w && s.w !== w && typeof balloons !== 'undefined') {
          const kx = s.w / w;
          balloons.forEach((b) => { b.x0 = U.clamp(b.x0 * kx, s.w >= 500 ? 92 : 64, Math.max(0, s.w - b.W - 6)); });
        }
        w = s.w; h = s.h;
        const mn = Math.min(w, h);
        BW = U.clamp(mn * 0.165, 84, 138);
        const sunSize = U.clamp(mn * 0.27, 112, 230);
        stage.style.setProperty('--sun', sunSize + 'px');
        const pip = U.clamp(mn * 0.14, 80, 140);
        stage.style.setProperty('--pip', pip + 'px');
        stage.style.setProperty('--ask', U.clamp(mn * 0.22, 90, 140) + 'px');
        stage.style.setProperty('--fl', U.clamp(mn * 0.032, 16, 30) + 'px');
        clouds.forEach((c) => { const cw = U.clamp(mn * 0.3, 120, 260) * +c.dataset.sc; c.style.width = cw + 'px'; c.style.height = cw / 2 + 'px'; });
        // garland: one row when there is room, otherwise 2 rows of 5 — always clear of the home button and the sun
        const avail = Math.min(560, w - 2 * 104, w - 2 * (sunSize * 0.82));
        let cols = 10, slot = Math.min(50, avail / 10);
        if (slot < 30) { cols = 5; slot = Math.min(40, avail / 5); }
        garland.style.gridTemplateColumns = `repeat(${cols}, ${slot}px)`;
        garland.style.setProperty('--slot', slot * 0.88 + 'px');
        garland.style.rowGap = '2px';
      }
      layout();
      ctx.onResize(layout);

      /* ---------------- state ---------------- */
      const balloons = [];
      let t = 0, lastSpawn = -10, nextGap = 0.2, spawnCount = 0, lastColorId = '';
      let colors = D.colorsForLevel(ctx.level);
      let req = null, lastReqId = '', freePops = 0, reqAfter = [0, 5, 4, 3, 3, 2][ctx.level];
      let garlandN = 0, partyPending = false, partyUntil = 0, celebrating = false;
      let idleTalks = 0, lastSpecialAt = 0;
      const now = () => performance.now();
      const cap = U.cap;
      const lvl = () => ctx.level;
      const travelTime = () => U.clamp(4 + h / 150, 7, 12) * [1, 1.1, 1.05, 1, 0.94, 0.88][lvl()];
      const wantOnScreen = () => [4, 4, 5, 5, 6, 7][lvl()];

      function stagePt(e) { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, ox: r.left, oy: r.top }; }
      function vp(x, y) { const r = stage.getBoundingClientRect(); return { x: x + r.left, y: y + r.top }; }

      /* ---------------- balloons ---------------- */
      function chooseX(bw) {
        // keep clear of the home button's column (top-left) so reaching for a balloon never exits the game
        const lo = w >= 500 ? 92 : 64, hi = Math.max(lo + 1, w - bw - 6);
        let best = lo + Math.random() * (hi - lo), bestScore = -1;
        for (let k = 0; k < 8; k++) {
          const x = lo + Math.random() * (hi - lo);
          let d = 9999;
          balloons.forEach((b) => { if (b.y > h * 0.4) d = Math.min(d, Math.abs(b.x0 - x)); });
          if (d > bestScore) { bestScore = d; best = x; }
        }
        return best;
      }
      function chooseColor() {
        if (req) {
          const p = [0.6, 0.62, 0.55, 0.48, 0.42, 0.38][lvl()];
          if (Math.random() < p) return req.color;
        }
        const pool = colors.filter((c) => c.id !== lastColorId && (!req || c.id !== req.color.id));
        return ctx.pick(pool.length ? pool : colors);
      }
      function spawn(o) {
        o = o || {};
        let kind = o.kind || 'normal';
        if (!o.kind && !o.party && !req && spawnCount > 6 && t - lastSpecialAt > 18 && Math.random() < 0.09 &&
            !balloons.some((b) => b.kind !== 'normal')) {
          kind = Math.random() < 0.5 ? 'rainbow' : 'star';
          lastSpecialAt = t;
        }
        const color = kind === 'normal' ? o.color || chooseColor() : null;
        if (color) lastColorId = color.id;
        const bw = BW * (o.party ? U.rand(0.8, 0.95) : U.rand(0.94, 1.06));
        const el = ctx.html(`<div class="bp-b"><div class="bp-halo"></div>${balloonMarkup(kind, color)}</div>`);
        el.style.width = bw + 'px';
        el.style.height = bw * 2 + 'px';
        const str = el.querySelector('.bp-string');
        if (str) { str.style.animationDuration = U.rand(1.3, 2.1) + 's'; str.style.animationDelay = -U.rand(0, 2) + 's'; }
        const T = travelTime() * (o.party ? 0.5 : U.rand(0.9, 1.12)) * (kind === 'normal' ? 1 : 1.15);
        const b = {
          el, kind, color, W: bw, party: !!o.party,
          x0: o.x != null ? o.x : chooseX(bw), x: 0, y: h + (o.y0 || U.rand(0, bw * 0.2)),
          vy: (h + bw * 2.4) / T, amp: U.rand(8, 18) * (bw / 110), freq: U.rand(0.7, 1.3), phase: U.rand(0, 6.28), tilt: U.rand(3, 6),
          glow: false,
        };
        if (req && req.hinted && color && color.id === req.color.id) setGlow(b, true);
        balloons.push(b);
        layer.appendChild(el);
        place(b);
        spawnCount++;
        return b;
      }
      function place(b) {
        const s = Math.sin(t * b.freq + b.phase);
        b.x = b.x0 + b.amp * s;
        const rot = Math.cos(t * b.freq + b.phase) * b.tilt;
        b.el.style.transform = `translate3d(${b.x.toFixed(1)}px, ${b.y.toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg)`;
      }
      function setGlow(b, on) { b.glow = on; b.el.classList.toggle('bp-glow', on); }

      ctx.raf((dt) => {
        t += dt;
        const regular = balloons.filter((b) => !b.party).length;
        const want = wantOnScreen();
        if ((regular < want && t - lastSpawn > nextGap) || (regular < 2 && t - lastSpawn > 0.6)) {
          spawn();
          lastSpawn = t;
          nextGap = (travelTime() / want) * U.rand(0.7, 1.15);
        }
        for (let i = balloons.length - 1; i >= 0; i--) {
          const b = balloons[i];
          b.y -= b.vy * dt;
          place(b);
          if (b.y < -b.W * 2.3) { b.el.remove(); balloons.splice(i, 1); }
        }
      });

      /* ---------------- popping ---------------- */
      function popFx(b, cx, cy) {
        const cols = b.kind === 'rainbow' ? ['#EF3B36', '#FF8C1A', '#FFD21F', '#3DBE4B', '#2F7BEA', '#8E4FD6']
          : b.kind === 'star' ? ['#FFD21F', '#FFE985', '#F5B400', '#fff']
          : [b.color.hex, b.color.hex, b.color.light, b.color.dark];
        const ring = U.el('div', { class: 'bp-ring', style: { left: cx + 'px', top: cy + 'px', width: b.W * 1.15 + 'px', height: b.W * 1.15 + 'px', borderColor: b.kind === 'normal' && b.color.id !== 'white' ? U.shade(b.color.hex, 0.55) : '#fff' } });
        fxl.appendChild(ring);
        ring.animate([{ transform: 'translate(-50%,-50%) scale(.35)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(1.45)', opacity: 0 }], { duration: 340, easing: 'ease-out' }).onfinish = () => ring.remove();
        const n = 10;
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2 + Math.random() * 0.6;
          const dist = b.W * U.rand(0.5, 1.05);
          const sz = b.W * U.rand(0.1, 0.2);
          const sh = U.el('div', { class: 'bp-shard', style: {
            left: cx + 'px', top: cy + 'px', width: sz + 'px', height: sz * U.rand(0.5, 0.8) + 'px', background: cols[k % cols.length],
            borderRadius: `${U.randInt(30, 70)}% ${U.randInt(30, 70)}% ${U.randInt(20, 60)}% ${U.randInt(40, 80)}%`,
            boxShadow: b.color && b.color.id === 'white' ? 'inset 0 0 0 2px #C9CED6' : 'none',
          } });
          fxl.appendChild(sh);
          const rot = (Math.random() - 0.5) * 600;
          const ex = Math.cos(a) * dist, ey = Math.sin(a) * dist;
          sh.animate([
            { transform: 'translate(-50%,-50%) rotate(0deg) scale(1)', opacity: 1 },
            { transform: `translate(calc(-50% + ${ex}px), calc(-50% + ${ey}px)) rotate(${rot * 0.6}deg) scale(1)`, opacity: 1, offset: 0.45 },
            { transform: `translate(calc(-50% + ${ex * 1.2}px), calc(-50% + ${ey + b.W * 0.9}px)) rotate(${rot}deg) scale(.5)`, opacity: 0 },
          ], { duration: U.rand(650, 900), easing: 'cubic-bezier(.12,.75,.35,1)' }).onfinish = () => sh.remove();
        }
        // the string flutters down
        const ds = U.el('div', { class: 'bp-dropstring', style: { left: b.x + 'px', top: b.y + 'px', width: b.W + 'px', height: b.W * 2 + 'px' } });
        ds.innerHTML = b.kind === 'star'
          ? '<svg viewBox="0 0 100 200"><path d="M50 86 C 41 104, 59 122, 50 140 S 43 175, 50 196" stroke="rgba(70,70,110,.55)" stroke-width="2.2" fill="none"/></svg>'
          : `<svg viewBox="0 0 100 200"><path d="M50 119 C 41 133, 59 147, 50 161 S 43 185, 50 198" stroke="rgba(70,70,110,.55)" stroke-width="2.2" fill="none"/><path d="M43 121 L50 110 L57 121 Q50 125 43 121 Z" fill="${b.color ? b.color.dark : '#8E4FD6'}"/></svg>`;
        fxl.appendChild(ds);
        const drift = (Math.random() - 0.5) * 60;
        ds.animate([
          { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
          { transform: `translate(${drift}px, ${b.W * 1.4}px) rotate(${drift / 3}deg)`, opacity: 0 },
        ], { duration: 900, easing: 'cubic-bezier(.5,0,.8,.6)' }).onfinish = () => ds.remove();
        const p = vp(cx, cy);
        PP.fx.confetti({ x: p.x, y: p.y, count: b.kind === 'normal' ? 16 : 50, colors: cols, power: b.kind === 'normal' ? 0.5 : 0.8, spread: 2 });
      }

      function pop(b) {
        const i = balloons.indexOf(b);
        if (i < 0) return;
        balloons.splice(i, 1);
        const cx = b.x + b.W * 0.5, cy = b.y + b.W * 0.58;
        b.el.remove();
        ctx.sfx('pop', { pan: U.clamp((cx / Math.max(1, w)) * 2 - 1, -0.7, 0.7) * 0.8, vel: 0.9 });
        popFx(b, cx, cy);
        const p = vp(cx, cy);
        const fs = U.clamp(b.W * 0.5, 40, 66);

        if (b.kind !== 'normal') {
          ctx.sfx('magic');
          PP.fx.burst(p.x, p.y, { emoji: ['✨', '⭐', '🌟', '💫'], count: 14, distance: b.W * 1.7, size: U.clamp(b.W * 0.36, 30, 48) });
          for (let k = 0; k < 6; k++) ctx.setTimeout(() => {
            const sp = vp(U.clamp(cx + U.rand(-1.4, 1.4) * b.W, 20, w - 20), U.clamp(cy + U.rand(-1, 0.6) * b.W, 60, h - 20));
            PP.fx.burst(sp.x, sp.y, { emoji: ['✨', '⭐'], count: 4, distance: 50, size: 26 });
          }, 120 + k * 110);
          PP.fx.floatText(p.x, p.y - b.W * 0.2, b.kind === 'star' ? '⭐' : '🌈', { size: fs * 1.3 });
          if (!req && !celebrating) ctx.say(b.kind === 'star' ? ctx.pick(['A star!', 'Twinkle twinkle!', 'Star sparkles!']) : ctx.pick(['Rainbow!', 'A rainbow balloon!', 'Wow, rainbow!']));
          ctx.mascot.mood('surprise');
        } else {
          PP.fx.floatText(p.x, p.y - b.W * 0.25, cap(b.color.name) + '!', { color: b.color.hex, size: fs });
        }
        if (!b.party) addGarland(b);

        if (b.kind === 'normal' && req && b.color.id === req.color.id) { reqSuccess(b, p); return; }
        if (b.kind !== 'normal') return;
        if (req) {
          if (now() - req.t0 > 1500) req.others++;
          if (req.others && req.others % 3 === 0 && !celebrating) {
            ctx.say(`That's ${b.color.name}! Pop ${req.color.name}!`);
            req.lastSay = now();
            hint();
          } else {
            ctx.say(cap(b.color.name) + '!', { mode: 'skip' });
            if (req.others >= 2) hint();
          }
          return;
        }
        if (!celebrating) ctx.say(cap(b.color.name) + '!', { mode: 'skip' });
        if (now() < partyUntil) return;
        freePops++;
        if (freePops >= reqAfter && !partyPending && !celebrating) {
          freePops = -999; // until the request starts
          ctx.setTimeout(() => { if (!startRequest()) freePops = reqAfter - 1; }, 900);
        }
      }

      /* ---------------- garland & party ---------------- */
      function addGarland(b) {
        if (garlandN >= 10) return;
        const s = slots[garlandN++];
        const fill = b.kind === 'rainbow' ? 'url(#bp-rainbow)' : b.kind === 'star' ? 'url(#bp-gold)' : b.color.hex;
        const body = s.querySelector('.bp-mini');
        body.setAttribute('fill', fill);
        body.setAttribute('stroke', b.color ? U.shade(b.color.hex, -0.25) : 'rgba(0,0,0,.2)');
        body.setAttribute('stroke-dasharray', 'none');
        body.setAttribute('stroke-width', '2');
        s.querySelector('.bp-minishine').setAttribute('opacity', '1');
        s.querySelector('.bp-minihl').setAttribute('opacity', '.75');
        s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
        ctx.play('bell', PENTA[(garlandN - 1) % PENTA.length], { vel: 0.22, delay: 0.05 });
        if (garlandN >= 10) {
          partyPending = true;
          if (!req && !celebrating) ctx.setTimeout(party, 500);
        }
      }
      function resetGarland() {
        garlandN = 0;
        slots.forEach((s) => {
          s.classList.remove('on', 'fly');
          const body = s.querySelector('.bp-mini');
          body.setAttribute('fill', 'rgba(255,255,255,.35)');
          body.setAttribute('stroke', 'rgba(255,255,255,.95)');
          body.setAttribute('stroke-dasharray', '6 5');
          body.setAttribute('stroke-width', '3');
          s.querySelector('.bp-minishine').setAttribute('opacity', '0');
          s.querySelector('.bp-minihl').setAttribute('opacity', '0');
        });
      }
      function party() {
        if (!partyPending) return;
        partyPending = false;
        partyUntil = now() + 5000;
        freePops = Math.min(freePops, 0);
        ctx.say(ctx.pick(['Balloon party!', 'Hooray! Balloon party!']));
        ctx.mascot.mood('cheer');
        ctx.sfx('tada');
        ctx.sequence([['C5', 0.5], ['E5', 0.5], ['G5', 0.5], ['C6', 0.5], ['G5', 0.5], ['C6', 1.5]], { bpm: 300, inst: 'xylo', vel: 0.5 });
        slots.forEach((s, i) => ctx.setTimeout(() => { s.classList.remove('on'); s.classList.add('fly'); }, i * 50));
        ctx.setTimeout(resetGarland, 1500);
        const pal = D.RAINBOW;
        const n = w > 700 ? 16 : 11;
        const order = ctx.shuffle(Array.from({ length: n }, (_, i) => i));
        order.forEach((slot, k) => {
          ctx.setTimeout(() => {
            const lo = w >= 500 ? 92 : 64;
            const x = lo + (slot + 0.5) * ((w - lo - BW * 0.9) / n) + U.rand(-10, 10);
            spawn({ party: true, x: U.clamp(x, lo, w - BW), color: pal[(slot + k) % pal.length], y0: U.rand(0, 60) });
          }, k * 85);
        });
        const a = vp(w * 0.15, h), c = vp(w * 0.85, h);
        PP.fx.confetti({ x: a.x, y: a.y, count: 60, power: 1.1 });
        PP.fx.confetti({ x: c.x, y: c.y, count: 60, power: 1.1 });
      }

      /* ---------------- requests ("Can you pop a red balloon?") ---------------- */
      function setAsk(color) {
        if (!color) { ask.classList.remove('show', 'bp-bump'); return; }
        ask.querySelector('.bp-askbody').setAttribute('fill', color.hex);
        ask.querySelector('.bp-askbody').setAttribute('stroke', U.shade(color.hex, -0.3));
        ask.querySelector('.bp-askknot').setAttribute('fill', color.dark);
        ask.classList.add('show');
      }
      function bumpAsk() { ask.classList.remove('bp-bump'); void ask.offsetWidth; ask.classList.add('bp-bump'); }
      function ensureTargets(n) {
        if (!req) return;
        const have = balloons.filter((b) => b.color && b.color.id === req.color.id && b.y > h * 0.3 && !b.party).length;
        for (let k = have; k < n; k++) ctx.setTimeout(() => { if (req) { spawn({ color: req.color }); lastSpawn = t; } }, (k - have) * 650);
      }
      function hint() {
        if (!req) return;
        req.hinted = true;
        balloons.forEach((b) => { if (b.color && b.color.id === req.color.id) setGlow(b, true); });
        bumpAsk();
      }
      function clearHint() { balloons.forEach((b) => { if (b.glow) setGlow(b, false); }); }

      function startRequest() {
        if (req || celebrating || partyPending || now() < partyUntil || !ctx.alive) return false;
        colors = D.colorsForLevel(ctx.level);
        const pool = colors.filter((c) => c.id !== lastReqId);
        const color = ctx.pick(pool.length ? pool : colors);
        lastReqId = color.id;
        req = { color, t0: now(), lastSay: now(), says: 1, others: 0, hinted: false };
        const c = color.name;
        ctx.setPrompt(`Pop a ${c} balloon!`);
        ctx.say(ctx.pick([`Can you pop a ${c} balloon?`, `Pop a ${c} balloon!`, `Can you find ${c}? Pop it!`]));
        ctx.mascot.mood('wave');
        setAsk(color);
        ensureTargets(lvl() <= 2 ? 2 : 1);
        return true;
      }
      async function reqSuccess(b, p) {
        const r = req;
        req = null;
        clearHint();
        setAsk(null);
        const firstTry = r.others === 0 && !r.hinted;
        celebrating = true;
        ctx.success(firstTry);
        PP.fx.burst(p.x, p.y, { emoji: ['⭐', '🌟', '✨'], count: 9, distance: 140 });
        const C = cap(r.color.name);
        await ctx.celebrate({ x: p.x, y: p.y, colors: [r.color.hex, r.color.light, r.color.dark, '#FFE45C', '#fff'],
          say: ctx.pick([`Yay! ${C}!`, `You popped ${r.color.name}!`, `${C}! ${ctx.praise()}`, `${ctx.praise()} A ${r.color.name} balloon!`]) });
        celebrating = false;
        colors = D.colorsForLevel(ctx.level);
        freePops = 0;
        reqAfter = ctx.randInt.apply(null, [[0, 0], [3, 5], [3, 4], [2, 4], [2, 3], [2, 3]][ctx.level]);
        ctx.setPrompt('Pop the balloons!');
        if (partyPending) ctx.setTimeout(party, 300);
      }
      function giveUp() {
        const r = req;
        req = null;
        clearHint();
        setAsk(null);
        if (r.others >= 2) ctx.miss();
        freePops = 0;
        reqAfter = [0, 6, 5, 4, 4, 3][ctx.level];
        ctx.setPrompt('Pop the balloons!');
        if (r.others > 0) ctx.say(ctx.pick(['Pop them all!', 'Pop, pop, pop!']));
        if (partyPending) ctx.setTimeout(party, 600);
      }

      ctx.setInterval(() => {
        if (!req || celebrating) return;
        const n = now();
        if (n - req.lastSay > 7000 && !PP.speech.speaking() && !PP.app.overlayPromise) {
          if (req.says >= 3) { giveUp(); return; }
          req.says++;
          req.lastSay = n;
          const c = req.color.name;
          ctx.say(ctx.pick([`${cap(c)}! Pop a ${c} balloon!`, `Look! ${cap(c)} balloons! Pop one!`, `Where's ${c}? Pop it!`]));
          hint();
          ensureTargets(2);
        }
      }, 300);

      /* ---------------- touch ---------------- */
      function skyTap(e, pt) {
        const tgt = e.target;
        const p = vp(pt.x, pt.y);
        if (tgt && tgt.closest && tgt.closest('.bp-sun')) {
          sun.classList.remove('bp-happy'); void sun.offsetWidth; sun.classList.add('bp-happy');
          ctx.sfx('twinkle');
          ctx.say(ctx.pick(['Hello, sun!', 'Sunny!', 'The sun!']), { mode: 'skip' });
          PP.fx.burst(p.x, p.y, { emoji: ['✨', '🌟'], count: 6, distance: 70, size: 30 });
          return;
        }
        const cl = tgt && tgt.closest && tgt.closest('.bp-cloud');
        if (cl) {
          cl.classList.remove('bp-squish'); void cl.offsetWidth; cl.classList.add('bp-squish');
          ctx.sfx('bubble');
          ctx.play('kalimba', ctx.pick(['C5', 'E5', 'G5']), { vel: 0.35 });
          return;
        }
        ctx.play('bell', ctx.pick(PENTA), { vel: 0.18 });
        const tw = U.el('div', { class: 'bp-twinkle pp-emoji', text: ctx.pick(['✨', '⭐', '💫']), style: { left: pt.x + 'px', top: pt.y + 'px' } });
        fxl.appendChild(tw);
        tw.animate([
          { transform: 'translate(-50%,-50%) scale(.2) rotate(-40deg)', opacity: 1 },
          { transform: 'translate(-50%,-90%) scale(1.1) rotate(10deg)', opacity: 1, offset: 0.4 },
          { transform: 'translate(-50%,-160%) scale(.6) rotate(30deg)', opacity: 0 },
        ], { duration: 700, easing: 'ease-out' }).onfinish = () => tw.remove();
      }

      ctx.on(stage, 'pointerdown', (e) => {
        if (e.button > 0) return;
        const tgt = e.target;
        if (tgt && tgt.closest && tgt.closest('.pp-game-pip')) return;
        e.preventDefault();
        idleTalks = 0;
        const pt = stagePt(e);
        if (tgt && tgt.closest && tgt.closest('.bp-ask') && req) {
          bumpAsk();
          ctx.sfx('boing', { vel: 0.4 });
          ctx.say(`${cap(req.color.name)}! Pop a ${req.color.name} balloon!`);
          req.lastSay = now();
          return;
        }
        let best = null, bd = 1;
        for (const b of balloons) {
          const cx = b.x + b.W * 0.5, cy = b.y + b.W * 0.64;
          const dx = (pt.x - cx) / (b.W * 0.64), dy = (pt.y - cy) / (b.W * 0.78);
          const d = dx * dx + dy * dy;
          if (d <= bd) { bd = d; best = b; }
        }
        if (best) pop(best);
        else skyTap(e, pt);
      });

      ctx.idle(9000, () => {
        if (req || celebrating) return;
        idleTalks++;
        const mid = balloons.filter((b) => !b.party && b.y > h * 0.2 && b.y < h * 0.7);
        const b = mid.length ? ctx.pick(mid) : null;
        if (b) { b.el.classList.remove('bp-nudge'); void b.el.offsetWidth; b.el.classList.add('bp-nudge'); }
        if (idleTalks <= 3) {
          ctx.mascot.mood('wave');
          ctx.say(ctx.pick(['Pop a balloon!', 'Tap a balloon! Pop!', 'Pop! Pop! Can you pop one?']));
        }
      });

      /* ---------------- start ---------------- */
      ctx.setPrompt('Pop the balloons!');
      ctx.say(ctx.pick(['Pop the balloons!', "Balloons! Let's pop them!"]));
      // a first few balloons already on their way
      for (let k = 0; k < 3; k++) {
        const b = spawn();
        b.y = h * (0.55 + k * 0.17);
      }
      lastSpawn = 0;

      if (/[?&]ppdebug/.test(location.search)) window.__bp = { spawn, startRequest, party: () => { partyPending = true; party(); }, get req() { return req; }, balloons };
      return { destroy() { if (window.__bp) delete window.__bp; } };
    },
  });
})();

</script>
<script data-src="games/colors-paint.js">
/* Paint — a toddler coloring book.
 * Big paint pots (a color is always selected). Tap a region → a juicy paint splat floods it with the color.
 * When every region is painted the picture comes alive (fish swims, car drives, rocket launches…), then a big
 * arrow brings the next picture. From level 2 Pip sometimes suggests a color ("Let's make the sun yellow!") —
 * following it earns extra praise; ignoring it is fine.
 *
 * Level 1: 6 paints, simple pictures (4–6 regions), no suggestions.
 * Level 3+: 8 paints, all pictures (up to 8 regions), suggestions (up to 2 per picture at level 4–5).
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const D = PP.data;
  const INK = '#2B2340';

  /* ---------------- picture helpers ---------------- */
  // R(id, name, shape-markup, hintColorId) → paintable region;  X(markup) → fixed detail;  G(key, items, {t}) → animatable group
  const R = (id, name, shape, hint) => ({ id, name, shape, hint });
  const X = (markup) => ({ x: markup });
  const G = (k, items, o) => Object.assign({ k, items }, o || {});
  const eye = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x + r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.36}" fill="#fff"/>`;
  const rays = (cx, cy, r1, r2, n) => Array.from({ length: n }, (_, i) => {
    const a = (i / n) * Math.PI * 2;
    return `M${(cx + Math.cos(a) * r1).toFixed(1)} ${(cy + Math.sin(a) * r1).toFixed(1)} L${(cx + Math.cos(a) * r2).toFixed(1)} ${(cy + Math.sin(a) * r2).toFixed(1)}`;
  }).join(' ');
  const petal = (a) => `<ellipse cx="200" cy="74" rx="41" ry="56" transform="rotate(${a} 200 140)"/>`;

  // Web Animations helper for SVG parts (transform-box: fill-box so % origins work on groups)
  function anim(el, frames, opts, origin) {
    if (!el || !el.animate) return null;
    el.style.transformBox = 'fill-box';
    el.style.transformOrigin = origin || '50% 50%';
    return el.animate(frames, opts);
  }

  const PICTURES = [
    {
      id: 'cupcake', name: 'cupcake', intro: 'A cupcake!', cheer: 'Yummy yummy!', vb: '14 14 372 372',
      bg: `<ellipse cx="200" cy="370" rx="150" ry="16" fill="#F1E9DD"/>`,
      parts: [
        G('cake', [
          R('wrapper', 'cupcake', '<path d="M96 220 L304 220 L276 364 L124 364 Z"/>'),
          X(`<path d="M128 236 L140 352 M272 236 L260 352" stroke="${INK}" stroke-width="4" stroke-linecap="round" opacity=".35"/>`),
          X(`${eye(172, 284, 9)}${eye(228, 284, 9)}<path d="M186 306 Q200 320 214 306" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="152" cy="306" rx="10" ry="6" fill="#FF8FA3" opacity=".5"/><ellipse cx="248" cy="306" rx="10" ry="6" fill="#FF8FA3" opacity=".5"/>`),
          R('frosting', 'frosting', '<path d="M84 214 C 62 186 88 150 124 150 L276 150 C 312 150 338 186 316 214 C 302 236 282 222 266 232 C 250 244 230 228 212 238 C 196 246 180 230 164 240 C 146 248 132 226 116 234 C 100 240 92 226 84 214 Z"/>', 'pink'),
          R('swirl', 'frosting', '<path d="M124 156 C 118 114 160 94 200 102 C 240 94 282 114 276 156 Z"/>'),
          G('sprinkles', [X(['#EF3B36', '#2F7BEA', '#FFD21F', '#3DBE4B', '#8E4FD6', '#FF8C1A', '#FF6FB5', '#22C3C3', '#EF3B36', '#2F7BEA', '#3DBE4B', '#FFD21F']
            .map((c, i) => { const x = 116 + (i % 6) * 34 + (i > 5 ? 16 : 0), y = i > 5 ? 192 : 134 + (i % 2) * 12 + (i % 3 === 0 ? 30 : 0); return `<rect x="${x}" y="${y}" width="16" height="7" rx="3.5" fill="${c}" transform="rotate(${(i * 47) % 160 - 80} ${x + 8} ${y + 3})"/>`; }).join(''))], { style: 'opacity:0' }),
          G('cherry', [
            X(`<path d="M206 54 C 210 38 222 28 238 24" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`),
            R('cherry', 'cherry', '<circle cx="200" cy="80" r="30"/>', 'red'),
            X('<ellipse cx="189" cy="70" rx="7" ry="4.5" fill="#fff" opacity=".7" transform="rotate(-30 189 70)"/>'),
          ]),
        ]),
      ],
      alive(P) {
        anim(P.part('cake'), [
          { transform: 'scale(1,1)' }, { transform: 'scale(1.08,.9)', offset: 0.18 }, { transform: 'scale(.95,1.08) translateY(-18px)', offset: 0.4 },
          { transform: 'scale(1.04,.96)', offset: 0.6 }, { transform: 'scale(1,1)' },
        ], { duration: 900, iterations: 3, easing: 'ease-in-out' }, '50% 100%');
        anim(P.part('cherry'), [{ transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-60px) rotate(20deg)', offset: 0.45 }, { transform: 'translateY(0) rotate(0)' }],
          { duration: 900, delay: 600, iterations: 2, easing: 'cubic-bezier(.3,0,.5,1)' });
        const sp = P.part('sprinkles');
        if (sp) sp.animate([{ opacity: 0, transform: 'translateY(-40px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 700, delay: 300, fill: 'forwards', easing: 'cubic-bezier(.3,1.5,.5,1)' });
        P.sfx('chomp', 900);
        P.sfx('sparkle', 300);
      },
    },
    {
      id: 'fish', name: 'fish', intro: 'A fish!', cheer: 'Swim, little fish!', vb: '18 14 380 380',
      bg: `<path d="M24 360 q 22 -14 44 0 t 44 0 t 44 0 M232 372 q 22 -14 44 0 t 44 0 t 44 0" stroke="#CFE9F7" stroke-width="6" fill="none" stroke-linecap="round"/>`,
      parts: [
        G('fishwrap', [G('fish', [
          G('tail', [R('tail', 'tail', '<path d="M134 200 C 106 172 76 140 52 118 C 34 152 34 248 52 282 C 76 260 106 228 134 200 Z"/>')]),
          R('fin', 'fin', '<path d="M168 144 C 174 74 236 22 296 132 Z"/>'),
          R('body', 'fish', '<path d="M112 200 C 116 140 176 106 240 108 C 304 110 348 152 348 200 C 348 248 304 290 240 292 C 176 294 116 260 112 200 Z"/>', 'orange'),
          G('sidefin', [R('sidefin', 'fin', '<path d="M196 206 C 226 170 284 178 290 224 C 262 258 220 254 196 206 Z"/>')]),
          X(`<circle cx="298" cy="176" r="20" fill="#fff" stroke="${INK}" stroke-width="5"/>${eye(302, 178, 10)}<path d="M336 216 Q 324 228 312 220" stroke="${INK}" stroke-width="5" fill="none" stroke-linecap="round"/>`),
        ]),
        G('bubbles', [
          R('bubble1', 'bubble', '<circle cx="360" cy="112" r="32"/>', 'blue'),
          R('bubble2', 'bubble', '<circle cx="322" cy="42" r="36"/>', 'blue'),
          X('<path d="M346 98 q 6 -9 15 -9 M306 27 q 7 -9 18 -9" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>'),
        ]),
        ], { t: 'translate(0 26)' }),
      ],
      alive(P) {
        anim(P.part('fish'), [
          { transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(-34px,10px) rotate(-4deg)', offset: 0.25 },
          { transform: 'translate(0,-8px) rotate(0)', offset: 0.5 }, { transform: 'translate(30px,8px) rotate(4deg)', offset: 0.75 }, { transform: 'translate(0,0) rotate(0)' },
        ], { duration: 2600, iterations: Infinity, easing: 'ease-in-out' });
        anim(P.part('tail'), [{ transform: 'rotate(-16deg)' }, { transform: 'rotate(16deg)' }], { duration: 260, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }, '100% 50%');
        anim(P.part('sidefin'), [{ transform: 'rotate(-10deg)' }, { transform: 'rotate(12deg)' }], { duration: 400, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }, '0% 50%');
        anim(P.part('bubbles'), [{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-26px)', opacity: 0.85 }], { duration: 1100, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
        P.sfx('bubble', 0); P.sfx('bubble', 250); P.sfx('splash', 500);
      },
    },
    {
      id: 'car', name: 'car', intro: 'A car!', cheer: 'Beep beep! Vroom!', vb: '22 66 356 356',
      bg: `<path d="M10 354 H390" stroke="#E2DACB" stroke-width="7" stroke-dasharray="28 20" stroke-linecap="round"/>`,
      parts: [
        G('car', [
          G('carbody', [
            R('cabin', 'roof', '<path d="M100 216 L140 140 C 146 129 154 124 168 124 L262 124 C 276 124 285 130 292 140 L334 216 Z"/>'),
            R('winback', 'window', '<path d="M128 206 L156 152 C 160 145 165 142 172 142 L206 142 L206 206 Z"/>', 'blue'),
            R('winfront', 'window', '<path d="M222 206 L222 142 L258 142 C 266 142 272 146 276 152 L306 206 Z"/>', 'blue'),
            R('body', 'car', '<path d="M34 264 C 34 230 58 210 92 210 L314 210 C 348 210 370 230 370 264 L370 288 C 370 300 362 308 350 308 L54 308 C 42 308 34 300 34 288 Z"/>', 'red'),
            X(`<path d="M214 216 V296" stroke="${INK}" stroke-width="4" opacity=".45"/><rect x="230" y="232" width="26" height="9" rx="4.5" fill="${INK}" opacity=".55"/><path d="M370 236 C 360 236 352 244 352 256 L370 256 Z" fill="#FFE45C" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M34 240 C 42 240 48 246 48 254 L34 254 Z" fill="#FF6B6B" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`),
          ]),
          G('wl', [R('wheel1', 'wheel', '<circle cx="112" cy="308" r="44"/>'), X(`<circle cx="112" cy="308" r="16" fill="#E9E7F0" stroke="${INK}" stroke-width="4"/><path d="M112 296 V320 M100 308 H124" stroke="${INK}" stroke-width="3" opacity=".5"/>`)]),
          G('wr', [R('wheel2', 'wheel', '<circle cx="294" cy="308" r="44"/>'), X(`<circle cx="294" cy="308" r="16" fill="#E9E7F0" stroke="${INK}" stroke-width="4"/><path d="M294 296 V320 M282 308 H306" stroke="${INK}" stroke-width="3" opacity=".5"/>`)]),
        ]),
      ],
      alive(P) {
        const spin = [{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }];
        anim(P.part('wl'), spin, { duration: 500, iterations: Infinity });
        anim(P.part('wr'), spin, { duration: 500, iterations: Infinity });

    const uid = ++uidN;
    let defs = '';
    const regions = [];
    function items(list) {
      let s = '';
      list.forEach((it) => {
        if (it.items) {
          s += `<g class="pt-part" data-k="${it.k}"${it.style ? ` style="${it.style}"` : ''}>${it.t ? `<g transform="${it.t}">` : ''}${items(it.items)}${it.t ? '</g>' : ''}</g>`;
        } else if (it.x) {
          s += `<g class="pt-detail">${it.x}</g>`;
        } else {
          const cid = `pt-c${uid}-${it.id}`;
          defs += `<clipPath id="${cid}">${it.shape}</clipPath>`;
          regions.push(it);
          s += `<g class="pt-reg" data-r="${it.id}"><g class="pt-r" fill="#fff">${it.shape}</g><g class="pt-flood" clip-path="url(#${cid})"></g>` +
            `<g class="pt-o" fill="none" stroke="${INK}" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round">${it.shape}</g></g>`;
        }
      });
      return s;
    }
    const body = items(pic.parts);
    const svg = `<svg class="pt-svg" viewBox="${pic.vb || '0 0 400 400'}" aria-hidden="true"><defs>${defs}</defs>${pic.bg || ''}${body}</svg>`;
    return { svg, regions };
  }

  function blobPath(R, seed) {
    const n = 11, pts = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + seed;
      const r = R * (0.86 + 0.14 * Math.abs(Math.sin(seed * 7 + i * 2.3)));
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    let d = '';
    for (let i = 0; i < n; i++) {
      const p = pts[i], q = pts[(i + 1) % n];
      const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      d += i === 0 ? `M${mx.toFixed(1)} ${my.toFixed(1)} ` : '';
      const nq = pts[(i + 2) % n];
      const nx = (q[0] + nq[0]) / 2, ny = (q[1] + nq[1]) / 2;
      d += `Q${q[0].toFixed(1)} ${q[1].toFixed(1)} ${nx.toFixed(1)} ${ny.toFixed(1)} `;
    }
    return d + 'Z';
  }

  PP.registerGame({
    id: 'paint',
    title: 'Paint',
    domain: 'colors',
    icon: '🎨',
    tileColor: '#FF8C42',
    order: 11,
    create(stage, ctx) {
      const fxl = ctx.el('div', { class: 'pt-fx' });
      const pal = ctx.el('div', { class: 'pt-pal' });
      // soft paint splats decorating the room
      [['#FFB3D8', 'left:-6vmin;bottom:16%', 30, 1.2], ['#86B6FF', 'left:16%;bottom:-10vmin', 26, 3.1], ['#FFE985', 'left:30%;top:-7vmin', 24, 5.3],
        ['#8FE39A', 'right:22%;bottom:-8vmin', 28, 0.4], ['#C9A6F2', 'left:-4vmin;top:22%', 16, 2.2]].forEach(([c, pos, sz, seed]) => {
        const d = ctx.el('div', { class: 'pt-deco' });
        d.style.cssText += pos + `;width:${sz}vmin;height:${sz}vmin`;
        d.innerHTML = `<svg viewBox="-60 -60 120 120"><path d="${blobPath(40, seed)}" fill="${c}"/><circle cx="${Math.cos(seed) * 52}" cy="${Math.sin(seed) * 52}" r="7" fill="${c}"/><circle cx="${Math.cos(seed + 2) * 50}" cy="${Math.sin(seed + 2) * 50}" r="4.5" fill="${c}"/><circle cx="${Math.cos(seed + 4) * 54}" cy="${Math.sin(seed + 4) * 54}" r="5.5" fill="${c}"/></svg>`;
        stage.appendChild(d);
      });
      stage.append(pal, fxl);
      ctx.mascot.show({ corner: 'bl' });

      let colors = [];
      let current = null;
      let pots = [];
      let card = null, tapes = [], svgEl = null, pic = null, regions = [], painted = new Map();
      let done = false, nextBtn = null, sugg = null, suggCount = 0, picIdx = -1, history = [], idleTalks = 0;
      let lastSpoken = '', paintCount = 0, picStops = [];
      let L = { landscape: false, S: 300, x: 0, y: 0, pot: 80 };

      /* ---------------- palette ---------------- */
      function buildPalette() {
        const lvl = ctx.level;
        const want = paletteFor(lvl);
        if (pots.length === want.length) return;
        colors = want;
        pal.innerHTML = '';
        pots = colors.map((c) => {
          const p = ctx.el('button', { class: 'pt-pot pp-noripple', 'aria-label': c.name, style: { '--c': c.hex } });
          p.innerHTML = potMarkup(c);
          p.dataset.c = c.id;
          ctx.tap(p, () => {
            idleTalks = 0;
            select(c, true);
          });
          pal.appendChild(p);
          return p;
        });
        if (!current || !colors.find((c) => c.id === current.id)) current = colors[U.randInt(0, Math.min(4, colors.length - 1))];
        select(current, false);
        layout();
      }
      function select(c, user) {
        current = c;
        pots.forEach((p) => p.classList.toggle('sel', p.dataset.c === c.id));
        if (user) {
          const p = pots.find((q) => q.dataset.c === c.id);
          p.classList.remove('wig'); void p.offsetWidth; p.classList.add('wig');
          ctx.sfx('bubble', { vel: 0.7 });
          ctx.say(U.cap(c.name) + '!');
          lastSpoken = c.id;
          const r = p.getBoundingClientRect();
          drops(r.left + r.width / 2, r.top + r.height * 0.3, c, 5, 0.6);
        }
      }

      /* ---------------- layout ---------------- */
      function layout() {
        const { w, h } = ctx.size();
        const n = pots.length || 6;
        const pip = U.clamp(Math.min(w, h) * 0.14, 80, 140);
        const land = w > h * 1.08;
        const gap = U.clamp(Math.min(w, h) * 0.018, 8, 16);
        const pad = 12;
        let cols, rows, pot, palW, palH;
        if (land) {
          cols = 2; rows = Math.ceil(n / 2);
          pot = Math.min(126, (h - pad * 2 - gap * (rows - 1)) / rows - 4, (w * 0.26 - gap) / 2);
          palW = cols * pot + gap * (cols - 1);
          palH = rows * pot + gap * (rows - 1);
          pal.style.left = (w - palW - pad - 6) + 'px';
          pal.style.top = (h - palH) / 2 + 'px';
          const areaL = Math.max(100, pip + 18), areaR = w - palW - pad * 2 - 10;
          const S = Math.max(160, Math.min(h - 2 * pad - 8, areaR - areaL));
          L = { landscape: true, S, x: areaL + (areaR - areaL - S) / 2, y: (h - S) / 2 };
        } else {
          cols = n <= 6 ? (w >= 640 ? 6 : 3) : (w >= 700 ? 8 : 4);
          rows = Math.ceil(n / cols);
          pot = Math.min(118, (w - pad * 2 - gap * (cols - 1)) / cols - 2);
          palW = cols * pot + gap * (cols - 1);
          palH = rows * pot + gap * (rows - 1);
          pal.style.left = (w - palW) / 2 + 'px';
          pal.style.top = (h - palH - pad - 10) + 'px';
          const top = Math.max(92, pip + 14), bottom = h - palH - pad - 10 - 16;
          const S = Math.max(160, Math.min(w - 2 * pad - 4, bottom - top));
          L = { landscape: false, S, x: (w - S) / 2, y: top + (bottom - top - S) / 2 };
        }
        pal.style.gridTemplateColumns = `repeat(${cols}, ${pot}px)`;
        pal.style.gridAutoRows = pot + 'px';
        pal.style.gap = gap + 'px';
        pal.style.setProperty('--pot', pot + 'px');
        ctx.mascot.show({ corner: land ? 'bl' : 'tr' });
        placeCard();
      }
      function placeCard() {
        if (!card) return;
        Object.assign(card.style, { left: L.x + 'px', top: L.y + 'px', width: L.S + 'px', height: L.S + 'px' });
        const tw = L.S * 0.18;
        tapes.forEach((t, i) => Object.assign(t.style, {
          left: (i ? L.x + L.S - tw * 0.75 : L.x - tw * 0.25) + 'px', top: (L.y - L.S * 0.02) + 'px', width: tw + 'px', height: L.S * 0.065 + 'px',
          transform: `rotate(${i ? 38 : -38}deg)`,
        }));
        if (nextBtn) {
          const b = nextBtn.offsetWidth || 100; // layout size (rect is 0 while its pop-in starts at scale 0)
          const sw = stage.clientWidth, sh = stage.clientHeight;
          nextBtn.style.left = U.clamp(L.x + L.S - b * 0.72, 8, sw - b - 8) + 'px';
          nextBtn.style.top = U.clamp(L.y + L.S - b * 0.72, 8, sh - b - 8) + 'px';
        }
      }
      ctx.onResize(layout);

      /* ---------------- picture ---------------- */
      function choosePicture() {
        const lvl = ctx.level;
        const pool = PICTURES.map((p, i) => i).filter((i) => (PICTURES[i].minLevel || 1) <= lvl);
        const fresh = pool.filter((i) => !history.includes(i));
        const i = fresh.length ? (history.length === 0 ? fresh[0] : ctx.pick(fresh)) : ctx.pick(pool.filter((i) => i !== history[history.length - 1]));
        history.push(i);
        if (history.length > Math.max(2, pool.length - 1)) history.shift();
        return i;
      }
      function loadPicture(first, forceIdx) {
        picStops.forEach((s) => s());
        picStops = [];
        buildPalette();
        if (card) {
          const old = card, oldT = tapes;
          old.style.pointerEvents = 'none';
          oldT.forEach((t) => t.remove());
          const a = old.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(-70%) rotate(-10deg) scale(.7)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.5)', fill: 'forwards' });
          a.onfinish = () => old.remove();
        }
        if (nextBtn) { nextBtn.remove(); nextBtn = null; }
        picIdx = forceIdx != null ? forceIdx : choosePicture();
        pic = PICTURES[picIdx];
        const r = renderPicture(pic);
        regions = r.regions;
        painted = new Map();
        done = false; sugg = null; suggCount = 0; paintCount = 0;
        card = ctx.el('div', { class: 'pt-card in' });
        card.innerHTML = r.svg;
        svgEl = card.firstElementChild;
        tapes = [ctx.el('div', { class: 'pt-tape' }), ctx.el('div', { class: 'pt-tape' })];
        stage.append(card, ...tapes);
        placeCard();
        ctx.setPrompt(`Let's paint the ${pic.name}!`);
        ctx.say(first ? `Let's paint! ${pic.intro}` : `${pic.intro} Let's paint it!`);
      }

      /* ---------------- painting ---------------- */
      function regionEl(id) { return svgEl.querySelector(`.pt-reg[data-r="${id}"]`); }
      function findRegionAt(x, y) {
        const hit = (px, py) => {
          const el = document.elementFromPoint(px, py);
          const r = el && el.closest && el.closest('.pt-r');
          return r && card.contains(r) ? r : null;
        };
        let r = hit(x, y);
        if (r) return r;
        const step = L.S * 0.035;
        for (let ring = 1; ring <= 3; ring++) {
          for (let k = 0; k < 10; k++) {
            const a = (k / 10) * Math.PI * 2 + ring;
            r = hit(x + Math.cos(a) * step * ring, y + Math.sin(a) * step * ring);
            if (r) return r;
          }
        }
        return null;
      }
      function drops(x, y, c, n, scale) {
        const sr = stage.getBoundingClientRect();
        for (let k = 0; k < n; k++) {
          const s = U.rand(8, 18) * (scale || 1) * (L.S / 380 + 0.4);
          const d = U.el('div', { class: 'pt-drop', style: { left: x - sr.left + 'px', top: y - sr.top + 'px', width: s + 'px', height: s + 'px', background: c.hex,
            boxShadow: `inset -${s * 0.15}px -${s * 0.15}px 0 ${U.rgba(c.dark, 0.5)}` } });
          fxl.appendChild(d);
          const a = Math.random() * Math.PI * 2, dist = U.rand(30, 70) * (scale || 1) * (L.S / 380 + 0.3);
          d.animate([
            { transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 },
            { transform: `translate(calc(-50% + ${Math.cos(a) * dist}px), calc(-50% + ${Math.sin(a) * dist - 20}px)) scale(1)`, opacity: 1, offset: 0.5 },
            { transform: `translate(calc(-50% + ${Math.cos(a) * dist * 1.2}px), calc(-50% + ${Math.sin(a) * dist + 30}px)) scale(.3)`, opacity: 0 },
          ], { duration: U.rand(500, 700), easing: 'cubic-bezier(.2,.7,.4,1)' }).onfinish = () => d.remove();
        }
      }
      function flood(regEl, c, x, y) {
        const r = regEl.querySelector('.pt-r');
        const fl = regEl.querySelector('.pt-flood');
        let p = { x: 200, y: 200 };
        try {
          const m = r.getScreenCTM().inverse();
          const pt = svgEl.createSVGPoint();
          pt.x = x; pt.y = y;
          p = pt.matrixTransform(m);
        } catch (e) {}
        const bb = r.getBBox();
        const far = Math.max(Math.hypot(bb.x - p.x, bb.y - p.y), Math.hypot(bb.x + bb.width - p.x, bb.y - p.y),
          Math.hypot(bb.x - p.x, bb.y + bb.height - p.y), Math.hypot(bb.x + bb.width - p.x, bb.y + bb.height - p.y));
        const Rf = far / 0.84 + 6;
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const seed = Math.random() * 6;
        g.innerHTML = `<path d="${blobPath(Rf, seed)}" fill="${c.hex}"/>` +
          [0, 1, 2, 3].map((i) => { const a = seed + i * 1.6; return `<circle cx="${(Math.cos(a) * Rf * 0.98).toFixed(1)}" cy="${(Math.sin(a) * Rf * 0.98).toFixed(1)}" r="${(Rf * 0.16).toFixed(1)}" fill="${c.hex}"/>`; }).join('');
        fl.appendChild(g);
        const seq = (regEl._seq = (regEl._seq || 0) + 1);
        const t0 = performance.now(), dur = 430;
        // region "boing"
        const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
        ctx.raf(() => {
          const k = Math.min(1, (performance.now() - t0) / dur);
          const e = 1 - Math.pow(1 - k, 3);
          g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${Math.max(0.001, e).toFixed(3)})`);
          const s = 1 + Math.sin(Math.min(1, k * 1.4) * Math.PI) * 0.045;
          regEl.setAttribute('transform', `translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`);
          if (k >= 1) {
            regEl.removeAttribute('transform');
            if (regEl._seq === seq) {
              r.setAttribute('fill', c.hex);
              fl.innerHTML = '';
            }
            return false;
          }
        });
      }

      function paint(regEl, x, y) {
        const id = regEl.dataset.r;
        const reg = regions.find((q) => q.id === id);
        const c = current;
        const prev = painted.get(id);
        const r = regEl.querySelector('.pt-r');
        r.classList.remove('pt-hint');
        flood(regEl, c, x, y);
        drops(x, y, c, 6, 1);
        ctx.sfx('splat', { vel: 0.85 });
        const scale = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6'];
        ctx.play('marimba', scale[Math.min(scale.length - 1, painted.size + (prev ? 0 : 0))], { vel: 0.35, delay: 0.05 });
        painted.set(id, c.id);
        paintCount++;

        // a suggestion was waiting for this region?
        if (sugg && sugg.id === id) {
          const s = sugg;
          clearSuggestion();
          if (c.id === s.color.id) {
            const pt = { x, y };
            PP.fx.burst(pt.x, pt.y, { emoji: ['⭐', '🌟', '✨'], count: 8, distance: 110 });
            ctx.sfx('success');
            ctx.mascot.mood('cheer');
            ctx.success(true);
            ctx.say(`${ctx.praise()} A ${c.name} ${reg.name}!`);
          } else {
            ctx.mascot.mood('happy');
            ctx.say(`Ooh! A ${c.name} ${reg.name}!`);
          }
          lastSpoken = c.id;
        } else if (painted.size < regions.length) {
          // sometimes name the color (or color + thing); don't chatter on every tap
          const roll = Math.random();
          if (paintCount === 1 || (lastSpoken !== c.id && roll < 0.75)) {
            ctx.say(roll < 0.35 && paintCount > 1 ? `${U.cap(c.name)} ${reg.name}!` : `${U.cap(c.name)}!`, { mode: 'skip' });
            lastSpoken = c.id;
          } else if (roll < 0.18) {
            ctx.say(ctx.pick([`${U.cap(c.name)}!`, `A ${c.name} ${reg.name}!`, 'Splat!', 'Pretty!']), { mode: 'skip' });
          }
        }

        if (!done && painted.size === regions.length) { complete(); return; }
        if (!done) maybeSuggest();
      }

      /* ---------------- suggestions (level ≥ 2) ---------------- */
      function maybeSuggest() {
        const lvl = ctx.level;
        if (lvl < 2 || sugg || done) return;
        if (suggCount >= (lvl >= 4 ? 2 : 1)) return;
        if (paintCount < 1 || regions.length - painted.size < 2) return;
        if (Math.random() > (lvl >= 4 ? 0.45 : 0.35)) return;
        const cand = regions.filter((q) => q.hint && !painted.has(q.id) && colors.find((c) => c.id === q.hint));
        if (!cand.length) return;
        const reg = ctx.pick(cand);
        const color = D.colorById(reg.hint);
        sugg = { id: reg.id, color, t: performance.now() };
        suggCount++;
        ctx.setTimeout(() => {
          if (!sugg || sugg.id !== reg.id) return;
          const text = `Let's make the ${reg.name} ${color.name}!`;
          ctx.setPrompt(text);
          ctx.say(text);
          ctx.mascot.mood('wave');
          showSuggestion();
        }, 900);
        sugg.timer = ctx.setTimeout(() => { if (sugg && sugg.id === reg.id) clearSuggestion(); }, 20000);
      }
      function showSuggestion() {
        if (!sugg) return;
        const re = regionEl(sugg.id);
        if (re) { const r = re.querySelector('.pt-r'); r.style.setProperty('--hl', sugg.color.light); r.classList.add('pt-hint'); }
        const p = pots.find((q) => q.dataset.c === sugg.color.id);
        if (p) p.classList.add('pt-suggest');
      }
      function clearSuggestion() {
        if (!sugg) return;
        const re = regionEl(sugg.id);
        if (re) re.querySelector('.pt-r').classList.remove('pt-hint');
        pots.forEach((p) => p.classList.remove('pt-suggest'));
        if (sugg.timer) ctx.clearTimeout(sugg.timer);
        sugg = null;
        ctx.setPrompt(done ? 'Tap the arrow!' : `Let's paint the ${pic.name}!`);
      }

      /* ---------------- finished picture ---------------- */
      async function complete() {
        done = true;
        clearSuggestion();
        svgEl.querySelectorAll('.pt-hint').forEach((e) => e.classList.remove('pt-hint'));
        ctx.success(true);
        const myCard = card;
        await ctx.wait(650);
        if (card !== myCard) return;
        const P = {
          part: (k) => svgEl.querySelector(`.pt-part[data-k="${k}"]`),
          sfx: (name, delay) => { const id = ctx.setTimeout(() => { if (card === myCard) ctx.sfx(name); }, delay || 0); picStops.push(() => ctx.clearTimeout(id)); },
          later: (ms, fn) => { const id = ctx.setTimeout(() => { if (card === myCard) fn(); }, ms); picStops.push(() => ctx.clearTimeout(id)); },
          every: (ms, fn) => { const id = ctx.setInterval(() => { if (card === myCard) fn(); }, ms); picStops.push(() => ctx.clearInterval(id)); },
        };
        try { pic.alive(P); } catch (e) { console.error(e); }
        ctx.mascot.mood('surprise');
        await ctx.wait(500);
        if (card !== myCard) return;
        const cr = card.getBoundingClientRect();
        const used = [...new Set(painted.values())].map((id) => D.colorById(id).hex);
        await ctx.celebrate({ big: true, x: cr.left + cr.width / 2, y: cr.top + cr.height * 0.4, colors: used.concat(['#FFE45C', '#fff']), say: `${ctx.praise()} ${pic.cheer}` });
        if (card !== myCard) return;
        ctx.setPrompt('Tap the arrow!');
        nextBtn = PP.kit.nextButton(ctx, () => { idleTalks = 0; loadPicture(false); }, { parent: stage, cls: 'pt-next pp-noripple' });
        nextBtn.style.animation = 'pp-popin .5s cubic-bezier(.3,1.6,.5,1) both, pp-pulse 1.3s ease-in-out .5s infinite';
        placeCard();
      }

      /* ---------------- touch ---------------- */
      ctx.on(stage, 'pointerdown', (e) => {
        if (e.button > 0) return;
        const t = e.target;
        if (!t || !t.closest || t.closest('.pt-pot, .pp-game-pip, .pp-next')) return;
        idleTalks = 0;
        e.preventDefault();
        if (card && (t === card || card.contains(t) || pointInCard(e.clientX, e.clientY, 0.06))) {
          const reg = findRegionAt(e.clientX, e.clientY);
          if (reg) { paint(reg.parentNode, e.clientX, e.clientY); return; }
          ctx.sfx('tap', { vel: 0.4 });
          return;
        }
        bgSplat(e.clientX, e.clientY);
      });
      function pointInCard(x, y, margin) {
        const r = card.getBoundingClientRect();
        const m = r.width * margin;
        return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m;
      }
      function bgSplat(x, y) {
        const sr = stage.getBoundingClientRect();
        const s = U.clamp(L.S * 0.12, 36, 70);
        const el = U.el('div', { class: 'pt-bgsplat', style: { left: x - sr.left - s / 2 + 'px', top: y - sr.top - s / 2 + 'px', width: s + 'px', height: s + 'px' } });
        el.innerHTML = `<svg viewBox="-50 -50 100 100"><path d="${blobPath(34, Math.random() * 6)}" fill="${current.hex}" opacity=".85"/></svg>`;
        stage.appendChild(el);
        el.animate([{ transform: 'scale(.2)', opacity: 1 }, { transform: 'scale(1.1)', opacity: 1, offset: 0.25 }, { transform: 'scale(1)', opacity: 0.9, offset: 0.7 }, { transform: 'scale(1)', opacity: 0 }],
          { duration: 1400, easing: 'ease-out' }).onfinish = () => el.remove();
        ctx.sfx('splat', { vel: 0.35 });
      }

      ctx.idle(8000, () => {
        if (!card) return;
        idleTalks++;
        if (idleTalks > 3) return;
        if (done) {
          ctx.say(ctx.pick(['Tap the arrow!', 'More painting? Tap the arrow!']));
          if (nextBtn) PP.fx.glow(nextBtn, 3000);
          return;
        }
        if (sugg) {
          const reg = regions.find((q) => q.id === sugg.id);
          ctx.say(`Let's make the ${reg.name} ${sugg.color.name}!`);
          showSuggestion();
          return;
        }
        const un = regions.filter((q) => !painted.has(q.id));
        if (!un.length) return;
        const reg = ctx.pick(un);
        const re = regionEl(reg.id);
        if (re) {
          const r = re.querySelector('.pt-r');
          r.style.setProperty('--hl', current.light);
          r.classList.add('pt-hint');
          ctx.setTimeout(() => r.classList.remove('pt-hint'), 4000);
        }
        ctx.mascot.mood('wave');
        ctx.say(ctx.pick([`Tap the ${reg.name}!`, `Let's paint the ${reg.name}!`, 'Tap the picture to paint!']));
      });

      if (/[?&]ppdebug/.test(location.search)) {
        window.__pt = {
          PICTURES,
          show(i) { loadPicture(false, i); },
          fillAll() { svgEl.querySelectorAll('.pt-reg').forEach((g, k) => { current = colors[k % colors.length]; const b = g.querySelector('.pt-r').getBoundingClientRect(); paint(g, b.left + b.width / 2, b.top + b.height / 2); }); },
          fillOne() { const g = [...svgEl.querySelectorAll('.pt-reg')].find((g) => !painted.has(g.dataset.r)); if (g) { const b = g.querySelector('.pt-r').getBoundingClientRect(); paint(g, b.left + b.width / 2, b.top + b.height / 2); return g.dataset.r; } },
          get sugg() { return sugg; },
          select(id) { select(D.colorById(id), true); },
          regions: () => regions.map((r) => r.id),
        };
      }

      buildPalette();
      layout();
      loadPicture(true);

      return { destroy() { picStops.forEach((s) => s()); if (window.__pt) delete window.__pt; } };
    },
  });
})();

</script>
<script data-src="games/colors-sort.js">
/* Color Sort — color MATCHING (which comes before naming).
 * Big smiley toy boxes sit on the floor. One toy at a time appears; the child taps the matching box (or drags the
 * toy onto it). Correct → the toy hops into the box with a plop: "Red ball, red box!". Wrong → the toy bounces
 * back, "That's the blue box. Where does red go?", and after 2 misses the right box glows.
 * After the set is sorted the boxes jiggle and celebrate. Every other set is a quick "Find something yellow!"
 * round with real-world things, connecting colors to objects.
 *
 * Level 1: 2 boxes (red/blue/yellow), 4 toys, 2-choice find rounds.
 * Level 5: 4 boxes from 10 colors (look-alikes such as red/pink allowed), 6 toys, 3-choice find rounds.
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const D = PP.data;
  const INK = '#2B2340';

  function starPts(cx, cy, R, r) {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const rr = i % 2 ? r : R;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + ',' + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return p.join(' ');
  }

  /* ---------------- toys (any color) ---------------- */
  const TOYS = {
    ball: (c, L, K) => `
      <circle cx="50" cy="52" r="42" fill="${c}" stroke="${INK}" stroke-width="3.5"/>
      <path d="M10 50 C 30 64 70 64 90 50" stroke="${L}" stroke-width="10" fill="none" opacity=".9"/>
      <path d="M50 10 C 40 30 40 74 50 94" stroke="${K}" stroke-width="3" fill="none" opacity=".35"/>
      <circle cx="50" cy="52" r="42" fill="none" stroke="${INK}" stroke-width="3.5"/>
      <ellipse cx="34" cy="30" rx="12" ry="7" fill="#fff" opacity=".65" transform="rotate(-32 34 30)"/>`,
    car: (c, L, K) => `
      <path d="M8 62 C 8 50 16 44 26 44 L32 44 L42 26 C 44 22 48 20 52 20 L70 20 C 75 20 78 22 80 26 L90 44 C 96 46 98 52 98 60 L98 66 C 98 70 95 72 92 72 L12 72 C 9 72 8 70 8 66 Z" fill="${c}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M45 30 L58 30 L58 44 L37 44 Z" fill="#E4F5FF" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M64 30 L74 30 L81 44 L64 44 Z" fill="#E4F5FF" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M14 52 L26 52" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
      <circle cx="94" cy="54" r="3.5" fill="#FFE45C" stroke="${INK}" stroke-width="2"/>
      <circle cx="30" cy="74" r="13" fill="#3A3448" stroke="${INK}" stroke-width="3"/><circle cx="30" cy="74" r="5" fill="#D7D3E2"/>
      <circle cx="76" cy="74" r="13" fill="#3A3448" stroke="${INK}" stroke-width="3"/><circle cx="76" cy="74" r="5" fill="#D7D3E2"/>`,
    block: (c, L, K) => `
      <path d="M50 14 L88 32 L50 50 L12 32 Z" fill="${L}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M12 32 L50 50 L50 92 L12 74 Z" fill="${c}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M88 32 L50 50 L50 92 L88 74 Z" fill="${K}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="50" cy="31" rx="13" ry="6.5" fill="${c}" stroke="${INK}" stroke-width="3"/>
      <path d="M22 46 L24 66" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45"/>`,
    duck: (c, L, K, id) => `
      <path d="M14 60 C 14 46 26 42 38 46 C 34 30 44 14 60 14 C 76 14 84 28 80 40 C 92 40 98 52 94 64 C 90 82 70 90 50 90 C 28 90 14 78 14 60 Z" fill="${c}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M78 32 C 88 26 99 30 97 38 C 93 44 84 42 79 40 Z" fill="${id === 'orange' ? '#FFD21F' : '#FF8C1A'}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="64" cy="30" r="5" fill="${id === 'black' ? '#fff' : INK}"/><circle cx="65.6" cy="28.4" r="1.8" fill="${id === 'black' ? INK : '#fff'}"/>
      <path d="M32 62 C 42 54 58 56 62 66 C 54 76 38 76 32 62 Z" fill="${K}" opacity=".45"/>
      <ellipse cx="46" cy="26" rx="7" ry="4" fill="#fff" opacity=".55" transform="rotate(-35 46 26)"/>`,
    star: (c, L, K, id, F) => `
      <polygon points="${starPts(50, 54, 46, 22)}" fill="${c}" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="42" cy="54" r="3.6" fill="${F}"/><circle cx="58" cy="54" r="3.6" fill="${F}"/>
      <path d="M43 63 Q50 69 57 63" stroke="${F}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M38 34 L44 28" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".6"/>`,
    teddy: (c, L, K, id, F) => `
      <ellipse cx="50" cy="80" rx="27" ry="17" fill="${c}" stroke="${INK}" stroke-width="3.5"/>
      <ellipse cx="50" cy="84" rx="13" ry="9" fill="${L}"/>
      <circle cx="25" cy="24" r="12" fill="${c}" stroke="${INK}" stroke-width="3.5"/><circle cx="25" cy="24" r="5.5" fill="${L}"/>
      <circle cx="75" cy="24" r="12" fill="${c}" stroke="${INK}" stroke-width="3.5"/><circle cx="75" cy="24" r="5.5" fill="${L}"/>
      <circle cx="50" cy="46" r="29" fill="${c}" stroke="${INK}" stroke-width="3.5"/>
      <ellipse cx="50" cy="56" rx="12" ry="9" fill="${L}"/>
      <ellipse cx="50" cy="52" rx="4.6" ry="3.4" fill="${INK}"/>
      <path d="M45 60 Q50 64 55 60" stroke="${INK}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="39" cy="42" r="3.6" fill="${F}"/><circle cx="61" cy="42" r="3.6" fill="${F}"/>
      <ellipse cx="38" cy="30" rx="7" ry="4" fill="#fff" opacity=".45" transform="rotate(-30 38 30)"/>`,
    fish: (c, L, K) => `

    create(stage, ctx) {

      /* ---------------- layout ---------------- */
      function layout() {
        const { w, h } = ctx.size();
        const land = w > h * 1.1;
        const n = bins.length || 3;
        const pad = 12;
        const gap = U.clamp(Math.min(w, h) * 0.03, 10, 26);
        let cols = n, rows = 1;
        if (!land && n === 4 && w < 600) { cols = 2; rows = 2; }
        let bw = Math.min(land ? 280 : 290, (w - pad * 2 - gap * (cols - 1)) / cols);
        let bh = bw * 0.85;
        const maxH = land ? h * 0.4 : h * (rows > 1 ? 0.4 : 0.3);
        if (bh * rows + gap * (rows - 1) > maxH) { bh = (maxH - gap * (rows - 1)) / rows; bw = bh / 0.85; }
        const totW = cols * bw + gap * (cols - 1), totH = rows * bh + gap * (rows - 1);
        const x0 = (w - totW) / 2, y0 = h - totH - pad - 4;
        bins.forEach((b, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          Object.assign(b.el.style, { left: x0 + c * (bw + gap) + 'px', top: y0 + r * (bh + gap) + 'px', width: bw + 'px', height: bh + 'px' });

        });

        wall.style.height = floorTop + 'px';
        floor.style.top = floorTop + 'px';
        const top = Math.max(land ? 16 : 90, 0);
        const toyS = U.clamp(Math.min(w * 0.46, (y0 - top - 24) * 0.82), 110, 270);
        L = { w, h, bw, bh, toyS, toyX: w / 2, toyY: top + (y0 - top - 10) / 2, binTop: y0, land };
        const ws = U.clamp(Math.min(w, h) * 0.22, 90, 200);
        Object.assign(win.style, { width: ws + 'px', height: ws * 0.8 + 'px', left: (land ? w * 0.08 + 70 : 18) + 'px', top: (land ? 18 : 100) + 'px' });
        win.style.display = land && w < 900 ? 'none' : '';
        if (!land && toyS > w * 0.42) win.style.display = 'none';
        Object.assign(rug.style, { width: toyS * 1.5 + 'px', height: toyS * 0.32 + 'px', left: w / 2 - toyS * 0.75 + 'px', top: L.toyY + toyS * 0.5 + 'px' });
        rug.style.display = L.toyY + toyS * 0.66 > floorTop ? '' : 'none';
        if (toy) placeToy(toy.el);
        const pipS = U.clamp(Math.min(w, h) * 0.14, 80, 140);
        Object.assign(findArea.style, land

      function hintBin(b, on) { b.el.classList.toggle('hint', on); }
      /** the boxes' pupils look toward a point (viewport coords) */
      function look(x, y) {
        bins.forEach((b) => {
          const r = b.el.getBoundingClientRect();
          const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height * 0.65);
          const d = Math.hypot(dx, dy) || 1;

          b.pupils = b.pupils || b.el.querySelectorAll('.cs-pupil');
          b.pupils.forEach((p) => p.setAttribute('transform', `translate(${((dx / d) * k).toFixed(1)} ${((dy / d) * k).toFixed(1)})`));

      function makeToy(kind, color) {

        el.innerHTML = `<div class="cs-toyshadow"></div><div class="cs-toyin">${toySVG(kind, color)}</div>`;

        stage.appendChild(el);
        const t = { el, kind, color, moved: false };
        t.drag = ctx.drag(el, {
          lift: 1.1,
          onStart() {
            t.moved = false;
            idleTalks = 0;
          },
          onMove(e, d) {
            if (Math.hypot(d.dx, d.dy) > 12) t.moved = true;
            look(d.x, d.y);

            const b = binAt(d.x, d.y, true);
            if (!b) { ctx.sfx('boing', { vel: 0.35 }); return null; }
            if (b.color.id === t.color.id) { correct(b, true); return 'keep'; }
