<style>
/* ===================== Pip's Playroom — core styles ===================== */
:root {
  --ink: #2B2340;
  --ink-soft: #5B5270;
  --sky-1: #9FDCFF;
  --sky-2: #E6F6FF;
  --sun: #FFD21F;
  --good: #3DBE4B;
  --accent: #FF7A45;
  --radius: 26px;
  --font: ui-rounded, "SF Pro Rounded", "Fredoka", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
  background: var(--sky-2); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; }
button { font-family: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
img, svg { -webkit-user-drag: none; }
input, select, textarea { -webkit-user-select: text; user-select: text; font-family: inherit; font-size: 17px; }
#pp-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; overflow: hidden; }
.screen.hidden { display: none; }
.pp-emoji { font-family: var(--emoji); line-height: 1; display: inline-block; font-style: normal; font-weight: normal; }

/* ===================== start screen ===================== */
#start {
  z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin;
  background: radial-gradient(circle at 50% 35%, #FFF3C4 0%, #FFD86B 45%, #FFAE5C 100%);
  transition: opacity .6s, transform .6s;
}
#start.leaving { opacity: 0; transform: scale(1.08); }
.start-title {
  margin: 0; text-align: center; font-weight: 900; line-height: .95;
  font-size: clamp(44px, 11vmin, 120px); color: #fff; letter-spacing: .01em;
  text-shadow: 0 5px 0 #E8762C, 0 10px 22px rgba(160, 70, 0, .35);
}
.start-play {
  width: clamp(96px, 20vmin, 170px); height: clamp(96px, 20vmin, 170px); border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #7BE087, #3DBE4B 60%, #24913A);
  box-shadow: 0 9px 0 #1F7F33, 0 16px 30px rgba(0, 0, 0, .25);
  display: grid; place-items: center; animation: pp-pulse 1.4s ease-in-out infinite;
}
.start-play svg { width: 52%; height: 52%; margin-left: 8%; }
.start-play.pressed { transform: scale(.92); animation: none; box-shadow: 0 3px 0 #1F7F33, 0 8px 18px rgba(0, 0, 0, .25); }
.start-bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.start-bubbles span { position: absolute; bottom: -80px; border-radius: 50%; opacity: .75; animation: pp-rise linear infinite; }
@keyframes pp-rise { from { transform: translateY(0) } to { transform: translateY(-120vh) } }

/* ===================== home ===================== */
#home { background: linear-gradient(#8ED6FF, #D8F1FF 70%, #EAF8FF); }
.home-sky { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.home-hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 18vh; }
.cloud { position: absolute; background: #fff; border-radius: 100px; opacity: .9; animation: pp-drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud { width: 160px; height: 46px; }
.cloud::before { width: 70px; height: 70px; left: 24px; top: -34px; }
.cloud::after { width: 54px; height: 54px; left: 78px; top: -24px; }
.cloud.c0 { top: 14%; animation-duration: 70s; animation-delay: -10s; }
.cloud.c1 { top: 32%; animation-duration: 95s; animation-delay: -60s; transform: scale(.7); }
.cloud.c2 { top: 55%; animation-duration: 80s; animation-delay: -35s; }
.cloud.c3 { top: 72%; animation-duration: 110s; animation-delay: -80s; }
.cloud.c4 { top: 8%; animation-duration: 120s; animation-delay: -5s; }
@keyframes pp-drift { from { left: -220px } to { left: 110% } }

.home-header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  display: flex; align-items: center; gap: 2vmin;
  padding: calc(var(--safe-t) + 8px) calc(var(--safe-r) + 16px) 6px calc(var(--safe-l) + 12px);
}
.home-title {
  flex: 1; min-width: 0; margin: 0; font-weight: 900; font-size: clamp(26px, 6.2vmin, 64px); line-height: 1;
  text-shadow: 0 3px 0 rgba(255, 255, 255, .9), 0 6px 14px rgba(40, 60, 120, .18);
}
.home-title-word { display: inline-block; white-space: nowrap; }
.home-title-word span { display: inline-block; animation: pp-letter 2.8s ease-in-out infinite; }
@keyframes pp-letter { 0%, 70%, 100% { transform: translateY(0) } 80% { transform: translateY(-8px) rotate(-4deg) } 90% { transform: translateY(0) rotate(2deg) } }
.home-actions { display: flex; align-items: center; gap: 12px; }
.home-sticker-btn {
  position: relative; width: clamp(60px, 10vmin, 86px); height: clamp(60px, 10vmin, 86px); border-radius: 22px;
  background: #fff; box-shadow: 0 5px 0 #C9DDF0, 0 10px 18px rgba(30, 60, 120, .18); display: grid; place-items: center;
}
.home-sticker-btn .pp-emoji { font-size: clamp(32px, 5.6vmin, 50px); }
.sticker-count {
  position: absolute; right: -8px; top: -8px; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 16px;
  background: #FF6FB5; color: #fff; font-weight: 900; font-size: 17px; display: grid; place-items: center; box-shadow: 0 3px 0 #D6408A;
}
.home-gear { position: relative; width: 46px; height: 46px; color: rgba(43, 35, 64, .35); }
.home-gear svg { width: 100%; height: 100%; }
.home-gear .gear-ring { stroke: #FF7A45; transform: rotate(-90deg); transform-origin: 50% 50%; }
.home-gear.holding { color: rgba(43, 35, 64, .7); }
.gear-tip { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); font-size: 10px; font-weight: 800; color: rgba(43, 35, 64, .35); letter-spacing: .05em; }

.home-scroll {
  position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--safe-t) + clamp(90px, 17vmin, 170px));

        }
      } else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  function appendKids(e, kids) {
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      e.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
  }

  const U = (PP.util = {
    rand: (a, b) => a + Math.random() * (b - a),
    randInt: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    sample: (arr, n) => U.shuffle(arr).slice(0, n),
    clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
    lerp: (a, b, t) => a + (b - a) * t,
    sleep: (ms) => new Promise((r) => setTimeout(r, ms)),
    /** el('div', {class:'x', style:{left:'4px'}, onPointerdown: fn}, child, 'text') */
    el(tag, attrs, ...kids) {
      const e = document.createElement(tag);
      applyAttrs(e, attrs);
      appendKids(e, kids);
      return e;
    },
    /** svg('circle', {cx:5, cy:5, r:4, fill:'red'}) — SVG namespace element */
    svg(tag, attrs, ...kids) {
      const e = document.createElementNS(SVGNS, tag);
      applyAttrs(e, attrs);
      appendKids(e, kids);
      return e;
    },
    /** Parse an HTML/SVG string into a single element (first element child). */
    html(str) {
      const t = document.createElement('template');
      t.innerHTML = str.trim();
      return t.content.firstElementChild;
    },
    /** Add a <style> block once per id. Games should namespace their classes (e.g. .g-balloons-*) */
    addStyles(id, css) {
      if (document.getElementById('style-' + id)) return;
      const s = document.createElement('style');
      s.id = 'style-' + id;
      s.textContent = css;
      document.head.appendChild(s);
    },
    /** Add SVG <defs> content (gradients/filters) to the global, always-rendered defs sprite. */
    addDefs(id, defsMarkup) {
      if (document.getElementById('defs-' + id)) return;
      const host = document.getElementById('pp-defs');
      const g = document.createElementNS(SVGNS, 'g');
      g.id = 'defs-' + id;
      g.innerHTML = defsMarkup;
      host.querySelector('defs').appendChild(g);
    },
    /** Lighten (amt>0) or darken (amt<0) a hex color. amt in -1..1 */
    shade(hex, amt) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map((x) => x + x).join('');
      const n = parseInt(c, 16);
      let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
      const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
      r = Math.round((t - r) * p + r);
      g = Math.round((t - g) * p + g);
      b = Math.round((t - b) * p + b);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    },
    rgba(hex, a) {
      let c = hex.replace('#', '');
      if (c.length === 3) c = c.split('').map((x) => x + x).join('');
      const n = parseInt(c, 16);
      return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
    },
    /** Center point of an element in viewport coords */
    center(el) {
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    },
    /**
     * Best grid for n square-ish cards inside w×h. Returns {cols, rows, size}
     * where size is the largest square card edge that fits (gap included).
     */
    layoutGrid(n, w, h, gap = 16) {
      let best = { cols: 1, rows: n, size: 0 };
      for (let cols = 1; cols <= n; cols++) {
        const rows = Math.ceil(n / cols);
        const size = Math.min((w - gap * (cols + 1)) / cols, (h - gap * (rows + 1)) / rows);
        if (size > best.size) best = { cols, rows, size: Math.floor(size) };
      }
      return best;
    },
    /** Capitalize first letter */
    cap: (s) => (s ? s[0].toUpperCase() + s.slice(1) : s),
    isTouch: () => 'ontouchstart' in window || navigator.maxTouchPoints > 0,
    isIOS: () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  });

  /* Tiny event bus: PP.bus.on('speech:start', fn) */
  const listeners = {};
  PP.bus = {
    on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return () => PP.bus.off(evt, fn); },
    off(evt, fn) { const l = listeners[evt]; if (l) { const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); } },
    emit(evt, data) { (listeners[evt] || []).slice().forEach((fn) => { try { fn(data); } catch (e) { console.error(e); } }); },
  };

  /** Register an activity. See GAME_API.md */
  PP.registerGame = function (def) {
    if (!def || !def.id || typeof def.create !== 'function') {
      console.error('registerGame: invalid definition', def);
      return;
    }
    if (PP.games.find((g) => g.id === def.id)) {
      console.warn('registerGame: duplicate id', def.id);
      return;
    }
    PP.games.push(def);
    PP.games.sort((a, b) => (a.order || 100) - (b.order || 100));
    PP.bus.emit('games:changed');
  };
})();

</script>
<script data-src="core/01-audio.js">
/* Pip's Playroom — synthesized audio engine (Web Audio, no files).
 *
 *   PP.audio.unlock()                      call inside a user gesture (core does this for you)
 *   PP.audio.play(inst, note, opts)        melodic instruments: marimba xylo bell piano pluck flute bass toy kalimba
 *   PP.audio.drum(name, opts)              kick tom snare hat shaker tamb clap cowbell woodblock cymbal triangle
 *   PP.audio.sfx(name, opts)               pop tap ding success tada whoosh boing sparkle oops bubble splash
 *                                          slideup slidedown creak applause magic drumroll splat chomp click
 *                                          blastoff swish twinkle
 *   PP.audio.rumble(opts) -> {stop()}      sustained low rumble (rockets, engines)
 *   PP.audio.sequence(events, opts)        -> {stop(), done:Promise}
 *   PP.audio.loop(pattern)                 -> {stop(), setBpm(bpm), bpm}
 *   PP.audio.freq('C#4') / PP.audio.midi('C4')
 *   PP.audio.hush()                        instantly silences everything already scheduled (used on game exit)
 *
 * opts (common): { delay: seconds from now, at: absolute ctx time, vel: 0..1, dur: seconds,
 *                  pan: -1..1, bus: 'music'|'sfx', reverb: 0..1 }
 */
(function () {
  'use strict';
  const PP = window.PP;
  const A = (PP.audio = {});

  let ctx = null;
  let master, comp, reverbIn, musicBus, sfxBus, noiseBuf;
  let volume = 0.8;
  let musicOn = true;
  A.ready = false;

  /* ---------- helpers ---------- */
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  A.midi = function (n) {
    if (typeof n === 'number') return n;
    const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(n).trim());
    if (!m) return 60;
    let v = NOTE_IDX[m[1].toUpperCase()] + (parseInt(m[3], 10) + 1) * 12;
    if (m[2] === '#') v++;
    if (m[2] === 'b') v--;
    return v;
  };
  A.freq = function (n) {
    if (typeof n === 'number' && n > 127) return n; // already Hz
    return 440 * Math.pow(2, (A.midi(n) - 69) / 12);
  };

  function makeNoise(seconds) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeIR(seconds, decay) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return b;
  }

  function buildBuses() {
    musicBus = ctx.createGain();
    musicBus.gain.value = musicOn ? 1 : 0;
    sfxBus = ctx.createGain();
    sfxBus.gain.value = 1;
    musicBus.connect(master);
    sfxBus.connect(master);
  }

  function create() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      ctx = new AC({ latencyHint: 'interactive' });
    } catch (e) {
      try { ctx = new AC(); } catch (e2) { return false; }
    }
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 12;
    comp.ratio.value = 5;
    comp.attack.value = 0.003;
    comp.release.value = 0.25;
    master = ctx.createGain();
    master.gain.value = volume;
    master.connect(comp);
    comp.connect(ctx.destination);

    const conv = ctx.createConvolver();
    conv.buffer = makeIR(1.6, 2.8);
    const wet = ctx.createGain();
    wet.gain.value = 0.28;
    conv.connect(wet);
    wet.connect(master);
    reverbIn = conv;

    noiseBuf = makeNoise(2);
    buildBuses();
    A.ctx = ctx;
    return true;
  }

  A.unlock = function () {
    try {
      if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
    } catch (e) { /* not supported */ }
    if (!ctx && !create()) return;
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    if (!A._primed) {
      // iOS: play a silent buffer inside the gesture to fully unlock output
      const b = ctx.createBuffer(1, 1, 22050);
      const s = ctx.createBufferSource();
      s.buffer = b;
      s.connect(ctx.destination);
      s.start(0);
      A._primed = true;
    }
    A.ready = true;
  };
  A.isRunning = () => !!ctx && ctx.state === 'running';
  A.now = () => (ctx ? ctx.currentTime : 0);

  A.setVolume = function (v) {
    volume = Math.max(0, Math.min(1, v));
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
  };
  A.setMusic = function (on) {
    musicOn = !!on;
    if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? 1 : 0, ctx.currentTime, 0.02);
  };

  /** Silence everything already scheduled (swap buses). */
  A.hush = function () {
    if (!ctx) return;
    const oldM = musicBus, oldS = sfxBus, t = ctx.currentTime;
    try {
      oldM.gain.cancelScheduledValues(t);
      oldS.gain.cancelScheduledValues(t);
      oldM.gain.setTargetAtTime(0, t, 0.015);
      oldS.gain.setTargetAtTime(0, t, 0.015);
    } catch (e) {}
    setTimeout(() => { try { oldM.disconnect(); oldS.disconnect(); } catch (e) {} }, 200);
    buildBuses();
    activeLoops.slice().forEach((l) => l.stop());
  };

  function T(opts) {
    if (opts && opts.at != null) return Math.max(opts.at, ctx.currentTime);
    return ctx.currentTime + ((opts && opts.delay) || 0) + 0.005;
  }
  /** output node for a voice: pan -> bus (+ reverb send) */
  function out(opts, defaultBus, defaultReverb) {
    const g = ctx.createGain();
    let node = g;
    if (opts && opts.pan && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, opts.pan));
      g.connect(p);
      node = p;
    }
    const bus = (opts && opts.bus) === 'music' || (!(opts && opts.bus) && defaultBus === 'music') ? musicBus : sfxBus;
    node.connect(bus);
    const rv = opts && opts.reverb != null ? opts.reverb : defaultReverb;
    if (rv > 0) {
      const s = ctx.createGain();
      s.gain.value = rv;
      node.connect(s);
      s.connect(reverbIn);
    }
    return g;
  }
  function osc(type, f, t, stopAt, dest, detune) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (detune) o.detune.value = detune;
    o.connect(dest);
    o.start(t);
    o.stop(stopAt);
    return o;
  }
  function envGain(dest, t, peak, attack, decay, sustainLevel, sustainEnd, release) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + attack);
    if (sustainLevel != null) {
      g.gain.setTargetAtTime(peak * sustainLevel, t + attack, decay / 3);
      g.gain.setValueAtTime(peak * sustainLevel, sustainEnd);
      g.gain.exponentialRampToValueAtTime(0.0001, sustainEnd + release);
    } else {
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }
    g.connect(dest);
    return g;
  }
  function noise(t, dur, dest) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    s.connect(dest);
    const off = Math.random() * 1.5;
    s.start(t, off);
    s.stop(t + dur);
    return s;
  }
  function filter(type, f, q, dest) {
    const b = ctx.createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    if (q != null) b.Q.value = q;
    b.connect(dest);
    return b;
  }

  /* ---------- melodic instruments ---------- */
  const INST = {
    marimba(f, t, o, v) {
      const dec = Math.max(0.35, 1.3 - (f - 200) / 900);
      osc('sine', f, t, t + dec + 0.1, envGain(o, t, 0.9 * v, 0.003, dec));
      osc('sine', f * 4, t, t + 0.25, envGain(o, t, 0.12 * v, 0.002, 0.12));
      osc('sine', f * 10, t, t + 0.06, envGain(o, t, 0.04 * v, 0.001, 0.03));
    },
    xylo(f, t, o, v) {
      osc('sine', f, t, t + 0.8, envGain(o, t, 0.8 * v, 0.002, 0.65));
      osc('sine', f * 3, t, t + 0.4, envGain(o, t, 0.22 * v, 0.002, 0.3));
      osc('sine', f * 6.2, t, t + 0.15, envGain(o, t, 0.08 * v, 0.001, 0.1));
      const n = filter('bandpass', Math.min(8000, f * 4), 2, envGain(o, t, 0.15 * v, 0.001, 0.02));
      noise(t, 0.04, n);
    },
    bell(f, t, o, v) {
      [[1, 0.6, 1.8], [2.76, 0.25, 1.0], [5.4, 0.12, 0.5], [8.93, 0.06, 0.25]].forEach(([m, a, d]) => {
        if (f * m < 16000) osc('sine', f * m, t, t + d + 0.1, envGain(o, t, a * v, 0.002, d));
      });
    },
    piano(f, t, o, v, dur) {
      const d = Math.max(0.6, Math.min(2.2, dur + 0.8));
      const lp = filter('lowpass', Math.min(9000, f * 8), 0.7, o);
      lp.frequency.setValueAtTime(Math.min(12000, f * 10), t);
      lp.frequency.exponentialRampToValueAtTime(Math.max(400, f * 2), t + d);
      const g = envGain(lp, t, 0.5 * v, 0.004, d);
      osc('triangle', f, t, t + d + 0.1, g, -4);
      osc('triangle', f, t, t + d + 0.1, g, 4);
      osc('sine', f * 2, t, t + d * 0.5, envGain(lp, t, 0.12 * v, 0.003, d * 0.4));
    },
    pluck(f, t, o, v) {
      const lp = filter('lowpass', f * 6, 1, o);
      lp.frequency.setValueAtTime(f * 8, t);
      lp.frequency.exponentialRampToValueAtTime(f * 1.2, t + 0.5);
      osc('sawtooth', f, t, t + 0.7, envGain(lp, t, 0.35 * v, 0.002, 0.6));
      osc('sine', f, t, t + 0.7, envGain(o, t, 0.35 * v, 0.002, 0.6));
    },
    kalimba(f, t, o, v) {
      osc('sine', f, t, t + 1.3, envGain(o, t, 0.75 * v, 0.002, 1.2));
      osc('sine', f * 5.4, t, t + 0.2, envGain(o, t, 0.1 * v, 0.001, 0.12));
      osc('triangle', f * 2, t, t + 0.3, envGain(o, t, 0.08 * v, 0.002, 0.2));
    },
    flute(f, t, o, v, dur) {
      const g = envGain(o, t, 0.4 * v, 0.06, 0.2, 0.85, t + Math.max(0.1, dur), 0.12);
      const o1 = osc('sine', f, t, t + dur + 0.3, g);
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      lfo.frequency.value = 5.2;
      lg.gain.value = f * 0.006;
      lfo.connect(lg);
      lg.connect(o1.frequency);
      lfo.start(t + 0.1);
      lfo.stop(t + dur + 0.3);
      osc('sine', f * 2, t, t + dur + 0.3, envGain(o, t, 0.05 * v, 0.06, 0.2, 0.8, t + Math.max(0.1, dur), 0.1));
      const bp = filter('bandpass', f * 2, 1.5, envGain(o, t, 0.04 * v, 0.03, 0.15));
      noise(t, 0.2, bp);
    },
    bass(f, t, o, v, dur) {
      const lp = filter('lowpass', 600, 1, o);
      osc('triangle', f, t, t + dur + 0.3, envGain(lp, t, 0.8 * v, 0.005, 0.2, 0.6, t + Math.max(0.05, dur * 0.9), 0.12));
      osc('sine', f, t, t + dur + 0.3, envGain(o, t, 0.4 * v, 0.005, 0.2, 0.6, t + Math.max(0.05, dur * 0.9), 0.12));
    },
    toy(f, t, o, v) {
      const lp = filter('lowpass', Math.min(6000, f * 5), 0.8, o);
      osc('square', f, t, t + 0.5, envGain(lp, t, 0.16 * v, 0.003, 0.4));
      osc('sine', f * 2, t, t + 0.6, envGain(o, t, 0.3 * v, 0.002, 0.5));
    },
  };
  const INST_REVERB = { marimba: 0.25, xylo: 0.25, bell: 0.45, piano: 0.3, pluck: 0.2, kalimba: 0.35, flute: 0.35, bass: 0.05, toy: 0.2 };

  /** Play a melodic note. note: 'C4' | midi number | Hz (>127). Returns start time. */
  A.play = function (inst, note, opts) {
    if (!ctx) return 0;
    opts = opts || {};
    const fn = INST[inst] || INST.marimba;
    const t = T(opts);
    const v = opts.vel == null ? 0.8 : opts.vel;
    const o = out(opts, 'sfx', INST_REVERB[inst] != null ? INST_REVERB[inst] : 0.25);
    const notes = Array.isArray(note) ? note : [note];
    notes.forEach((n) => fn(A.freq(n), t, o, v / Math.sqrt(notes.length), opts.dur || 0.4));
    setTimeout(() => { try { o.disconnect(); } catch (e) {} }, ((t - ctx.currentTime) + (opts.dur || 0.4) + 3) * 1000);
    return t;
  };
  A.instruments = Object.keys(INST);

  /* ---------- percussion ---------- */
  const DRUM = {
    kick(t, o, v) {
      const g = envGain(o, t, 1.1 * v, 0.002, 0.4);
      const k = osc('sine', 150, t, t + 0.45, g);
      k.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      noise(t, 0.02, filter('lowpass', 2000, 1, envGain(o, t, 0.25 * v, 0.001, 0.02)));
    },
    tom(t, o, v, pitch) {
      const f = pitch || 180;
      const g = envGain(o, t, 0.9 * v, 0.002, 0.45);
      const k = osc('sine', f, t, t + 0.5, g);
      k.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.35);
      osc('triangle', f * 1.5, t, t + 0.1, envGain(o, t, 0.15 * v, 0.001, 0.06));
    },
    snare(t, o, v) {
      const hp = filter('highpass', 1200, 0.7, envGain(o, t, 0.7 * v, 0.001, 0.2));
      noise(t, 0.25, hp);
      const b = osc('triangle', 220, t, t + 0.12, envGain(o, t, 0.5 * v, 0.001, 0.08));
      b.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    },
    hat(t, o, v) {
      noise(t, 0.08, filter('highpass', 7500, 0.8, envGain(o, t, 0.35 * v, 0.001, 0.05)));
    },
    openhat(t, o, v) {
      noise(t, 0.4, filter('highpass', 7000, 0.8, envGain(o, t, 0.3 * v, 0.002, 0.3)));
    },
    shaker(t, o, v) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.45 * v, t + 0.035);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      g.connect(o);
      noise(t, 0.15, filter('bandpass', 6000, 1.2, g));
    },
    tamb(t, o, v) {
      noise(t, 0.3, filter('highpass', 5500, 1, envGain(o, t, 0.4 * v, 0.001, 0.22)));
      [5200, 6700, 7900, 9100].forEach((f, i) => {
        osc('sine', f + Math.random() * 300, t + i * 0.004, t + 0.25, envGain(o, t + i * 0.004, 0.05 * v, 0.001, 0.18));
      });
    },
    clap(t, o, v) {
      const bp = filter('bandpass', 1400, 1.2, o);
      [0, 0.011, 0.022].forEach((d) => {
        noise(t + d, 0.02, envGain(bp, t + d, 0.8 * v, 0.001, 0.015));
      });
      noise(t + 0.03, 0.2, envGain(bp, t + 0.03, 0.6 * v, 0.002, 0.15));
    },
    cowbell(t, o, v) {
      const bp = filter('bandpass', 800, 3, envGain(o, t, 0.55 * v, 0.001, 0.35));
      osc('square', 540, t, t + 0.4, bp);
      osc('square', 800, t, t + 0.4, bp);
    },
    woodblock(t, o, v) {
      osc('sine', 820, t, t + 0.1, envGain(o, t, 0.8 * v, 0.001, 0.07));
      osc('sine', 1260, t, t + 0.06, envGain(o, t, 0.3 * v, 0.001, 0.04));
    },
    cymbal(t, o, v) {
      const hp = filter('highpass', 5000, 0.5, envGain(o, t, 0.4 * v, 0.003, 1.3));
      noise(t, 1.4, hp);
      const bp = filter('bandpass', 9000, 0.6, envGain(o, t, 0.12 * v, 0.003, 1.1));
      [263, 400, 421, 474, 587, 845].forEach((f) => osc('square', f * 2, t, t + 1.2, bp));
    },
    triangle(t, o, v) {
      [[2600, 0.25, 1.8], [7100, 0.08, 1.2], [4300, 0.06, 1.4]].forEach(([f, a, d]) =>
        osc('sine', f, t, t + d + 0.1, envGain(o, t, a * v, 0.001, d)));
    },
    bongo(t, o, v, pitch) {
      const f = pitch || 380;
      const g = envGain(o, t, 0.8 * v, 0.001, 0.18);
      const k = osc('sine', f, t, t + 0.2, g);
      k.frequency.exponentialRampToValueAtTime(f * 0.8, t + 0.12);
    },
  };
  A.drums = Object.keys(DRUM);
  A.drum = function (name, opts) {
    if (!ctx) return 0;
    opts = opts || {};
    const fn = DRUM[name] || DRUM.kick;
    const t = T(opts);
    const o = out(opts, 'sfx', 0.12);
    fn(t, o, opts.vel == null ? 0.85 : opts.vel, opts.pitch);
    setTimeout(() => { try { o.disconnect(); } catch (e) {} }, ((t - ctx.currentTime) + 2.5) * 1000);
    return t;
  };

  /* ---------- sound effects ---------- */
  const PENTA = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7', 'D7', 'E7'];
  const SFX = {
    pop(t, o, v) {
      noise(t, 0.09, filter('bandpass', 1300, 0.8, envGain(o, t, 1.0 * v, 0.001, 0.08)));
      const s = osc('sine', 260, t, t + 0.12, envGain(o, t, 0.6 * v, 0.001, 0.1));
      s.frequency.exponentialRampToValueAtTime(90, t + 0.1);
      const hi = osc('sine', 900, t, t + 0.06, envGain(o, t, 0.25 * v, 0.001, 0.05));
      hi.frequency.exponentialRampToValueAtTime(1800, t + 0.05);
    },
    tap(t, o, v) {
      const s = osc('sine', 700, t, t + 0.08, envGain(o, t, 0.35 * v, 0.001, 0.06));
      s.frequency.exponentialRampToValueAtTime(1000, t + 0.05);
    },
    click(t, o, v) {
      noise(t, 0.02, filter('highpass', 3000, 1, envGain(o, t, 0.4 * v, 0.001, 0.015)));
    },
    ding(t, o, v) { INST.bell(A.freq('E6'), t, o, 0.7 * v); },
    twinkle(t, o, v) {
      ['C6', 'E6', 'G6', 'C7'].forEach((n, i) => INST.bell(A.freq(n), t + i * 0.07, o, 0.35 * v));
    },
    success(t, o, v) {
      ['C5', 'E5', 'G5', 'C6'].forEach((n, i) => INST.xylo(A.freq(n), t + i * 0.085, o, 0.6 * v));
      INST.bell(A.freq('E6'), t + 0.34, o, 0.3 * v);
    },
    tada(t, o, v) {
      ['G4', 'C5', 'E5'].forEach((n, i) => INST.piano(A.freq(n), t + i * 0.06, o, 0.45 * v, 0.2));
      ['C5', 'E5', 'G5', 'C6'].forEach((n) => INST.piano(A.freq(n), t + 0.28, o, 0.35 * v, 1.0));
      for (let i = 0; i < 6; i++) INST.bell(A.freq(PENTA[i + 1]), t + 0.3 + i * 0.06, o, 0.18 * v);
      DRUM.cymbal(t + 0.28, o, 0.4 * v);
    },
    whoosh(t, o, v) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5 * v, t + 0.15);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
      g.connect(o);
      const bp = filter('bandpass', 400, 1.5, g);
      bp.frequency.setValueAtTime(300, t);
      bp.frequency.exponentialRampToValueAtTime(3500, t + 0.4);
      noise(t, 0.5, bp);
    },
    swish(t, o, v) {
      const g = envGain(o, t, 0.3 * v, 0.03, 0.15);
      const bp = filter('bandpass', 3000, 2, g);
      bp.frequency.setValueAtTime(5000, t);
      bp.frequency.exponentialRampToValueAtTime(1500, t + 0.15);
      noise(t, 0.2, bp);
    },
    boing(t, o, v) {
      const g = envGain(o, t, 0.5 * v, 0.003, 0.6);
      const s = osc('sine', 180, t, t + 0.65, g);
      const lfo = ctx.createOscillator();
      const lg = ctx.createGain();
      lfo.frequency.setValueAtTime(14, t);
      lg.gain.setValueAtTime(90, t);
      lg.gain.exponentialRampToValueAtTime(5, t + 0.6);
      lfo.connect(lg);
      lg.connect(s.frequency);
      lfo.start(t);
      lfo.stop(t + 0.65);
      s.frequency.linearRampToValueAtTime(320, t + 0.6);
    },
    sparkle(t, o, v) {
      const notes = PP.util.shuffle(PENTA).slice(0, 6);
      notes.forEach((n, i) => INST.bell(A.freq(n), t + i * 0.055, o, 0.22 * v));
    },
    magic(t, o, v) {
      ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6', 'C7'].forEach((n, i) => INST.bell(A.freq(n), t + i * 0.04, o, 0.2 * v));
    },
    oops(t, o, v) {
      // friendly "bwoop" — never harsh
      const g = envGain(o, t, 0.35 * v, 0.01, 0.3);
      const s = osc('triangle', 330, t, t + 0.35, g);
      s.frequency.setValueAtTime(330, t);
      s.frequency.exponentialRampToValueAtTime(220, t + 0.25);
    },
    bubble(t, o, v) {
      const s = osc('sine', 300, t, t + 0.12, envGain(o, t, 0.5 * v, 0.002, 0.1));
      s.frequency.exponentialRampToValueAtTime(1300, t + 0.08);
    },
    splash(t, o, v) {
      const lp = filter('lowpass', 3000, 0.7, envGain(o, t, 0.6 * v, 0.005, 0.5));
      lp.frequency.setValueAtTime(4000, t);
      lp.frequency.exponentialRampToValueAtTime(500, t + 0.5);
      noise(t, 0.6, lp);
      for (let i = 0; i < 4; i++) SFX.bubble(t + 0.08 + i * 0.07 + Math.random() * 0.03, o, 0.25 * v);
    },
    splat(t, o, v) {
      noise(t, 0.15, filter('lowpass', 900, 1, envGain(o, t, 0.8 * v, 0.002, 0.13)));
      const s = osc('sine', 160, t, t + 0.15, envGain(o, t, 0.5 * v, 0.002, 0.12));
      s.frequency.exponentialRampToValueAtTime(70, t + 0.12);
    },
    slideup(t, o, v) {
      const s = osc('sine', 350, t, t + 0.5, envGain(o, t, 0.4 * v, 0.02, 0.45));
      s.frequency.exponentialRampToValueAtTime(1400, t + 0.45);
    },
    slidedown(t, o, v) {
      const s = osc('sine', 1300, t, t + 0.5, envGain(o, t, 0.4 * v, 0.02, 0.45));
      s.frequency.exponentialRampToValueAtTime(300, t + 0.45);
    },
    creak(t, o, v) {
      const bp = filter('bandpass', 900, 4, envGain(o, t, 0.35 * v, 0.03, 0.4));
      const s = osc('sawtooth', 90, t, t + 0.45, bp);
      for (let i = 0; i < 8; i++) s.frequency.setValueAtTime(80 + Math.random() * 60, t + i * 0.05);
    },
    applause(t, o, v) {
      for (let i = 0; i < 26; i++) {
        const d = Math.random() * 1.4;
        const bp = filter('bandpass', 900 + Math.random() * 1500, 1.5, o);
        noise(t + d, 0.03, envGain(bp, t + d, (0.15 + Math.random() * 0.2) * v * (1 - d / 2), 0.001, 0.025));
      }
    },
    drumroll(t, o, v) {
      for (let i = 0; i < 16; i++) DRUM.snare(t + i * 0.045, o, 0.25 * v * (0.5 + i / 32));
      DRUM.cymbal(t + 0.75, o, 0.6 * v);
      DRUM.kick(t + 0.75, o, 0.6 * v);
    },
    chomp(t, o, v) {
      [0, 0.16].forEach((d) => {
        noise(t + d, 0.06, filter('lowpass', 1200, 1, envGain(o, t + d, 0.6 * v, 0.002, 0.05)));
        osc('sine', 120, t + d, t + d + 0.08, envGain(o, t + d, 0.4 * v, 0.002, 0.06));
      });
    },
    blastoff(t, o, v) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.8 * v, t + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
      g.connect(o);
      const lp = filter('lowpass', 300, 1, g);
      lp.frequency.setValueAtTime(200, t);
      lp.frequency.exponentialRampToValueAtTime(2500, t + 1.5);
      noise(t, 2.5, lp);
      SFX.slideup(t + 0.2, o, 0.3 * v);
    },
  };
  A.sfxNames = Object.keys(SFX);
  A.sfx = function (name, opts) {
    if (!ctx) return 0;
    opts = opts || {};
    const fn = SFX[name];
    if (!fn) { console.warn('unknown sfx', name); return 0; }
    const t = T(opts);
    const o = out(opts, 'sfx', name === 'tada' || name === 'success' || name === 'ding' ? 0.3 : 0.1);
    fn(t, o, opts.vel == null ? 0.8 : opts.vel);
    setTimeout(() => { try { o.disconnect(); } catch (e) {} }, ((t - ctx.currentTime) + 3.5) * 1000);
    return t;
  };

  /** Sustained low rumble; returns {stop(fadeSeconds)} */
  A.rumble = function (opts) {
    if (!ctx) return { stop() {}, setLevel() {} };
    opts = opts || {};
    const t = T(opts);
    const o = out(opts, 'sfx', 0.05);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime((opts.vel || 0.5), t + (opts.attack || 0.4));
    g.connect(o);
    const lp = filter('lowpass', opts.cutoff || 180, 1, g);
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.loop = true;
    s.connect(lp);
    s.start(t);
    const sub = osc('sine', 45, t, t + 600, g);
    return {
      setLevel(v) { g.gain.setTargetAtTime(v, ctx.currentTime, 0.1); },
      setCutoff(f) { lp.frequency.setTargetAtTime(f, ctx.currentTime, 0.1); },
      stop(fade) {
        const now = ctx.currentTime, f = fade == null ? 0.4 : fade;
        g.gain.cancelScheduledValues(now);
        g.gain.setTargetAtTime(0.0001, now, f / 3);
        try { s.stop(now + f + 0.1); sub.stop(now + f + 0.1); } catch (e) {}
        setTimeout(() => { try { o.disconnect(); } catch (e) {} }, (f + 0.5) * 1000);
      },
    };
  };

  /* ---------- sequencing ---------- */
  /**
   * Play a list of events.
   *   events: [{n:'C4'|['C4','E4']|null, d: beats, inst?, vel?, drum?:'kick'}] or shorthand ['C4', 1]
   *   opts: { bpm=100, inst='marimba', vel, onNote(i, ev, when), bus, delay }
   * Returns { stop(), done: Promise, duration (seconds) }
   * onNote is called (via setTimeout) roughly when each note sounds — use it for visuals.
   */
  A.sequence = function (events, opts) {
    opts = opts || {};
    if (!ctx) return { stop() {}, done: Promise.resolve(), duration: 0 };
    const bpm = opts.bpm || 100, beat = 60 / bpm;
    let t = T(opts) + 0.05;
    const start = t;
    const timers = [];
    let stopped = false;
    const evs = events.map((e) => (Array.isArray(e) ? { n: e[0], d: e[1] } : e));
    evs.forEach((ev, i) => {
      const d = (ev.d == null ? 1 : ev.d) * beat;
      if (ev.n != null || ev.drum) {
        if (ev.drum) A.drum(ev.drum, { at: t, vel: ev.vel || opts.vel, bus: opts.bus || 'music' });
        if (ev.n != null) A.play(ev.inst || opts.inst || 'marimba', ev.n, { at: t, dur: d * 0.9, vel: ev.vel || opts.vel, bus: opts.bus || 'music' });
      }
      if (opts.onNote) {
        const when = t;
        timers.push(setTimeout(() => { if (!stopped) opts.onNote(i, ev, when); }, Math.max(0, (t - ctx.currentTime) * 1000)));
      }
      t += d;
    });
    const duration = t - start;
    let resolveDone;
    const done = new Promise((r) => (resolveDone = r));
    timers.push(setTimeout(() => resolveDone(true), Math.max(0, (t - ctx.currentTime) * 1000)));
    return {
      duration,
      done,
      stop() {
        if (stopped) return;
        stopped = true;
        timers.forEach(clearTimeout);
        resolveDone(false);
      },
    };
  };

  /**
   * Step-sequencer loop with a look-ahead scheduler (rock-steady timing).
   *   pattern: { bpm: 100, steps: 16, stepsPerBeat: 4,
   *              tracks: { kick: [1,0,0,0, ...], hat: 'x.x.x.x.x.x.x.x.' },   // drum names
   *              notes:  { bass: { inst:'bass', seq:['C2',null,...] } },     // optional melodic tracks
   *              vel: 0.6,
   *              onStep(stepIndex, when) }  // visuals; called via setTimeout near the audible time
   * Returns { stop(), setBpm(bpm), get bpm, get step, beatTime(): ctx time of the most recent beat }
   */
  const activeLoops = [];
  A.loop = function (pattern) {
    if (!ctx) return { stop() {}, setBpm() {}, bpm: pattern.bpm, beatTime: () => 0, nextBeatTime: () => 0 };
    let bpm = pattern.bpm || 100;
    const steps = pattern.steps || 16;
    const spb = pattern.stepsPerBeat || 4;
    let step = 0;
    let next = ctx.currentTime + 0.1;
    let stopped = false;
    let lastBeat = next;
    const timers = new Set();
    const tracks = {};
    for (const k in pattern.tracks || {}) {
      const tr = pattern.tracks[k];
      tracks[k] = typeof tr === 'string' ? tr.split('').map((c) => (c === 'x' ? 1 : c === 'o' ? 0.5 : 0)) : tr;
    }
    function schedule() {
      if (stopped) return;
      while (next < ctx.currentTime + 0.12) {
        const s = step % steps;
        for (const k in tracks) {
          const hit = tracks[k][s % tracks[k].length];
          if (hit) A.drum(k, { at: next, vel: (pattern.vel || 0.6) * hit, bus: 'music' });
        }
        for (const k in pattern.notes || {}) {
          const nt = pattern.notes[k];
          const n = nt.seq[s % nt.seq.length];
          if (n) A.play(nt.inst || 'bass', n, { at: next, dur: (60 / bpm / spb) * (nt.len || 1.8), vel: nt.vel || 0.5, bus: 'music' });
        }
        if (s % spb === 0) lastBeat = next;
        if (pattern.onStep) {
          const when = next, idx = s;
          const id = setTimeout(() => { timers.delete(id); if (!stopped) pattern.onStep(idx, when); }, Math.max(0, (next - ctx.currentTime) * 1000));
          timers.add(id);
        }
        next += 60 / bpm / spb;
        step++;
      }
    }
    const iv = setInterval(schedule, 25);
    schedule();
    const handle = {
      stop() {
        if (stopped) return;
        stopped = true;
        clearInterval(iv);
        timers.forEach(clearTimeout);
        const i = activeLoops.indexOf(handle);
        if (i >= 0) activeLoops.splice(i, 1);
      },
      setBpm(b) { bpm = Math.max(30, Math.min(240, b)); },
      get bpm() { return bpm; },
      get step() { return step; },
      beatTime: () => lastBeat,
      beatDur: () => 60 / bpm,
    };
    activeLoops.push(handle);
    return handle;
  };

  // Keep the context alive across iOS interruptions (calls, app switching).
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend && ctx.suspend().catch(() => {});
    else ctx.resume && ctx.resume().catch(() => {});
  });
})();

</script>
<script data-src="core/02-speech.js">
/* Pip's Playroom — text-to-speech (Web Speech API; works in iOS Safari, no recordings needed).
 *
 *   PP.speech.say(text, {mode:'interrupt'|'queue'|'skip', rate, pitch}) -> Promise<boolean>
 *       interrupt (default): stop whatever is being said and say this (rapid calls coalesce)
 *       queue: say after current speech
 *       skip:  only say it if nothing is currently being said
 *   PP.speech.cancel()
 *   PP.speech.speaking() -> boolean
 *   PP.speech.listVoices() -> English voices, best first
 *   PP.speech.setVoice(voiceURI)
 *
 * The promise always resolves (onend can be flaky on iOS, so there is a length-based fallback timer).
 */
(function () {
  'use strict';
  const PP = window.PP;
  const S = (PP.speech = {});
  const synth = window.speechSynthesis;
  S.supported = !!(synth && window.SpeechSynthesisUtterance);

  let voices = [];
  let voice = null;
  let preferredURI = '';
  let rate = 0.92;
  let pitch = 1.12;
  let enabled = true;

  const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|princess|junior|ralph|fred|kathy)\b/i;
  const ELOQUENCE = /\b(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i;
  const FAVORITES = { ava: 24, zoe: 24, samantha: 22, allison: 18, nicky: 16, joelle: 16, susan: 12, evan: 10, nathan: 10, noelle: 14, karen: 12, serena: 12, kate: 10, moira: 10, tessa: 10, daniel: 8, tom: 6, aaron: 6, siri: 26 };

  function score(v) {
    let s = 0;
    const name = (v.name || '').toLowerCase();
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    if (!lang.startsWith('en')) return -999;
    if (NOVELTY.test(name)) return -500;
    if (lang === 'en-us') s += 30;
    else s += 15;
    if (/premium/.test(name)) s += 40;
    if (/enhanced/.test(name)) s += 30;
    if (/natural/.test(name)) s += 35;
    if (/google us english/.test(name)) s += 22;
    if (ELOQUENCE.test(name)) s -= 25;
    for (const k in FAVORITES) if (name.includes(k)) { s += FAVORITES[k]; break; }
    if (v.localService) s += 2;
    if (v.default && lang.startsWith('en')) s += 3;
    return s;
  }

  function loadVoices() {
    if (!S.supported) return;
    voices = synth.getVoices() || [];
    pickVoice();
    PP.bus.emit('speech:voices', voices.length);
  }
  function pickVoice() {
    if (!voices.length) { voice = null; return; }
    if (preferredURI) {
      const v = voices.find((x) => x.voiceURI === preferredURI);
      if (v) { voice = v; return; }
    }
    const sorted = S.listVoices();
    voice = sorted[0] || null;
  }

  S.listVoices = function () {
    return voices.filter((v) => score(v) > -100).sort((a, b) => score(b) - score(a));
  };
  S.currentVoice = () => voice;
  S.setVoice = function (uri) { preferredURI = uri || ''; pickVoice(); };
  S.setRate = (r) => { rate = r; };
  S.setPitch = (p) => { pitch = p; };
  S.setEnabled = (on) => { enabled = !!on; if (!on) S.cancel(); };

  if (S.supported) {
    loadVoices();
    if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices);
    // Safari sometimes never fires voiceschanged — poll briefly.
    let tries = 0;
    const poll = setInterval(() => {
      tries++;
      if (voices.length || tries > 20) { clearInterval(poll); return; }
      loadVoices();
    }, 250);
  }

  /* ---- speaking ---- */
  const live = new Set(); // keep utterances referenced (GC bug in some engines)
  let current = null; // {utt, resolve, timer}
  let pending = null; // coalesced interrupt {text, opts, resolvers[]}
  let pendingTimer = null;
  const queue = [];
  let speakingFlag = false;

  function estimate(text, r) {
    return Math.min(9000, (500 + text.length * 70) / (r || 1));
  }

  function finish(item, ok) {
    if (!item || item.done) return;
    item.done = true;
    clearTimeout(item.timer);
    live.delete(item.utt);
    if (current === item) {
      current = null;
      speakingFlag = false;
      PP.bus.emit('speech:end');
    }
    item.resolvers.forEach((r) => r(ok));
    // next in queue
    if (!current && !pending && queue.length) {
      const q = queue.shift();
      speakNow(q.text, q.opts, q.resolvers);
    }
  }

  function speakNow(text, opts, resolvers) {
    const r = opts.rate || rate;
    const item = { resolvers, done: false, utt: null, timer: null };
    current = item;
    speakingFlag = true;
    PP.bus.emit('speech:start', { text });
    PP.bus.emit('speech:text', text);
    if (!S.supported || !enabled) {
      item.timer = setTimeout(() => finish(item, false), estimate(text, r) * 0.6);
      return;
    }
    try {
      if (synth.paused) synth.resume();
      const u = new SpeechSynthesisUtterance(text);
      item.utt = u;
      live.add(u);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'en-US'; }
      u.rate = r;
      u.pitch = opts.pitch || pitch;
      u.volume = 1;
      u.onend = () => finish(item, true);
      u.onerror = () => finish(item, false);
      // fallback in case onend never fires (iOS quirk)
      item.timer = setTimeout(() => finish(item, false), estimate(text, r) * 1.8 + 1500);
      synth.speak(u);
    } catch (e) {
      item.timer = setTimeout(() => finish(item, false), estimate(text, r) * 0.6);
    }
  }

  function hardCancel() {
    queue.length = 0;
    if (current) {
      const c = current;
      current = null;
      speakingFlag = false;
      c.done = true;
      clearTimeout(c.timer);
      live.delete(c.utt);
      c.resolvers.forEach((r) => r(false));
      PP.bus.emit('speech:end');
    }
    if (S.supported) { try { synth.cancel(); } catch (e) {} }
  }

  S.speaking = () => speakingFlag || !!pending;

  S.say = function (text, opts) {
    opts = opts || {};
    text = String(text || '').trim();
    if (!text) return Promise.resolve(false);
    const mode = opts.mode || (opts.interrupt === false ? 'queue' : 'interrupt');
    if (mode === 'skip' && S.speaking()) return Promise.resolve(false);
    return new Promise((resolve) => {
      if (mode === 'queue' && (current || pending)) {
        queue.push({ text, opts, resolvers: [resolve] });
        return;
      }
      if (mode === 'queue' || (!current && !pending)) {
        if (!current) { speakNow(text, opts, [resolve]); return; }
      }
      // interrupt: coalesce rapid calls — only the latest text is spoken
      const wasSpeaking = !!current;
      hardCancel();
      if (pending) {
        pending.resolvers.forEach((r) => r(false));
        clearTimeout(pendingTimer);
      }
      pending = { text, opts, resolvers: [resolve] };
      // Safari drops a speak() issued in the same tick as cancel(); give it a moment.
      pendingTimer = setTimeout(() => {
        const p = pending;
        pending = null;
        if (p) speakNow(p.text, p.opts, p.resolvers);
      }, wasSpeaking ? 90 : 0);
    });
  };

  S.cancel = function () {
    if (pending) { pending.resolvers.forEach((r) => r(false)); pending = null; clearTimeout(pendingTimer); }
    hardCancel();
  };

  /** Must be called from inside a user gesture once (iOS requirement). */
  S.unlock = function (text) {
    if (!S.supported) return;
    loadVoices();
    if (text) { S.say(text, { mode: 'interrupt' }); return; }
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      synth.speak(u);
    } catch (e) {}
  };

  // iOS can wedge the synth after backgrounding; reset on return.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) S.cancel();
  });
})();

</script>

<script data-src="core/04-store.js">
/* Pip's Playroom — settings, adaptive levels, stickers. Persisted in localStorage (best-effort). */
(function () {
  'use strict';
  const PP = window.PP;
  const KEY = 'pips-playroom.v1';

  const DEFAULT_SETTINGS = {
    childName: '',
    voiceURI: '',
    rate: 0.92,
    pitch: 1.12,
    volume: 0.85,
    music: true,
    speech: true,
    challenge: 'auto', // 'auto' | 'gentle' | 'big'
    lockHome: false, // legacy: true = press-and-hold
    homeMode: 'double', // 'double' (tap twice) | 'tap' | 'hold'
    playLimit: 0, // minutes of play before Pip says goodnight (0 = off)
    hidden: [], // game ids hidden from the home screen
    stickerEvery: 5, // successes per sticker
  };

  const store = (PP.store = {
    settings: Object.assign({}, DEFAULT_SETTINGS),
    progress: {}, // gameId -> {level, streak, rounds, correct, misses, plays}
    stickers: [], // sticker ids in the order earned
    successTotal: 0,
    sinceSticker: 0,
  });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      Object.assign(store.settings, d.settings || {});
      store.progress = d.progress || {};
      store.stickers = Array.isArray(d.stickers) ? d.stickers : [];
      store.successTotal = d.successTotal || 0;
      store.sinceSticker = d.sinceSticker || 0;
    } catch (e) { /* private mode etc. */ }
  }
  let saveTimer = null;
  store.save = function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          settings: store.settings, progress: store.progress, stickers: store.stickers,
          successTotal: store.successTotal, sinceSticker: store.sinceSticker,
        }));
      } catch (e) {}
    }, 150);
  };
  store.set = function (k, v) {
    store.settings[k] = v;
    store.save();
    PP.bus.emit('settings:changed', { key: k, value: v });
  };
  store.resetProgress = function () {
    store.progress = {};
    store.stickers = [];
    store.successTotal = 0;
    store.sinceSticker = 0;
    store.save();
  };

  store.game = function (id) {
    if (!store.progress[id]) store.progress[id] = { level: 1, streak: 0, rounds: 0, correct: 0, misses: 0, plays: 0, missRun: 0 };
    return store.progress[id];
  };
  function levelCap() {
    const c = store.settings.challenge;
    return c === 'gentle' ? 2 : 5;
  }
  function levelFloor() {
    return store.settings.challenge === 'big' ? 3 : 1;
  }
  store.level = function (id) {
    const g = store.game(id);
    return Math.max(levelFloor(), Math.min(levelCap(), g.level));
  };
  /** Record a success. firstTry=true counts toward leveling up; false = needed help; null = neutral (free play). Returns {leveledUp, sticker} */
  store.recordSuccess = function (id, firstTry) {
    const g = store.game(id);
    g.correct++;
    g.rounds++;
    let leveledUp = false;
    if (firstTry === null) {
      // neutral: counts toward stickers, but says nothing about skill (no level change)
    } else if (firstTry !== false) {
      g.streak++;
      g.missRun = 0;
      if (g.streak >= 3 && g.level < 5) { g.level++; g.streak = 0; leveledUp = true; }
    } else {
      g.streak = 0;
    }
    store.successTotal++;
    store.sinceSticker++;
    let sticker = null;
    if (store.sinceSticker >= (store.settings.stickerEvery || 5)) {
      store.sinceSticker = 0;
      sticker = store.awardSticker();
    }
    store.save();
    return { leveledUp, sticker, level: store.level(id) };
  };
  /** Record a struggle (call at most once per round). Two struggling rounds in a row step the level down. */
  store.recordMiss = function (id) {
    const g = store.game(id);
    g.misses++;
    g.streak = 0;
    g.missRun = (g.missRun || 0) + 1;
    let leveledDown = false;
    if (g.missRun >= 2 && g.level > 1) { g.level--; g.missRun = 0; leveledDown = true; }
    store.save();
    return { leveledDown, level: store.level(id) };
  };
  store.awardSticker = function () {
    const all = PP.data.STICKERS;
    const owned = new Set(store.stickers);
    const fresh = all.filter((s) => !owned.has(s.id));
    const s = fresh.length ? PP.util.pick(fresh) : PP.util.pick(all);
    if (!owned.has(s.id)) store.stickers.push(s.id);
    store.save();
    return s;
  };

  load();
})();

</script>
<script data-src="core/05-mascot.js">
/* Pip — the playroom mascot (original character: a round, sunny sprout-creature).
 *   const pip = PP.mascot.create({size:'120px'})
 *   pip.el                      // container element to place anywhere
 *   pip.mood('happy'|'cheer'|'wiggle'|'surprise'|'think'|'wave'|'sleep'|'idle')
 *   pip.lookAt(x, y)            // viewport coords

 */

  'use strict';

  const SVG = `

      <path d="M103 24 C 92 6, 66 10, 68 26 C 80 34, 96 32, 103 24 Z" fill="#5BC56A"/>
      <path d="M103 24 C 114 4, 142 8, 140 24 C 126 34, 110 32, 103 24 Z" fill="#7FDA86"/>
      <path d="M103 24 C 96 18, 84 18, 76 22" stroke="#3E9E50" stroke-width="2" fill="none" opacity=".5"/>
    </g>
    <ellipse cx="100" cy="118" rx="70" ry="68" fill="url(#pp-pip-body)"/>
    <ellipse cx="100" cy="146" rx="42" ry="31" fill="#FFE9B8" opacity=".75"/>
    <ellipse cx="72" cy="78" rx="18" ry="10" fill="#fff" opacity=".35" transform="rotate(-25 72 78)"/>
    <ellipse class="pip-cheek" cx="54" cy="128" rx="12" ry="7.5" fill="#FF6F86" opacity=".5"/>
    <ellipse class="pip-cheek" cx="146" cy="128" rx="12" ry="7.5" fill="#FF6F86" opacity=".5"/>

      <ellipse cx="74" cy="104" rx="16" ry="19" fill="#fff"/>
      <g class="pip-pupil"><circle cx="76" cy="107" r="10" fill="#2B2340"/><circle cx="80" cy="102" r="3.6" fill="#fff"/><circle cx="72.5" cy="111" r="1.6" fill="#fff"/></g>

    <g class="pip-eye pip-eye-r">
      <ellipse cx="126" cy="104" rx="16" ry="19" fill="#fff"/>
      <g class="pip-pupil"><circle cx="128" cy="107" r="10" fill="#2B2340"/><circle cx="132" cy="102" r="3.6" fill="#fff"/><circle cx="124.5" cy="111" r="1.6" fill="#fff"/></g>
    </g>
    <path class="pip-happy-eyes" d="M60 106 Q74 92 88 106 M112 106 Q126 92 140 106" stroke="#2B2340" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path class="pip-sleep-eyes" d="M60 104 Q74 116 88 104 M112 104 Q126 116 140 104" stroke="#2B2340" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path class="pip-mouth pip-mouth-smile" d="M86 134 Q100 149 114 134" stroke="#5A2A1A" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <g class="pip-mouth pip-mouth-open">

    create(opts) {
      opts = opts || {};
      const el = U.el('div', { class: 'pip ' + (opts.cls || ''), style: { width: opts.size || '120px', height: opts.size || '120px' } });
      el.innerHTML = SVG;
      const svg = el.firstElementChild;
      const pupils = svg.querySelectorAll('.pip-pupil');

      let blinkTimer = null;
      let destroyed = false;

      function blinkLoop() {
        if (destroyed) return;

          setTimeout(() => el.classList.remove('blink'), 140);
          blinkLoop();

      const api = {
        el,
        mood(m, ms) {
          clearTimeout(moodTimer);
          el.classList.remove('m-happy', 'm-cheer', 'm-wiggle', 'm-surprise', 'm-think', 'm-wave', 'm-sleep');

        lookAt(x, y) {

        destroy() {
          destroyed = true;
          clearTimeout(moodTimer);
          clearTimeout(blinkTimer);
          live.delete(api);
          el.remove();
        },
      };
      live.add(api);
      if (PP.speech && PP.speech.speaking()) api.talk(true);
      return api;
    },
  };

  // Mouth flaps while speaking
  let flap = null;
  PP.bus.on('speech:start', () => {
    live.forEach((p) => p.talk(true));
    clearInterval(flap);
    let open = false;
    flap = setInterval(() => {
      open = !open;
      live.forEach((p) => p.el.classList.toggle('mouth-open', open));
    }, 130);
  });
  PP.bus.on('speech:end', () => {
    clearInterval(flap);
    live.forEach((p) => { p.talk(false); p.el.classList.remove('mouth-open'); });
  });
  // Eyes follow touches
  document.addEventListener('pointerdown', (e) => live.forEach((p) => p.lookAt(e.clientX, e.clientY)), { passive: true, capture: true });
})();

<script data-src="core/06-fx.js">
/* Pip's Playroom — visual effects (all GPU-friendly transforms).
 *   PP.fx.confetti({x, y, count=80, colors, spread=1, power=1})   canvas confetti (x,y viewport px; default center)
 *   PP.fx.burst(x, y, {emoji:'⭐', count:8, size:40, distance:120})  emoji/star burst
 *   PP.fx.floatText(x, y, text, {color, size})                     big rising word/numeral ("3!", "Red!")
 *   PP.fx.flyTo(el, targetEl|{x,y}, {duration, scale}) -> Promise   clone flies to a point
 *   PP.fx.ripple(x, y, color)                                       touch ripple (automatic on every touch)
 *   PP.fx.glow(el, ms)                                              temporary glow ring (hint)
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;
  const FX = (PP.fx = {});
  const PALETTE = ['#EF3B36', '#FF8C1A', '#FFD21F', '#3DBE4B', '#2F7BEA', '#8E4FD6', '#FF6FB5', '#22C3C3'];

  function layer() {
    let l = document.getElementById('pp-fx');
    if (!l) {
      l = U.el('div', { id: 'pp-fx' });
      document.body.appendChild(l);
    }
    return l;
  }

  /* ---- confetti (single shared canvas, runs only while particles exist) ---- */
  let canvas = null, c2d = null, parts = [], running = false, dpr = 1;
  function ensureCanvas() {
    if (canvas) return;
    canvas = U.el('canvas', { id: 'pp-confetti' });
    document.body.appendChild(canvas);
    c2d = canvas.getContext('2d');
    sizeCanvas();
    window.addEventListener('resize', sizeCanvas);
  }
  function sizeCanvas() {
    if (!canvas) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
  }
  function tick() {
    if (!parts.length) { running = false; c2d.clearRect(0, 0, canvas.width, canvas.height); return; }
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    c2d.clearRect(0, 0, innerWidth, innerHeight);
    const H = innerHeight + 40;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vx *= 0.985;
      p.vy = p.vy * 0.985 + 0.32;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life--;
      if (p.y > H || p.life <= 0) { parts.splice(i, 1); continue; }
      c2d.save();
      c2d.globalAlpha = Math.min(1, p.life / 30);
      c2d.translate(p.x, p.y);
      c2d.rotate(p.rot);
      c2d.fillStyle = p.color;
      if (p.shape === 0) {
        c2d.scale(1, Math.cos(p.rot * 2.3));
        c2d.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      } else if (p.shape === 1) {
        c2d.beginPath();
        c2d.arc(0, 0, p.s / 2.6, 0, Math.PI * 2);
        c2d.fill();
      } else {
        c2d.beginPath();
        for (let k = 0; k < 5; k++) {
          const a = -Math.PI / 2 + (k * 2 * Math.PI) / 5;
          c2d.lineTo(Math.cos(a) * p.s / 1.8, Math.sin(a) * p.s / 1.8);
          const b = a + Math.PI / 5;
          c2d.lineTo(Math.cos(b) * p.s / 4, Math.sin(b) * p.s / 4);

        c2d.closePath();
        c2d.fill();
      }
      c2d.restore();
    }
    requestAnimationFrame(tick);
  }

    o = o || {};
    ensureCanvas();
    const x = o.x == null ? innerWidth / 2 : o.x;
    const y = o.y == null ? innerHeight / 2 : o.y;
    const n = Math.min(220, o.count || 80);
    const colors = o.colors || PALETTE;
    const power = (o.power || 1) * Math.min(1.4, Math.max(0.7, innerHeight / 800));
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3 * (o.spread || 1);
      const sp = (6 + Math.random() * 11) * power;
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
        s: 9 + Math.random() * 9, color: U.pick(colors), shape: Math.random() < 0.55 ? 0 : Math.random() < 0.6 ? 1 : 2, life: 160 + Math.random() * 60,
      });
    }
    if (parts.length > 500) parts.splice(0, parts.length - 500);
    if (!running) { running = true; requestAnimationFrame(tick); }
  };

  /* ---- emoji burst ---- */
  FX.burst = function (x, y, o) {
    o = o || {};
    const n = o.count || 8, size = o.size || 38, dist = o.distance || 120;
    const L = layer();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.5;
      const d = dist * (0.7 + Math.random() * 0.6);
      const e = U.el('div', { class: 'pp-burst', text: Array.isArray(o.emoji) ? U.pick(o.emoji) : o.emoji || '⭐', style: { left: x + 'px', top: y + 'px', fontSize: size + 'px' } });
      L.appendChild(e);
      const anim = e.animate([
        { transform: 'translate(-50%,-50%) scale(.3) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(1) rotate(${(Math.random() - 0.5) * 120}deg)`, opacity: 1, offset: 0.6 },
        { transform: `translate(calc(-50% + ${Math.cos(a) * d * 1.15}px), calc(-50% + ${Math.sin(a) * d * 1.15 + 30}px)) scale(.6)`, opacity: 0 },
      ], { duration: 900 + Math.random() * 300, easing: 'cubic-bezier(.2,.8,.3,1)' });
      anim.onfinish = () => e.remove();
    }
  };

  /* ---- floating text ---- */
  FX.floatText = function (x, y, text, o) {
    o = o || {};
    const e = U.el('div', { class: 'pp-floattext', text, style: { left: x + 'px', top: y + 'px', color: o.color || '#fff', fontSize: (o.size || 72) + 'px' } });
    if (o.stroke) e.style.webkitTextStroke = o.stroke;
    layer().appendChild(e);
    const anim = e.animate([
      { transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 },
      { transform: 'translate(-50%,-70%) scale(1.15)', opacity: 1, offset: 0.25 },
      { transform: 'translate(-50%,-90%) scale(1)', opacity: 1, offset: 0.7 },
      { transform: 'translate(-50%,-130%) scale(.9)', opacity: 0 },
    ], { duration: o.duration || 1300, easing: 'ease-out' });
    anim.onfinish = () => e.remove();
  };

  /* ---- fly a clone of an element to a target ---- */
  FX.flyTo = function (el, target, o) {
    o = o || {};
    const r = el.getBoundingClientRect();
    const t = target instanceof Element ? U.center(target) : target;
    const clone = el.cloneNode(true);
    Object.assign(clone.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 9000, pointerEvents: 'none' });
    layer().appendChild(clone);
    const dx = t.x - (r.left + r.width / 2), dy = t.y - (r.top + r.height / 2);
    const anim = clone.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 80}px) scale(${((o.scale || 0.3) + 1) / 2 * 1.1})`, opacity: 1, offset: 0.5 },
      { transform: `translate(${dx}px, ${dy}px) scale(${o.scale || 0.3})`, opacity: o.fade === false ? 1 : 0.2 },
    ], { duration: o.duration || 700, easing: 'cubic-bezier(.5,0,.5,1)' });
    return new Promise((res) => { anim.onfinish = () => { clone.remove(); res(); }; });
  };

  /* ---- touch ripple ---- */
  FX.ripple = function (x, y, color) {
    const e = U.el('div', { class: 'pp-ripple', style: { left: x + 'px', top: y + 'px', borderColor: color || U.pick(PALETTE) } });
    layer().appendChild(e);
    const anim = e.animate([
      { transform: 'translate(-50%,-50%) scale(.2)', opacity: 0.9 },
      { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 },
    ], { duration: 520, easing: 'ease-out' });
    anim.onfinish = () => e.remove();
  };
  document.addEventListener('pointerdown', (e) => {
    if (e.target && e.target.closest && e.target.closest('.pp-noripple, input, select, textarea')) return;
    FX.ripple(e.clientX, e.clientY);
  }, { passive: true, capture: true });

  /* ---- glow hint ---- */
  FX.glow = function (el, ms) {
    el.classList.add('pp-glow');
    if (ms) setTimeout(() => el.classList.remove('pp-glow'), ms);
    return () => el.classList.remove('pp-glow');
  };
})();

</script>
<script data-src="core/07-ctx.js">
/* Pip's Playroom — the per-game context object handed to game.create(stage, ctx).
 * Everything registered through ctx (timers, listeners, loops, sequences) is cleaned up
 * automatically when the child leaves the game. See GAME_API.md for the full contract.
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;

  PP.makeCtx = function (game, stage) {
    const timers = new Set();
    const intervals = new Set();
    const rafStops = new Set();
    const listeners = [];
    const handles = [];
    const resizeFns = [];
    const idleWatchers = new Set();
    let alive = true;
    let promptText = '';
    let mascot = null;
    let lastTouch = performance.now();

    const onStageDown = () => { lastTouch = performance.now(); };
    stage.addEventListener('pointerdown', onStageDown, { passive: true, capture: true });

    const ctx = {
      game,
      stage,
      get alive() { return alive; },
      get level() { return PP.store.level(game.id); },
      get settings() { return PP.store.settings; },
      data: PP.data,
      util: U,
      audio: PP.audio,
      fx: PP.fx,
      get kit() { return PP.kit; },
      el: U.el,
      svg: U.svg,
      html: U.html,
      pick: U.pick,
      shuffle: U.shuffle,
      sample: U.sample,
      rand: U.rand,
      randInt: U.randInt,
      clamp: U.clamp,

      /* ---------- sound & speech ---------- */
      say(text, opts) {
        if (!alive) return Promise.resolve(false);
        if (PP.app.overlayPromise) {
          return PP.app.overlayPromise.then(() => (alive ? PP.speech.say(text, opts) : false));
        }
        return PP.speech.say(text, opts);

      sfx(name, opts) { return alive ? PP.audio.sfx(name, opts) : 0; },
      play(inst, note, opts) { return alive ? PP.audio.play(inst, note, opts) : 0; },
      drum(name, opts) { return alive ? PP.audio.drum(name, opts) : 0; },
      sequence(events, opts) { const h = PP.audio.sequence(events, opts); handles.push(h); return h; },
      loop(pattern) { const h = PP.audio.loop(pattern); handles.push(h); return h; },
      rumble(opts) { const h = PP.audio.rumble(opts); handles.push(h); return h; },

      /** Remember the current instruction; tapping Pip (or idling) repeats it. */
      setPrompt(text) { promptText = text || ''; },
      getPrompt() { return promptText; },
      prompt() { return promptText ? ctx.say(promptText) : Promise.resolve(false); },

      /* ---------- lifecycle-safe timing ---------- */
      setTimeout(fn, ms) {
        const id = setTimeout(() => { timers.delete(id); if (alive) fn(); }, ms);
        timers.add(id);
        return id;
      },
      clearTimeout(id) { clearTimeout(id); timers.delete(id); },
      setInterval(fn, ms) {
        const id = setInterval(() => { if (alive) fn(); }, ms);
        intervals.add(id);
        return id;
      },
      clearInterval(id) { clearInterval(id); intervals.delete(id); },
      /** Promise that resolves after ms — and never resolves if the game was exited (so async flows just stop). */
      wait(ms) {

      /** Animation loop: fn(dtSeconds, timeMs) each frame until it returns false or the game exits. Returns stop(). */
      raf(fn) {
        let last = performance.now();
        let stopped = false;
        let id = 0;
        const stop = () => { stopped = true; cancelAnimationFrame(id); rafStops.delete(stop); };
        const frame = (t) => {
          if (stopped || !alive) return;

          last = t;

          try { r = fn(dt, t); } catch (e) { console.error(e); r = false; }

          id = requestAnimationFrame(frame);

       * Toddler-friendly tap: fires on pointerdown (instant), ignores multi-fire within `cooldown` ms (default 120)

          fn(e, { x: e.clientX, y: e.clientY });
        });
