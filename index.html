        P.planet.appendChild(P.alien);
        P.planet.style.visibility = 'hidden';
        world.append(P.sky, P.space, P.spaceObjs, P.ground, P.fly, P.stars, P.planet, rocketEl, big, btn);
        S = P;
      }

      function layoutScene() {
        G = measure();
        const { w, h, s, land } = G;
        if (!S) return;
        place(S.spaceDots, 0, 0, w, h);
        const rs = U.clamp(s * 0.3, 110, 260);
        place(S.ringed, land ? w * 0.6 : w - rs * 0.95, land ? G.safe.t + 10 : h * 0.14, rs, rs * 0.69);
        const ms = U.clamp(s * 0.17, 60, 150);
        place(S.moon, land ? w - G.safe.r - ms * 1.1 : w * 0.06, land ? h * 0.42 : h * 0.4, ms, ms);
        const ss = U.clamp(s * 0.2, 70, 150);
        place(S.sun, w - G.safe.r - ss * 0.95, G.safe.t + 6, ss, ss);
        place(S.c1, w * 0.12 + G.safe.l, h * (land ? 0.2 : 0.16), s * 0.3, s * 0.15);
        place(S.c2, w * (land ? 0.5 : 0.55), h * (land ? 0.1 : 0.3), s * 0.24, s * 0.12);
        place(S.hills, -10, G.groundY - h * 0.08, w + 20, h - G.groundY + h * 0.08 + 2);
        const th = G.RH * 1.02;
        place(S.tower, G.padX - G.RW * 0.5 - th * 0.3, G.padY - th, th * 0.27, th);
        place(S.pad, G.padX - G.RW * 0.75, G.padY - G.padH * 0.2, G.RW * 1.5, G.padH);
        btn.style.setProperty('--b', G.btn + 'px');
        btn.style.width = btn.style.height = G.btn + 'px';
        btn.style.left = G.btnX - G.btn / 2 + 'px';
        btn.style.top = G.btnY - G.btn / 2 + 'px';
        big.style.left = G.bigX + 'px';
        big.style.top = G.bigY + 'px';
        big.style.fontSize = G.bigS + 'px';
        // planet
        place(S.planetArt, -w * 0.1, G.surfaceY - h * 0.05, w * 1.2, h - G.surfaceY + h * 0.05 + 2);
        const ps = U.clamp(s * 0.14, 50, 120);
        place(S.plants[0], w * 0.08, G.surfaceY - ps * 1.2, ps * 0.66, ps);
        place(S.plants[1], w * 0.8, G.surfaceY - ps * 1.1, ps * 0.6, ps * 0.9);
        place(S.plants[2], w * 0.9, G.surfaceY - ps * 0.6, ps * 0.5, ps * 0.75);
        const as = U.clamp(s * 0.3, 110, 240);
        G.landX = land ? w * 0.36 : w * 0.34;
        place(S.alien, land ? w * 0.62 - as * 0.4 : w * 0.7 - as * 0.4, G.surfaceY - as * 1.05, as * 0.8, as);
        stars.forEach(layoutStar);
        if (phase === 'pad' || phase === 'count') { rocket.x = G.padX; rocket.y = G.padY; rocket.h = G.RH; }
        else if (phase === 'stars') { rocket.x = G.spaceX; rocket.y = G.spaceY; rocket.h = G.spaceRH; }
        else if (phase === 'landed') { rocket.x = G.landX; rocket.y = G.surfaceY + G.RH * 0.02; rocket.h = G.RH * 0.8; }
        drawRocket();
      }

      function drawRocket() {
        const rh = rocket.h, rw = rh * (120 / 220);
        const a = rocket.shake;
        const sx = a ? U.rand(-a, a) : 0, sy = a ? U.rand(-a, a) * 0.5 : 0;
        rocketEl.style.width = rw + 'px';
        rocketEl.style.height = rh + 'px';
        rocketEl.style.transform = `translate3d(${(rocket.x - rw / 2 + sx).toFixed(1)}px, ${(rocket.y - rh + sy).toFixed(1)}px, 0) rotate(${rocket.rot.toFixed(1)}deg)`;
      }

      /* tween numeric props of an object over ms with an easing fn */
      const EASE = {
        inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
        in: (t) => t * t * t,
        out: (t) => 1 - Math.pow(1 - t, 3),
      };
      function tween(obj, to, ms, ease) {
        const from = {};
        for (const k in to) from[k] = obj[k];
        const e = EASE[ease || 'inOut'];
        let t = 0;
        return new Promise((res) => {
          ctx.raf((dt) => {
            t += dt * 1000;
            const p = Math.min(1, t / ms), q = e(p);
            for (const k in to) obj[k] = from[k] + (to[k] - from[k]) * q;
            if (p >= 1) { res(); return false; }
            return true;
          });
        });
      }
      let worldShake = 0;
      ctx.raf(() => {
        drawRocket();
        if (worldShake > 0.2) world.style.transform = `translate(${U.rand(-worldShake, worldShake).toFixed(1)}px, ${U.rand(-worldShake, worldShake).toFixed(1)}px) scale(1.04)`;
        else if (world.style.transform) world.style.transform = '';
      });

      /* ---------- phases ---------- */
      let phase = 'pad';
      let cur = 0, lastStep = 0, hinted = false, rum = null, startN = 5;
      let stars = [], starCount = 0, starTarget = 0;

      function puff(x, y, size, dx, dy, ms) {
        const e = ctx.el('div', { class: 'rk-puff', style: { left: x - size / 2 + 'px', top: y - size / 2 + 'px', width: size + 'px', height: size + 'px' } });
        S.fly.appendChild(e);
        const an = e.animate([
          { transform: 'translate(0,0) scale(.3)', opacity: 0.95 },
          { transform: `translate(${dx}px, ${dy}px) scale(1.4)`, opacity: 0 },
        ], { duration: ms || 1200, easing: 'cubic-bezier(.2,.7,.3,1)' });
        an.onfinish = () => e.remove();
        ctx.setTimeout(() => e.remove(), (ms || 1200) + 200);
      }

      async function startFlight(first) {
        phase = 'pad';
        buildScene();
        stars = [];
        rocket.rot = 0; rocket.shake = 0;
        flame.className = 'rk-flame';
        layoutScene();
        const lvl = ctx.level;
        startN = START[lvl];
        cur = startN;
        hinted = false;
        btn.className = 'rk-btn';
        btnTxt.className = '';
        btnTxt.textContent = String(cur);
        big.textContent = '';
        big.className = 'rk-big';
        ctx.setPrompt('Tap the button!');
        ctx.poke();
        await ctx.say(first ? "Let's count down! Tap the button!" : 'Ready? Tap the button!');
      }

      function tapCountdown(fromRocket) {
        if (phase !== 'pad' && phase !== 'count') return;
        const now = performance.now();
        btn.classList.add('press');
        ctx.setTimeout(() => btn.classList.remove('press'), 140);
        if (now - lastStep < THROTTLE || cur < 1) {
          ctx.sfx('click', { vel: 0.4 });
          return;
        }
        lastStep = now;
        phase = 'count';
        const n = cur;
        const step = startN - n; // 0 ..
        big.textContent = String(n);
        big.classList.remove('pop', 'out'); void big.offsetWidth; big.classList.add('pop');
        ctx.say(Word(n) + '!');
        ctx.play('toy', RISE[Math.round((step / Math.max(1, startN - 1)) * 9)] || 'G5', { vel: 0.7 });
        ctx.drum('tom', { vel: 0.4 + step * 0.04, pitch: 110 + step * 6, bus: 'sfx' });
        const frac = (step + 1) / startN;
        rocket.shake = 1 + frac * 5;
        if (!rum) rum = ctx.rumble({ vel: 0.06, cutoff: 160 });
        rum.setLevel(0.06 + frac * 0.32);
        rum.setCutoff(160 + frac * 260);
        if (frac > 0.5) { flame.classList.add('on', 'small'); }
        if (fromRocket) rocketBody.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06, .95)' }, { transform: 'scale(1)' }], { duration: 260 });
        cur = n - 1;
        if (cur >= 1) btnTxt.textContent = String(cur);
        else {
          btnTxt.textContent = '🚀';
          btnTxt.className = 'ic pp-emoji';
          ctx.setTimeout(blastOff, 850);
        }
      }

      async function blastOff() {
        if (!ctx.alive) return;
        phase = 'launch';
        ctx.setPrompt('');
        btn.classList.add('gone');
        big.classList.add('out');
        ctx.say('Blast off!');
        ctx.sfx('blastoff', { vel: 1 });
        flame.classList.remove('small');
        flame.classList.add('on', 'big');
        if (rum) { rum.setLevel(0.75); rum.setCutoff(900); }
        rocket.shake = 7;
        worldShake = 9;
        // smoke billows from the pad
        const bx = G.padX, by = G.padY;
        for (let i = 0; i < 14; i++) {
          const side = i % 2 ? 1 : -1;
          ctx.setTimeout(() => puff(bx + side * U.rand(0, G.RW * 0.3), by - G.padH * 0.2, G.RW * U.rand(0.5, 0.9), side * U.rand(G.RW * 0.6, G.RW * 1.8), U.rand(-30, 10), 1400), i * 70);
        }
        await ctx.wait(650);
        // lift off — the camera follows: ground slides down, space fades in
        const dur = 2600;
        S.ground.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${G.h * 1.25}px)` }], { duration: dur, easing: 'cubic-bezier(.55,0,.6,1)', fill: 'forwards' });
        S.fly.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${G.h * 1.25}px)` }], { duration: dur, easing: 'cubic-bezier(.55,0,.6,1)', fill: 'forwards' });
        S.space.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, easing: 'ease-in', fill: 'forwards' });
        S.sky.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur, easing: 'ease-in', fill: 'forwards' });
        S.spaceObjs.animate([{ transform: `translateY(${-G.h * 0.8}px)`, opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }], { duration: dur + 600, easing: 'cubic-bezier(.3,.6,.3,1)', fill: 'forwards' });
        streaks(dur + 400);
        tween(rocket, { y: G.h * 0.62 }, 1500, 'in').then(() => { worldShake = 3; });
        ctx.setTimeout(() => { worldShake = 0; rocket.shake = 1.2; if (rum) { rum.stop(1.6); rum = null; } flame.classList.remove('big'); }, dur - 300);
        await ctx.wait(dur + 200);
        // glide to a corner so the stars have room
        flame.classList.add('small');
        await tween(rocket, { x: G.spaceX, y: G.spaceY, h: G.spaceRH }, 1100, 'inOut');
        rocket.shake = 0.6;
        countStars();
      }

      function streaks(ms) {
        for (let i = 0; i < 14; i++) {
          ctx.setTimeout(() => {
            if (!S) return;
            const len = U.rand(60, 160);
            const e = ctx.el('div', { class: 'rk-streak', style: { left: U.rand(0, G.w) + 'px', top: -len + 'px', height: len + 'px' } });
            S.stars.appendChild(e);
            const an = e.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${G.h + len * 2}px)` }], { duration: U.rand(500, 800), easing: 'linear' });
            an.onfinish = () => e.remove();
          }, U.rand(300, ms - 400));
        }
      }

      /* ---------- star counting ---------- */
      function starSize(n) { return U.clamp(G.s * (n <= 4 ? 0.27 : n <= 6 ? 0.23 : 0.2), 80, 170); }
      function starSpots(n) {
        const { w, h, safe } = G;
        const size = starSize(n);
        const rw = G.spaceRH * (120 / 220);
        const zones = [
          { x: 0, y: 0, w: safe.l + 104, h: safe.t + 104 },
          { x: G.spaceX - rw * 0.8, y: G.spaceY - G.spaceRH * 1.05, w: rw * 1.6, h: G.spaceRH * 1.1 },
        ];
        [S.moon, S.ringed].forEach((el) => {
          const z = { x: parseFloat(el.style.left), y: parseFloat(el.style.top), w: parseFloat(el.style.width), h: parseFloat(el.style.height) };
          zones.push({ x: z.x + z.w * 0.12, y: z.y + z.h * 0.12, w: z.w * 0.76, h: z.h * 0.76 });
        });
        const area = { x: safe.l + 10, y: safe.t + 14, w: w - safe.l - safe.r - 20, h: h - safe.t - safe.b - 24 };
        let best = null;
        for (let k = 0; k < 6 && !best; k++) {
          const sz = size * Math.pow(0.9, k);
          const cols = Math.max(1, Math.floor(area.w / (sz * 1.25))), rows = Math.max(1, Math.floor(area.h / (sz * 1.2)));
          const cw = area.w / cols, ch = area.h / rows;
          const cells = [];
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            const cx = area.x + (c + 0.5) * cw, cy = area.y + (r + 0.5) * ch;
            const hit = zones.some((z) => cx + sz * 0.45 > z.x && cx - sz * 0.45 < z.x + z.w && cy + sz * 0.45 > z.y && cy - sz * 0.45 < z.y + z.h);
            if (!hit) cells.push({ cx, cy, cw, ch });
          }
          if (cells.length >= n) best = { sz, cells };
        }
        if (!best) best = { sz: size * 0.55, cells: [{ cx: w / 2, cy: h / 2, cw: 0, ch: 0 }] };
        // pick n well-spread cells
        const pickd = [];
        const pool = ctx.shuffle(best.cells);
        pickd.push(pool.shift());
        while (pickd.length < n && pool.length) {
          let bi = 0, bd = -1;
          pool.forEach((c, i) => {
            const d = Math.min(...pickd.map((p) => Math.hypot(p.cx - c.cx, p.cy - c.cy))) * U.rand(0.85, 1.15);
            if (d > bd) { bd = d; bi = i; }
          });
          pickd.push(pool.splice(bi, 1)[0]);
        }
        while (pickd.length < n) pickd.push(pickd[pickd.length % Math.max(1, pickd.length)]);
        return pickd.map((c) => ({ x: c.cx + U.rand(-1, 1) * Math.max(0, (c.cw - best.sz) / 2) * 0.6, y: c.cy + U.rand(-1, 1) * Math.max(0, (c.ch - best.sz) / 2) * 0.6, s: best.sz }));
      }
      function layoutStar(st) {
        st.el.style.left = st.pos.x - st.pos.s / 2 + 'px';
        st.el.style.top = st.pos.y - st.pos.s / 2 + 'px';
        st.el.style.width = st.el.style.height = st.pos.s + 'px';
        st.el.style.setProperty('--s', st.pos.s + 'px');
      }

      async function countStars() {
        phase = 'stars';
        const [lo, hi] = STARS[ctx.level];
        starTarget = U.randInt(lo, hi);
        starCount = 0;
        const spots = starSpots(starTarget);
        stars = spots.map((pos, i) => {
          const el = ctx.el('div', { class: 'rk-star in' });
          const sin = ctx.el('div', { class: 'rk-sin', html: STAR, style: { animationDelay: i * 0.09 + 's' } });
          const badge = ctx.el('div', { class: 'rk-badge' });
          el.append(sin, badge);
          const st = { el, sin, badge, pos, on: false, i };
          el._st = st;
          S.stars.appendChild(el);
          layoutStar(st);
          ctx.setTimeout(() => { el.classList.remove('in'); sin.style.animationDelay = -U.rand(0, 3).toFixed(2) + 's'; }, 700 + i * 90);
          return st;
        });
        ctx.sfx('twinkle', { vel: 0.5 });
        ctx.setPrompt('Tap the stars!');
        ctx.poke();
        await ctx.say("Let's count the stars!");
      }

      function tapStar(st) {
        if (phase !== 'stars') return;
        if (st.on) {
          st.sin.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 300 });
          ctx.sfx('tap', { vel: 0.3 });
          return;
        }
        st.on = true;
        st.el.classList.remove('pp-glow');
        const k = ++starCount;
        st.el.classList.add('on');
        st.badge.textContent = String(k);
        ctx.play('bell', SCALE[k - 1] || 'E6', { vel: 0.85 });
        ctx.sfx('ding', { vel: 0.25 });
        ctx.say(Word(k) + '!');
        const r = st.el.getBoundingClientRect();
        PP.fx.floatText(r.left + r.width / 2, r.top + r.height * 0.2, String(k), { color: '#FFD84A', size: U.clamp(G.s * 0.2, 72, 140) });
        PP.fx.burst(r.left + r.width / 2, r.top + r.height / 2, { emoji: ['✨'], count: 5, size: 24, distance: r.width * 0.7 });
        st.sin.animate([{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(1.35) rotate(25deg)' }, { transform: 'scale(1) rotate(0)' }], { duration: 500, easing: 'cubic-bezier(.3,1.5,.5,1)' });
        if (k === starTarget) {
          phase = 'starsdone';
          ctx.setTimeout(starsDone, 900);
        }
      }

      async function starsDone() {
        if (!ctx.alive) return;
        // quick sparkle recap, then the total
        stars.forEach((st, i) => ctx.setTimeout(() => st.sin.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 400 }), i * 90));
        ctx.sfx('sparkle', { vel: 0.5 });
        big.textContent = String(starTarget);
        big.style.left = G.w / 2 + 'px';
        big.style.top = G.h * 0.42 + 'px';
        big.style.fontSize = Math.min(G.s * 0.42, 300) + 'px';
        big.className = 'rk-big';
        void big.offsetWidth;
        big.classList.add('pop');
        await Promise.all([ctx.say(`${Word(starTarget)} stars!`), ctx.wait(1500)]);
        await ctx.wait(300);
        big.classList.add('out');
        land();
      }

      /* ---------- landing ---------- */
      async function land() {
        phase = 'landing';
        ctx.setPrompt('');
        ctx.say('Look! A planet!');
        S.stars.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: `translateY(${-G.h * 0.6}px)`, opacity: 0 }], { duration: 1800, easing: 'ease-in', fill: 'forwards' });
        S.spaceObjs.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-G.h * 0.3}px)` }], { duration: 1800, easing: 'ease-in-out', fill: 'forwards' });
        S.planet.style.visibility = 'visible';
        S.planet.animate([{ transform: `translateY(${G.h * 0.6}px)` }, { transform: 'translateY(0)' }], { duration: 1900, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' });
        flame.classList.remove('small');
        flame.classList.add('on');
        // swoop over, then descend gently
        await tween(rocket, { x: G.landX, y: G.surfaceY - G.RH * 0.5, h: G.RH * 0.8 }, 1500, 'inOut');
        flame.classList.add('small');
        await tween(rocket, { y: G.surfaceY + G.RH * 0.02 }, 1100, 'out');
        flame.classList.remove('on', 'small');
        rocket.shake = 0;
        ctx.drum('kick', { vel: 0.7, bus: 'sfx' });
        for (let i = 0; i < 8; i++) {
          const side = i % 2 ? 1 : -1;
          puffDust(G.landX + side * U.rand(0, G.RW * 0.3), G.surfaceY, side);
        }
        rocketBody.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.08,.9)' }, { transform: 'scale(1,1)' }], { duration: 380, easing: 'ease-out', transformOrigin: '50% 100%' });
        phase = 'landed';
        await ctx.wait(450);
        S.alien.style.display = '';
        S.alien.classList.add('show');
        ctx.sfx('boing', { vel: 0.6 });
        await ctx.wait(350);
        await ctx.say('Hi! Hi!', { pitch: 1.6, rate: 1.05 });
        ctx.success(!hinted);
        await ctx.celebrate({ say: `${ctx.praise()} We landed!`, y: G.h * 0.4 });
        ctx.setPrompt('Fly again?');
        const nb = PP.kit.nextButton(ctx, () => {
          if (nextLock) return;
          nextLock = true;
          nb.remove();
          flyHome();
        });
        nextBtn = nb;
        ctx.poke();
      }
      let nextLock = false, nextBtn = null;
      function puffDust(x, y, side) {
        const e = ctx.el('div', { class: 'rk-puff', style: { left: x - 20 + 'px', top: y - 20 + 'px', width: '40px', height: '40px', background: 'radial-gradient(circle at 40% 35%, #E6DAFF, #B9A2FF 75%)' } });
        S.planet.appendChild(e);
        const an = e.animate([{ transform: 'scale(.3)', opacity: 1 }, { transform: `translate(${side * U.rand(40, 110)}px, ${U.rand(-30, -5)}px) scale(1.4)`, opacity: 0 }], { duration: 900, easing: 'ease-out' });
        an.onfinish = () => e.remove();
      }

      async function flyHome() {
        phase = 'home';
        nextBtn = null;
        ctx.sfx('whoosh', { vel: 0.6 });
        flame.classList.add('on');
        S.alien.querySelector('.rk-wave');
        tween(rocket, { y: -G.RH * 0.2 }, 900, 'in');
        await ctx.wait(500);
        const fade = world.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
        await ctx.wait(420);
        nextLock = false;
        await startFlightFade(fade);
      }
      async function startFlightFade(fade) {
        const p = startFlight(false);
        fade.cancel();
        world.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450 });
        await p;
      }

      /* ---------- input ---------- */
      ctx.on(stage, 'pointerdown', (e) => {
        if (e.button > 0) return;
        const t = e.target;
        if (!t || !t.closest) return;
        if (t.closest('.pp-next')) return;
        if (t.closest('.rk-btn')) { e.preventDefault(); tapCountdown(false); return; }
        if (t.closest('.rk-rocket')) {
          e.preventDefault();
          if (phase === 'pad' || phase === 'count') { tapCountdown(true); return; }
          rocketBody.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(0)' }], { duration: 500 });
          ctx.sfx('boing', { vel: 0.4 });
          if (phase === 'stars' || phase === 'landed') ctx.say('Whee!', { mode: 'skip' });
          return;
        }
        const st = t.closest('.rk-star');
        if (st && st._st) { e.preventDefault(); tapStar(st._st); return; }
        if (t.closest('.rk-alien')) {
          S.alienIn.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-18%) scale(1.05,.95)' }, { transform: 'translateY(0) scale(1)' }], { duration: 450, easing: 'cubic-bezier(.3,1.5,.5,1)' });
          ctx.sfx('boing', { vel: 0.5 });
          ctx.say(U.pick(['Hi!', 'Hee hee!', 'Hello!', 'Wheee!']), { pitch: 1.6, rate: 1.05 });
          return;
        }
        const fun = t.closest('[data-fun]');
        if (fun) {
          ctx.sfx(fun.dataset.fun, { vel: 0.5 });
          fun.animate([{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(-10deg) scale(1.12)' }, { transform: 'rotate(8deg) scale(.96)' }, { transform: 'rotate(0) scale(1)' }], { duration: 600, easing: 'ease-out' });
          return;
        }
        PP.fx.burst(e.clientX, e.clientY, { emoji: phase === 'pad' || phase === 'count' ? ['✨', '☁️'] : ['✨', '⭐'], count: 4, size: 24, distance: 56 });
        ctx.sfx('tap', { vel: 0.25 });
      });

      ctx.idle(7000, () => {
        if (phase === 'pad' || phase === 'count') {
          hinted = true;
          PP.fx.glow(btn, 2600);
          ctx.say('Tap the button!');
        } else if (phase === 'stars') {
          const left = stars.filter((s) => !s.on);
          if (!left.length) return;
          hinted = true;
          PP.fx.glow(U.pick(left).el);
          ctx.say('Tap the stars!');
        } else if (phase === 'landed' && nextBtn) {
          PP.fx.glow(nextBtn, 2600);
          ctx.say('Fly again?');
        }
      });

      ctx.onResize(() => {
        layoutScene();
        if (phase === 'stars') {
          const spots = starSpots(stars.length);
          stars.forEach((st, i) => { st.pos = spots[i]; layoutStar(st); });
        }
      });

      startFlight(true);
      return { destroy() { if (rum) { try { rum.stop(0.1); } catch (e) {} } } };
    },
  });
})();

</script>
<script data-src="games/shapes-sorter.js">
/* Shapes — a classic shape sorter.
 * Level 1: tap a shape → it says its name and hops into its hole by itself (can't fail).
 * Level 2+: DRAG a shape to its hole (generous snap), or TAP a shape then TAP a hole.
 *   Wrong hole → the shape bonks and bounces home: "That's the square hole. Find the circle hole!" + glow.
 * Shapes per level come from PP.data.shapesForLevel (3 → 8). Level 2 holes have colored rims as a scaffold.
 * When everything is in: the box rattles, the lid pops and the shapes burst out. Every 2nd round: "Find the star!".
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;

  U.addStyles('shapes', `
    .g-shapes { background: linear-gradient(#BFE7FF 0%, #E3F5FF 58%, #F4D2A2 58.2%, #E9BE84 100%); }
    .ss-wallstars { position: absolute; left: 0; right: 0; top: 0; height: 58%; pointer-events: none; opacity: .55;
      background-image: radial-gradient(circle, #fff 0 3px, transparent 4px), radial-gradient(circle, #fff 0 2px, transparent 3px);
      background-size: 90px 90px, 60px 60px; background-position: 10px 20px, 40px 50px; }
    .ss-mat { position: absolute; border-radius: 28px; pointer-events: none;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 18px, rgba(255,255,255,0) 18px 36px), linear-gradient(#9BE3C4, #7FD6B2);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.65), inset 0 0 0 9px rgba(0,0,0,.04), 0 10px 0 #5DBF97, 0 18px 26px rgba(30,90,60,.22); }
    .ss-mat::after { content: ""; position: absolute; inset: 12px; border-radius: 20px; border: 3px dashed rgba(255,255,255,.75); }
    .ss-box { position: absolute; z-index: 5; }
    .ss-box::after { content: ""; position: absolute; left: 2%; right: 2%; bottom: -12px; height: 24px; border-radius: 50%; background: rgba(90, 50, 10, .2); z-index: -1; }
    .ss-front, .ss-lid { position: absolute; left: 0; }
    .ss-front svg, .ss-lid svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
    .ss-lid { z-index: 2; transform-origin: 20% 100%; }
    .ss-hole { position: absolute; border-radius: 50%; z-index: 3; }
    .ss-hl { opacity: 0; transition: opacity .2s; }
    .ss-hl.hover { opacity: .9; }
    .ss-hl.glow { opacity: 1; animation: ss-hl 1s ease-in-out infinite; }
    @keyframes ss-hl { 0%, 100% { opacity: .35; stroke-width: 8px } 50% { opacity: 1; stroke-width: 16px } }
    .ss-hl.flash { opacity: 1; animation: ss-flash .6s ease-out forwards; }
    @keyframes ss-flash { from { opacity: 1 } to { opacity: 0 } }
    .ss-piece { position: absolute; left: 0; top: 0; z-index: 10; touch-action: none; will-change: transform; }
    .ss-piece.drag { z-index: 30; }
    .ss-piece.fly { z-index: 25; pointer-events: none; }
    .ss-inner { width: 100%; height: 100%; transition: transform .18s cubic-bezier(.3,1.6,.5,1), filter .2s; filter: drop-shadow(0 6px 5px rgba(40,30,80,.22)); }
    .ss-inner svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ss-piece.lift .ss-inner { transform: scale(1.14); filter: drop-shadow(0 14px 10px rgba(40,30,80,.28)); }
    .ss-piece.sel .ss-inner { animation: ss-sel 1s ease-in-out infinite; filter: drop-shadow(0 0 10px #FFE45C) drop-shadow(0 12px 10px rgba(40,30,80,.25)); }
    @keyframes ss-sel { 0%, 100% { transform: scale(1.12) } 50% { transform: scale(1.2) rotate(3deg) } }
    .ss-piece.pop .ss-inner { animation: ss-pop .5s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes ss-pop { from { transform: scale(0) rotate(-30deg) } to { transform: scale(1) } }
    .ss-piece.wig .ss-inner { animation: pp-wiggle .5s ease both; }
    .ss-ghost { position: absolute; left: 0; top: 0; z-index: 28; pointer-events: none; opacity: .55; }
    .ss-ghost svg { width: 100%; height: 100%; display: block; }
    .ss-finger { position: absolute; left: 0; top: 0; z-index: 29; pointer-events: none; font-size: 46px; }
    .ss-find { position: absolute; z-index: 40; left: calc(var(--safe-l) + 12px); right: calc(var(--safe-r) + 12px);
      top: calc(var(--safe-t) + 90px); bottom: calc(var(--safe-b) + 20px); }
    .ss-hide { opacity: 0 !important; pointer-events: none !important; transition: opacity .3s; }
    .ss-fade { transition: opacity .3s; }
  `);

  U.addDefs('shapes', `
    <linearGradient id="ss-holeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140E26"/><stop offset=".55" stop-color="#2A1F45"/><stop offset="1" stop-color="#4C3D74"/>
    </linearGradient>
  `);

  const PALETTE = ['#EF3B36', '#FF8C1A', '#FFD21F', '#3DBE4B', '#2F7BEA', '#8E4FD6', '#FF6FB5', '#22C3C3'];
  const LID = '#FF5A5F', FRONT = '#3D8BFF';

  function pieceSVG(id, color) {
    const s = PP.data.shapeById(id);
    const dark = U.shade(color, -0.32);
    return `<svg viewBox="-6 -6 112 112" aria-hidden="true">
      <g transform="translate(0 8)" fill="${dark}" stroke="${dark}" stroke-width="5" stroke-linejoin="round">${s.markup}</g>
      <g fill="${color}" stroke="${U.shade(color, -0.18)}" stroke-width="4" stroke-linejoin="round">${s.markup}</g>
      <g fill="#fff" opacity=".32" transform="translate(-4 -6) scale(.92)">${id === 'circle' || id === 'oval' ? '<ellipse cx="38" cy="34" rx="16" ry="10"/>' : '<ellipse cx="36" cy="34" rx="12" ry="7"/>'}</g>
    </svg>`;
  }
  // piece svg viewBox is 112 wide for a 100-unit shape → the shape spans this fraction of the element
  const SHAPE_FRAC = 100 / 112;
  // a hole's 100-unit box is HOLE_K × the piece element, so the hole outline is ~8% bigger than the shape
  const HOLE_K = SHAPE_FRAC * 1.08;

  PP.registerGame({
    id: 'shapes',
    title: 'Shapes',
    domain: 'shapes',
    icon: '🔷',
    tileColor: '#FFB547',
    order: 40,
    create(stage, ctx) {
      const probe = ctx.el('div', { style: { position: 'absolute', visibility: 'hidden', pointerEvents: 'none', padding: 'var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)' } });
      const mat = ctx.el('div', { class: 'ss-mat ss-fade' });
      const box = ctx.el('div', { class: 'ss-box ss-fade' });
      const front = ctx.el('div', { class: 'ss-front' });
      const lid = ctx.el('div', { class: 'ss-lid' });
      box.append(front, lid);
      stage.append(probe, ctx.el('div', { class: 'ss-wallstars' }), mat, box);
      ctx.mascot.show({ corner: 'tr', size: 'clamp(64px, 11vmin, 100px)' });

      let pieces = []; // {id, name, color, el, inner, home:{x,y,rot}, state:'mat'|'fly'|'in'}
      let holes = []; // {id, name, x, y (stage coords), lx, ly (lid coords), hit, hl}
      let L = null; // layout numbers
      let selected = null;
      let roundErrors = 0, missReported = false;
      let busy = true; // between rounds
      let roundDoneResolve = null;
      let lastTouch = 0;
      let lidPopped = 'none';

      const say = (t, o) => ctx.say(t, o);
      const cap = U.cap;

      /* ---------------- layout ---------------- */
      function computeLayout() {
        const W = stage.clientWidth, H = stage.clientHeight;
        const cs = getComputedStyle(probe);
        const sf = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
        const n = pieces.length || 3;
        const small = Math.min(W, H) < 520;
        const pad = small ? 14 : 30;
        const land = W > H * 1.15;
        let boxA, matA;
        if (land) {
          const split = 0.5;
          matA = { x: sf.l + pad, y: sf.t + (small ? 88 : 104), w: (W - sf.l - sf.r) * split - pad * 1.5, h: 0 };
          matA.h = H - sf.b - pad - matA.y;
          boxA = { x: sf.l + (W - sf.l - sf.r) * split + pad * 0.5, y: sf.t + (small ? 74 : 112), w: (W - sf.l - sf.r) * (1 - split) - pad * 1.5, h: 0 }; // below Pip (top-right)
          boxA.h = H - sf.b - pad - boxA.y - 10;
        } else {
          const top = sf.t + (small ? 92 : 112);
          const avail = H - sf.b - pad - top;
          const boxH = avail * (n > 5 ? 0.46 : 0.44);
          boxA = { x: sf.l + pad, y: top, w: W - sf.l - sf.r - pad * 2, h: boxH };
          matA = { x: sf.l + pad, y: top + boxH + (small ? 18 : 30), w: W - sf.l - sf.r - pad * 2, h: 0 };
          matA.h = H - sf.b - pad - matA.y - 8;
        }
        // hole grid that gives the biggest holes inside the box area (lid + front face)
        const PADF = 0.26, GAPF = 0.3, FRONTF = 0.34;
        let best = null;
        for (let c = 1; c <= n; c++) {
          const r = Math.ceil(n / c);
          const byW = boxA.w / (c + (c - 1) * GAPF + PADF * 2);
          const byH = boxA.h / ((r + (r - 1) * GAPF + PADF * 2) * (1 + FRONTF) + 0.12);
          const hs = Math.min(byW, byH);
          if (!best || hs > best.hs + 0.5) best = { c, r, hs };
        }
        // pieces on the mat
        const mg = U.layoutGrid(n, matA.w - 24, matA.h - 24, small ? 10 : 18);
        const psMat = mg.size * 0.84;
        const maxP = small ? 128 : 190;
        const ps = Math.max(40, Math.min(psMat, best.hs / HOLE_K, maxP));
        const hs = ps * HOLE_K;
        const g = hs * GAPF, p = hs * PADF;
        const lw = best.c * hs + (best.c - 1) * g + p * 2;
        const lh = best.r * hs + (best.r - 1) * g + p * 2;
        const fh = Math.max(lh * FRONTF, 28);
        const bx = boxA.x + (boxA.w - lw) / 2;
        const by = boxA.y + Math.max(0, (boxA.h - lh - fh) / 2) * (land ? 0.8 : 0.7);
        return { W, H, sf, land, small, boxA, matA, mg, ps, hs, g, p, lw, lh, fh, bx, by, cols: best.c, rows: best.r };
      }

      function layout() {
        if (!pieces.length) return;
        L = computeLayout();
        // mat
        Object.assign(mat.style, { left: L.matA.x + 'px', top: L.matA.y + 'px', width: L.matA.w + 'px', height: L.matA.h + 'px' });
        // box
        Object.assign(box.style, { left: L.bx + 'px', top: L.by + 'px', width: L.lw + 'px', height: (L.lh + L.fh) + 'px' });
        renderBox();
        // pieces' home slots on the mat
        const n = pieces.length;
        const cols = L.mg.cols, rows = L.mg.rows;
        const cw = (L.matA.w - 24) / cols, ch = (L.matA.h - 24) / rows;
        pieces.forEach((pc, i) => {
          const slot = pc.slot;
          const r = Math.floor(slot / cols), c = slot % cols;
          const inRow = r === rows - 1 ? n - (rows - 1) * cols : cols;
          const offX = (cols - inRow) * cw / 2;
          const jx = pc.jit[0] * Math.max(0, cw - L.ps) * 0.35, jy = pc.jit[1] * Math.max(0, ch - L.ps) * 0.35;
          pc.home = { x: L.matA.x + 12 + offX + cw * (c + 0.5) + jx, y: L.matA.y + 12 + ch * (r + 0.5) + jy, rot: pc.rot };
          pc.el.style.width = pc.el.style.height = L.ps + 'px';
          if (pc.state === 'mat' && !pc.dragging) place(pc, pc.home.x, pc.home.y, pc.home.rot, 1);
        });
      }

      function renderBox() {
        const { lw, lh, fh, hs, g, p } = L;
        const s = lw / 300;
        const lip = Math.max(8, lh * 0.07);
        // front face of the box (below the lid)
        const fw = lw * 0.94, fx = (lw - fw) / 2;
        Object.assign(front.style, { left: fx + 'px', top: (lh - lip * 0.6) + 'px', width: fw + 'px', height: (fh + lip * 0.6) + 'px' });
        const FH = fh + lip * 0.6;
        let stars = '';
        const nS = Math.max(3, Math.round(fw / 70));
        for (let i = 0; i < nS; i++) {
          const cx = (fw * (i + 0.5)) / nS, cy = FH * (i % 2 ? 0.62 : 0.5), R = Math.min(FH * 0.2, 16 * s + 6), r = R * 0.45;
          let d = '';
          for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + (j * Math.PI) / 5, rr = j % 2 ? r : R; d += (j ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); }
          stars += i % 2 ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(R * 0.55).toFixed(1)}" fill="#fff" opacity=".85"/>` : `<path d="${d}Z" fill="#FFD21F" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>`;
        }
        const rr = Math.min(FH * 0.45, 26);
        front.innerHTML = `<svg viewBox="0 0 ${fw.toFixed(1)} ${FH.toFixed(1)}" preserveAspectRatio="none">
          <path d="M0 0H${fw.toFixed(1)}V${(FH - rr).toFixed(1)}Q${fw.toFixed(1)} ${FH.toFixed(1)} ${(fw - rr).toFixed(1)} ${FH.toFixed(1)}H${rr.toFixed(1)}Q0 ${FH.toFixed(1)} 0 ${(FH - rr).toFixed(1)}Z" fill="${FRONT}"/>
          <path d="M0 ${(FH * 0.8).toFixed(1)}H${fw.toFixed(1)}V${(FH - rr).toFixed(1)}Q${fw.toFixed(1)} ${FH.toFixed(1)} ${(fw - rr).toFixed(1)} ${FH.toFixed(1)}H${rr.toFixed(1)}Q0 ${FH.toFixed(1)} 0 ${(FH - rr).toFixed(1)}Z" fill="#000" opacity=".12"/>
          <rect x="0" y="0" width="${fw.toFixed(1)}" height="${(lip * 1.2).toFixed(1)}" fill="#000" opacity=".18"/>
          ${stars}
        </svg>`;
        // lid with holes
        Object.assign(lid.style, { top: '0px', width: lw + 'px', height: lh + 'px' });
        const rad = Math.min(lw, lh) * 0.14;
        const lvl = ctx.level;
        let holesSvg = '';
        holes.forEach((h, i) => {
          const c = i % L.cols, r = Math.floor(i / L.cols);
          const inRow = r === L.rows - 1 ? holes.length - (L.rows - 1) * L.cols : L.cols;
          const off = (L.cols - inRow) * (hs + g) / 2;
          h.lx = p + off + c * (hs + g) + hs / 2;
          h.ly = p + r * (hs + g) + hs / 2;
          const k = hs / 100;
          const markup = PP.data.shapeById(h.id).markup;
          const pc = pieces.find((x) => x.id === h.id);
          const rim = lvl === 2 && pc ? pc.color : 'rgba(255,255,255,.55)';
          holesSvg += `<g transform="translate(${(h.lx - hs / 2).toFixed(1)} ${(h.ly - hs / 2).toFixed(1)}) scale(${k.toFixed(4)})">
              <g fill="none" stroke="${rim}" stroke-width="${lvl === 2 ? 11 : 9}" stroke-linejoin="round" transform="translate(50 50) scale(1.06) translate(-50 -50)">${markup}</g>
              <g fill="url(#ss-holeg)" stroke="#1B1430" stroke-width="3" stroke-linejoin="round">${markup}</g>
              <g class="ss-hl" data-i="${i}" fill="none" stroke="#FFE45C" stroke-width="10" stroke-linejoin="round" transform="translate(50 50) scale(1.13) translate(-50 -50)">${markup}</g>
            </g>`;
        });
        lid.innerHTML = `<svg viewBox="0 0 ${lw.toFixed(1)} ${lh.toFixed(1)}">
          <rect x="0" y="${(lip * 0.6).toFixed(1)}" width="${lw.toFixed(1)}" height="${lh.toFixed(1)}" rx="${rad.toFixed(1)}" fill="${U.shade(LID, -0.28)}"/>
          <rect x="0" y="0" width="${lw.toFixed(1)}" height="${(lh - lip * 0.4).toFixed(1)}" rx="${rad.toFixed(1)}" fill="${LID}"/>
          <rect x="${(rad * 0.5).toFixed(1)}" y="${(lip * 0.45).toFixed(1)}" width="${(lw - rad).toFixed(1)}" height="${(lip * 0.9).toFixed(1)}" rx="${(lip * 0.45).toFixed(1)}" fill="#fff" opacity=".28"/>
          ${holesSvg}
        </svg>`;
        holes.forEach((h, i) => {
          h.hl = lid.querySelector(`.ss-hl[data-i="${i}"]`);
          if (h.glowing) h.hl.classList.add('glow');
          const sz = Math.max(hs * 1.25, 64);
          if (!h.hit) {
            h.hit = ctx.el('div', { class: 'ss-hole' });
            ctx.tap(h.hit, () => onHoleTap(h));
          }
          lid.appendChild(h.hit);
          Object.assign(h.hit.style, { left: (h.lx - sz / 2) + 'px', top: (h.ly - sz / 2) + 'px', width: sz + 'px', height: sz + 'px' });
          h.x = L.bx + h.lx;
          h.y = L.by + h.ly;
        });
      }
      ctx.onResize(layout);

      /* ---------------- piece helpers ---------------- */
      function place(pc, x, y, rot, s) {
        pc.cur = { x, y, rot, s };
        pc.el.style.transform = `translate(${(x - L.ps / 2).toFixed(1)}px, ${(y - L.ps / 2).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${s})`;
      }
      const tf = (x, y, rot, s) => `translate(${(x - L.ps / 2).toFixed(1)}px, ${(y - L.ps / 2).toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${s})`;
      /** fly along an arc; resolves when done */
      function flyTo(pc, x, y, rot, s, ms, hop) {
        const a = pc.cur;
        const frames = [];
        const N = 10;
        const h = hop == null ? Math.min(140, Math.hypot(x - a.x, y - a.y) * 0.35 + 30) : hop;
        for (let i = 0; i <= N; i++) {
          const t = i / N;
          const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          const px = a.x + (x - a.x) * e, py = a.y + (y - a.y) * e - Math.sin(Math.PI * t) * h;
          const sc = a.s + (s - a.s) * e + Math.sin(Math.PI * t) * 0.12;
          frames.push({ transform: tf(px, py, a.rot + (rot - a.rot) * e, sc) });
        }
        place(pc, x, y, rot, s);
        try { pc.el.animate(frames, { duration: ms, easing: 'linear' }); } catch (e) {}
        return ctx.wait(ms);
      }
      function pieceCenter(pc) { return { x: pc.cur.x, y: pc.cur.y }; }
      const holeFor = (pc) => holes.find((h) => h.id === pc.id);

      function flashHole(h) { if (!h.hl) return; h.hl.classList.remove('flash'); h.hl.getBoundingClientRect(); h.hl.classList.add('flash'); ctx.setTimeout(() => h.hl && h.hl.classList.remove('flash'), 650); }
      function glowHole(h, on) {
        holes.forEach((x) => { if (x !== h || !on) { x.glowing = false; x.hl && x.hl.classList.remove('glow'); } });
        if (on && h) { h.glowing = true; h.hl && h.hl.classList.add('glow'); }
      }
      function hoverHole(h) { holes.forEach((x) => x.hl && x.hl.classList.toggle('hover', x === h)); }

      function select(pc) {
        if (selected && selected !== pc) selected.el.classList.remove('sel');
        selected = pc;
        if (pc) pc.el.classList.add('sel');
      }

      function plonkSound() {
        ctx.drum('tom', { pitch: 170, vel: 0.9, bus: 'sfx' });
        ctx.drum('woodblock', { vel: 0.5, bus: 'sfx', delay: 0.02 });
        ctx.sfx('pop', { vel: 0.35, delay: 0.05 });
      }
      function boxBump() {
        try { box.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.03,.95)' }, { transform: 'scale(.99,1.02)' }, { transform: 'scale(1,1)' }], { duration: 320, easing: 'ease-out' }); } catch (e) {}
      }

      /** shape goes into its hole */
      async function dropIn(pc, h, opts) {
        opts = opts || {};
        pc.state = 'fly';
        pc.el.classList.remove('lift', 'sel', 'drag');
        pc.el.classList.add('fly');
        if (selected === pc) select(null);
        const fit = (L.hs / (L.ps * SHAPE_FRAC)) * 0.95;
        await flyTo(pc, h.x, h.y, 0, fit, opts.ms || 520, opts.hop);
        // sink into the hole
        try {
          pc.el.animate([
            { transform: tf(h.x, h.y, 0, fit), opacity: 1 },
            { transform: tf(h.x, h.y + L.hs * 0.04, 0, fit * 0.86), opacity: 1, offset: 0.4 },
            { transform: tf(h.x, h.y + L.hs * 0.1, 0, fit * 0.55), opacity: 0 },
          ], { duration: 260, easing: 'ease-in', fill: 'forwards' });
        } catch (e) {}
        await ctx.wait(140);
        plonkSound();
        boxBump();
        flashHole(h);
        glowHole(null, false);
        PP.fx.burst(h.x, h.y, { emoji: ['✨', '⭐'], count: 5, size: 26, distance: L.hs * 0.8 });
        await ctx.wait(140);
        pc.state = 'in';
        pc.el.style.visibility = 'hidden';
        checkDone();
      }

      /** wrong hole: bonk and bounce back */
      async function bonk(pc, h) {
        pc.state = 'fly';
        pc.el.classList.remove('lift', 'sel', 'drag');
        pc.el.classList.add('fly');
        if (selected === pc) select(null);
        roundErrors++;
        if (roundErrors >= 2 && !missReported) { missReported = true; ctx.miss(); }
        await flyTo(pc, h.x, h.y - L.hs * 0.1, pc.cur.rot * 0.5, 1.05, 300, 30);
        ctx.drum('woodblock', { vel: 0.8, bus: 'sfx' });
        ctx.sfx('boing', { vel: 0.55 });
        ctx.sfx('oops', { vel: 0.5, delay: 0.1 });
        pc.el.classList.add('wig');
        ctx.setTimeout(() => pc.el.classList.remove('wig'), 520);
        const right = holeFor(pc);
        glowHole(right, true);
        ctx.mascot.mood('think');
        say(`That's the ${h.name} hole. Find the ${pc.name} hole!`);
        await ctx.wait(220);
        await flyTo(pc, pc.home.x, pc.home.y, pc.home.rot, 1, 520, 60);
        pc.state = 'mat';
        pc.el.classList.remove('fly');
      }

      async function goHome(pc) {
        pc.state = 'fly';
        pc.el.classList.add('fly');
        await flyTo(pc, pc.home.x, pc.home.y, pc.home.rot, 1, 360, 20);
        pc.state = 'mat';
        pc.el.classList.remove('fly', 'lift');
      }

      function correctLine(pc) {
        return `${cap(pc.name)}! ${ctx.pick(['In it goes!', 'Plonk!', 'It fits!', 'In the box!'])}`;
      }

      async function attempt(pc, h) {
        hoverHole(null);
        if (h.id === pc.id) {
          say(correctLine(pc));
          ctx.mascot.mood('happy');
          await dropIn(pc, h);
        } else {
          await bonk(pc, h);
        }
      }

      /* ---------------- input: pieces ---------------- */
      function bindPiece(pc) {
        let pid = null, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
        ctx.on(pc.el, 'pointerdown', (e) => {
          if (e.button > 0 || pid !== null) return;
          e.preventDefault();
          lastTouch = performance.now();
          if (pc.state !== 'mat' || busy) {
            if (pc.state === 'mat') { ctx.sfx('tap', { vel: 0.5 }); say(`${cap(pc.name)}!`, { mode: 'skip' }); }
            return;
          }
          pid = e.pointerId;
          try { pc.el.setPointerCapture(pid); } catch (err) {}
          sx = e.clientX; sy = e.clientY;
          ox = pc.cur.x; oy = pc.cur.y;
          moved = false;
          pc.el.classList.add('lift');
          ctx.sfx('tap', { vel: 0.7 });
          ctx.play('marimba', ['C5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6'][pieces.indexOf(pc) % 8], { vel: 0.35, bus: 'sfx' });
          // touching a shape always says its name (level 1 also announces the hop)
          if (ctx.level > 1) say(`${cap(pc.name)}!`);
        });
        ctx.on(pc.el, 'pointermove', (e) => {
          if (e.pointerId !== pid) return;
          const dx = e.clientX - sx, dy = e.clientY - sy;
          if (!moved && Math.hypot(dx, dy) > 12) {
            moved = true;
            pc.dragging = true;
            pc.el.classList.add('drag');
            if (selected && selected !== pc) select(null);
            pc.el.classList.remove('sel');
          }
          if (moved) {
            const rot = pc.home.rot * Math.max(0, 1 - Math.hypot(dx, dy) / 160);
            place(pc, ox + dx, oy + dy, rot, 1);
            if (ctx.level > 1) {
              const near = nearestHole(pc.cur.x, pc.cur.y);
              hoverHole(near && near.d < L.hs * 1.3 ? near.h : null);
            }
          }
        });
        const up = (e) => {
          if (e.pointerId !== pid) return;
          pid = null;
          pc.dragging = false;
          pc.el.classList.remove('drag');
          if (pc.state !== 'mat') return;
          if (!moved) return onPieceTap(pc);
          onPieceDrop(pc);
        };
        ctx.on(pc.el, 'pointerup', up);
        ctx.on(pc.el, 'pointercancel', up);
      }

      function nearestHole(x, y) {
        let best = null;
        holes.forEach((h) => { const d = Math.hypot(x - h.x, y - h.y); if (!best || d < best.d) best = { h, d }; });
        return best;
      }

      function onPieceTap(pc) {
        if (ctx.level === 1) {
          // youngest players: it hops in by itself
          say(`${cap(pc.name)}! In it goes!`);
          dropIn(pc, holeFor(pc), { ms: 700 });
          return;
        }
        if (selected === pc) {
          // second tap on the same shape: nudge toward its hole
          glowHole(holeFor(pc), true);
          say(`Find the ${pc.name} hole!`);
          return;
        }
        pc.el.classList.remove('lift');
        select(pc);
        ctx.setPrompt(`Find the ${pc.name} hole!`);
      }

      function onPieceDrop(pc) {
        const c = pieceCenter(pc);
        const right = holeFor(pc);
        if (ctx.level === 1) { say(`${cap(pc.name)}! In it goes!`); dropIn(pc, right, { ms: 420, hop: 30 }); return; }
        const dRight = Math.hypot(c.x - right.x, c.y - right.y);
        const near = nearestHole(c.x, c.y);
        const over = near && near.d < L.hs * 0.6 ? near.h : null;
        hoverHole(null);
        if (over === right || (!over && dRight < L.hs * 1.3)) {
          say(correctLine(pc));
          ctx.mascot.mood('happy');
          dropIn(pc, right, { ms: 260, hop: 12 });
        } else if (over) {
          bonk(pc, over);
        } else {
          goHome(pc);
        }
      }

      /* ---------------- input: holes, box, background ---------------- */
      function onHoleTap(h) {
        lastTouch = performance.now();
        if (busy) return;
        if (selected && selected.state === 'mat') {
          const pc = selected;
          select(null);
          attempt(pc, h);
          return;
        }
        flashHole(h);
        ctx.sfx('click', { vel: 0.6 });
        ctx.drum('woodblock', { vel: 0.4, bus: 'sfx' });
        say(`The ${h.name} hole!`);
      }
      ctx.tap(front, () => {
        lastTouch = performance.now();
        rattleBox(4);
        const inside = pieces.filter((p) => p.state === 'in').length;
        if (inside) say('Shake shake!', { mode: 'skip' });
      });
      ctx.tap(stage, (e, pt) => {
        if (e.target.closest && e.target.closest('.ss-piece, .ss-hole, .ss-front, .pp-game-pip, .ss-find')) return;
        lastTouch = performance.now();
        if (selected) { select(null); ctx.sfx('swish', { vel: 0.4 }); return; }
        ctx.sfx('bubble', { vel: 0.3 });
        PP.fx.burst(pt.x, pt.y, { emoji: ['✨'], count: 3, size: 22, distance: 40 });
      }, { preventDefault: false });

      function rattleBox(times) {
        for (let i = 0; i < times; i++) ctx.drum('shaker', { delay: i * 0.09, vel: 0.6, bus: 'sfx' });
        try {
          box.animate([
            { transform: 'rotate(0)' }, { transform: 'rotate(-4deg) translateX(-4px)' }, { transform: 'rotate(4deg) translateX(4px)' },
            { transform: 'rotate(-3deg)' }, { transform: 'rotate(3deg)' }, { transform: 'rotate(0)' },
          ], { duration: times * 90 + 120, easing: 'ease-in-out' });
        } catch (e) {}
      }

      /* ---------------- ghost hint ---------------- */
      async function ghostHint(pc) {
        const h = holeFor(pc);
        if (!h || !L) return;
        const g = ctx.el('div', { class: 'ss-ghost', html: pieceSVG(pc.id, pc.color) });
        const f = ctx.el('div', { class: 'ss-finger pp-emoji', text: '👆' });
        g.style.width = g.style.height = L.ps + 'px';
        stage.append(g, f);
        const T = (x, y, s) => `translate(${(x - L.ps / 2).toFixed(1)}px, ${(y - L.ps / 2).toFixed(1)}px) scale(${s})`;
        const F = (x, y) => `translate(${(x - 10).toFixed(1)}px, ${(y + L.ps * 0.15).toFixed(1)}px)`;
        const a = pc.home, b = h;
        const fr = [], ff = [];
        for (let i = 0; i <= 10; i++) {
          const t = i / 10, e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e - Math.sin(Math.PI * t) * 60;
          fr.push({ transform: T(x, y, 1 - 0.1 * e), opacity: i === 10 ? 0 : 0.6 });
          ff.push({ transform: F(x, y), opacity: i === 10 ? 0 : 1 });
        }
        try { g.animate(fr, { duration: 1500, easing: 'linear', fill: 'forwards' }); f.animate(ff, { duration: 1500, easing: 'linear', fill: 'forwards' }); } catch (e) {}
        await ctx.wait(1550);
        g.remove(); f.remove();
      }

      /* ---------------- rounds ---------------- */
      function checkDone() {
        if (pieces.length && pieces.every((p) => p.state === 'in') && roundDoneResolve) {
          const r = roundDoneResolve;
          roundDoneResolve = null;
          r();
        }
      }

      function buildRound() {
        const lvl = ctx.level;
        const shapes = PP.data.shapesForLevel(lvl);
        const colors = ctx.shuffle(PALETTE).slice(0, shapes.length);
        pieces.forEach((p) => p.el.remove());
        holes.forEach((h) => h.hit && h.hit.remove());
        const order = ctx.shuffle(shapes.map((s, i) => i));
        const maxRot = [0, 8, 10, 16, 24, 28][lvl];
        pieces = shapes.map((s, i) => {
          const el = ctx.el('div', { class: 'ss-piece pop' });
          const inner = ctx.el('div', { class: 'ss-inner', html: pieceSVG(s.id, colors[i]) });
          el.appendChild(inner);
          el.style.animationDelay = '0ms';
          inner.style.animationDelay = i * 70 + 'ms';
          return { id: s.id, name: s.name, color: colors[i], el, inner, state: 'mat', slot: order[i], jit: [ctx.rand(-1, 1), ctx.rand(-1, 1)], rot: ctx.rand(-maxRot, maxRot), dragging: false };
        });
        // holes in a shuffled order on the lid
        holes = ctx.shuffle(shapes).map((s) => ({ id: s.id, name: s.name, glowing: false }));
        pieces.forEach((p) => { stage.appendChild(p.el); bindPiece(p); });
        layout();
        ctx.setTimeout(() => pieces.forEach((p) => p.el.classList.remove('pop')), 600 + pieces.length * 70);
        roundErrors = 0;
        missReported = false;
        selected = null;
      }

      async function sorterRound(first) {
        buildRound();
        lid.style.transform = '';
        ctx.sfx('pop', { vel: 0.4 });
        const lvl = ctx.level;
        const intro = lvl === 1 ? 'Tap a shape! In the box it goes!' : 'Put the shapes in the box!';
        const prompt = lvl === 1 ? 'Tap a shape!' : 'Put the shapes in the box!';
        ctx.setPrompt(prompt);
        const done = new Promise((r) => { roundDoneResolve = r; });
        busy = false;
        say(first ? (lvl === 1 ? "Shapes! Let's put them in the box! Tap a shape!" : intro) : ctx.pick(['New shapes! Put them in!', 'More shapes! In the box!', intro]));
        let idles = 0;
        const stopIdle = ctx.idle(7500, () => {
          const left = pieces.filter((p) => p.state === 'mat');
          if (!left.length) return;
          idles++;
          const pc = selected && selected.state === 'mat' ? selected : ctx.pick(left);
          if (ctx.level === 1) {
            pc.el.classList.add('wig');
            ctx.setTimeout(() => pc.el.classList.remove('wig'), 520);
            say(`Tap the ${pc.name}!`);
          } else {
            say(`Put the ${pc.name} in its hole!`);
            glowHole(holeFor(pc), true);
            ghostHint(pc);
          }
        });
        await done;
        stopIdle();
        busy = true;
        glowHole(null, false);
        select(null);
        await ctx.wait(300);
        // shake, pop, burst!
        say('All in! Shake, shake, shake!');
        rattleBox(8);
        await ctx.wait(950);
        ctx.sfx('pop', { vel: 0.9 });
        ctx.sfx('boing', { vel: 0.7, delay: 0.05 });
        try {
          const up = Math.min(L.lh * 0.55, 150);
          lidPopped = `translateY(${-up}px) rotate(-12deg)`;
          lid.style.transform = lidPopped;
          lid.animate([{ transform: 'none' }, { transform: `translateY(${-up * 1.3}px) rotate(-16deg)` }, { transform: lidPopped }], { duration: 420, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
        } catch (e) {}
        burstOut();
        ctx.success(roundErrors === 0);
        await ctx.celebrate({ big: true, x: L.bx + L.lw / 2, y: L.by + L.lh * 0.3, say: ctx.pick(['Pop! Hooray!', 'Wow! All the shapes!', 'Pop! You did it!']) });
        // lid back on
        try {
          lid.style.transform = '';
          lid.animate([{ transform: lidPopped }, { transform: 'translateY(4%)' }, { transform: 'none' }], { duration: 380, easing: 'ease-in' });
        } catch (e) {}
        await ctx.wait(300);
        ctx.drum('tom', { pitch: 120, vel: 0.6, bus: 'sfx' });
        await ctx.wait(250);
      }

      function burstOut() {
        const cx = L.bx + L.lw / 2, cy = L.by + L.lh * 0.4;
        const parts = pieces.map((pc, i) => {
          const el = ctx.el('div', { class: 'ss-ghost', html: pieceSVG(pc.id, pc.color) });
          el.style.opacity = '1';
          el.style.width = el.style.height = L.ps * 0.8 + 'px';
          stage.appendChild(el);
          const a = -Math.PI / 2 + (i / Math.max(1, pieces.length - 1) - 0.5) * 2.2 + ctx.rand(-0.15, 0.15);
          const sp = ctx.rand(9, 14) * Math.min(1.3, Math.max(0.75, L.H / 800));
          return { el, x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, r: 0, vr: ctx.rand(-9, 9) };
        });
        ctx.raf((dt) => {
          const k = dt * 60;
          let alive = 0;
          parts.forEach((p) => {
            if (!p.el.parentNode) return;
            p.vy += 0.42 * k;
            p.x += p.vx * k; p.y += p.vy * k; p.r += p.vr * k;
            if (p.y > L.H + L.ps) { p.el.remove(); return; }
            alive++;
            p.el.style.transform = `translate(${(p.x - L.ps * 0.4).toFixed(1)}px, ${(p.y - L.ps * 0.4).toFixed(1)}px) rotate(${p.r.toFixed(1)}deg)`;
          });
          return alive > 0;
        });
      }

      /* ---------------- "Find the star!" bonus ---------------- */
      async function findBonus() {
        const lvl = ctx.level;
        const shapes = PP.data.shapesForLevel(lvl);
        const n = Math.min(shapes.length, [2, 2, 2, 3, 3, 4][lvl]);
        const target = ctx.pick(shapes);
        const others = ctx.sample(shapes.filter((s) => s.id !== target.id), n - 1);
        const colors = ctx.shuffle(PALETTE);
        const choices = ctx.shuffle([target].concat(others)).map((s, i) => ({ id: s.id, name: s.name, render: () => PP.data.shapeSVG(s.id, colors[i]) }));
        pieces.forEach((p) => p.el.classList.add('ss-hide'));
        mat.classList.add('ss-hide');
        box.classList.add('ss-hide');
        const area = ctx.el('div', { class: 'ss-find' });
        stage.appendChild(area);
        await PP.kit.findRound(ctx, {
          container: area,
          choices,
          targetId: target.id,
          intro: ctx.pick(['Shape hunt!', 'Quick game!']),
          prompt: ctx.pick([`Find the ${target.name}!`, `Where is the ${target.name}?`]),
          maxCard: 230,
          sayRight: (c) => `${ctx.praise()} The ${c.name}!`,
        });
        area.remove();
        mat.classList.remove('ss-hide');
        box.classList.remove('ss-hide');
      }

      (async () => {
        let round = 0;
        while (ctx.alive) {
          await sorterRound(round === 0);
          round++;
          if (round % 2 === 0) await findBonus();
        }
      })();

      return { destroy() { pieces = []; holes = []; } };
    },
  });
})();

</script>
<script data-src="games/words-body.js">
/* Body Parts — "Touch & Giggle" with Bo, a round fuzzy mint buddy (original character).
 * Free play: every part does something silly and Bo names it ("Nose! Honk honk!").
 * Teaching rounds: "Where is Bo's nose?" — errorless (wrong part reacts + is named; glow after 2 misses).
 * "Touch YOUR nose!" moments: Bo demonstrates, the child copies in the real world.
 * Level 1: nose, eyes, mouth, tummy · 2: + ears, hands, feet · 3: + hair, head · 4: + cheeks, knees · 5: + toes, eyebrows
 * (small fine parts are only taught when Bo is drawn big enough for a generous target).
 */
(function () {
  'use strict';
  const PP = window.PP;
  const U = PP.util;

  U.addStyles('body', `
    .g-body { background: radial-gradient(120% 90% at 50% 38%, #FFF8DC 0%, #FFE6C7 38%, #C9EBFF 100%); }

      background: radial-gradient(ellipse at center, #FFD9A8 0 46%, #FFC98A 47% 60%, rgba(255,201,138,0) 61%); }
    .bo-svg { position: absolute; overflow: visible; display: block; touch-action: none; }
    .bo-svg * { -webkit-tap-highlight-color: transparent; }
    .bo-glow { fill: rgba(255, 228, 92, .28); stroke: #FFD21F; stroke-width: 7; transform-box: fill-box; transform-origin: center;
      animation: bo-glow 1.1s ease-in-out infinite; pointer-events: none; }
    @keyframes bo-glow { 0%, 100% { transform: scale(.92); opacity: .65 } 50% { transform: scale(1.1); opacity: 1 } }
    .bo-bubble { position: absolute; pointer-events: none; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 12%, rgba(255,255,255,.35) 13% 55%, rgba(255,255,255,.12) 56%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.55); animation: bo-float linear infinite; }
    @keyframes bo-float { 0% { transform: translateY(0) } 50% { transform: translateY(-26px) } 100% { transform: translateY(0) } }
    .bo-word { position: absolute; z-index: 20; left: 50%; transform: translateX(-50%) scale(0); pointer-events: none;
      top: calc(var(--safe-t) + 14px); padding: .08em .6em .14em; border-radius: 999px; background: #fff; color: #3A2A5A;
      font-weight: 900; font-size: clamp(26px, 5.4vmin, 46px); box-shadow: 0 5px 0 rgba(60, 40, 120, .14), 0 10px 22px rgba(60, 40, 120, .12);
      transition: transform .3s cubic-bezier(.3,1.6,.5,1); white-space: nowrap; }
    .bo-word.on { transform: translateX(-50%) scale(1); }
    .bo-word.side { left: auto; right: calc(var(--safe-r) + 18px); transform: scale(0); transform-origin: 100% 0; }
    .bo-word.side.on { transform: scale(1); }
    .bo-word .q { color: #8E6BEA; }
    .bo-you { position: absolute; z-index: 20; pointer-events: none; left: 50%; bottom: calc(var(--safe-b) + 14px);
      transform: translateX(-50%) scale(0); font-size: clamp(54px, 11vmin, 96px); transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
    .bo-you.on { transform: translateX(-50%) scale(1); animation: bo-you 1s ease-in-out infinite .35s; }
    @keyframes bo-you { 0%, 100% { margin-bottom: 0 } 50% { margin-bottom: 14px } }
  `);

  /* ======================================================================= Bo's artwork */
  const FUR = '#6FD6B8', FUR_D = '#3FA88A', FUR_L = '#A6F0DA';
  const HAIR_D = '#6A4BC9', PINK = '#FFB8C9', INK = '#2B2340', MOUTH = '#5A2340';

  /** scalloped "fluffy" ellipse path */
  function fluffy(cx, cy, rx, ry, n, amp, rot) {
    rot = rot || 0;
    let d = '';
    for (let i = 0; i <= n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
      if (!i) { d += `M${x.toFixed(1)} ${y.toFixed(1)}`; continue; }
      const am = rot + ((i - 0.5) / n) * Math.PI * 2, k = 1 + amp;
      d += `Q${(cx + rx * k * Math.cos(am)).toFixed(1)} ${(cy + ry * k * Math.sin(am)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + 'Z';
  }

  const TOES = { L: [[118, 503], [143, 509], [168, 505]], R: [[232, 505], [257, 509], [282, 503]] };

  function boSVG() {
    const toe = (side) => TOES[side].map(([x, y], i) => `<ellipse class="bo-toe bo-toe${side}${i}" cx="${x}" cy="${y}" rx="10.5" ry="8" fill="${PINK}" stroke="#F08AA4" stroke-width="2"/>`).join('');
    const hand = (side) => `
      <g class="bo-hand${side}">
        <g class="bo-handart">
          <circle cx="0" cy="0" r="29" fill="${FUR}" stroke="${FUR_D}" stroke-width="4"/>
          <circle cx="23" cy="-15" r="11" fill="${FUR}" stroke="${FUR_D}" stroke-width="4"/>
          <circle cx="28" cy="2" r="11" fill="${FUR}" stroke="${FUR_D}" stroke-width="4"/>
          <circle cx="22" cy="18" r="11" fill="${FUR}" stroke="${FUR_D}" stroke-width="4"/>
          <circle cx="0" cy="0" r="27" fill="${FUR}"/>
          <ellipse cx="-2" cy="2" rx="13" ry="12" fill="${PINK}" opacity=".9"/>
          <circle cx="-9" cy="-9" r="6" fill="#fff" opacity=".3"/>
        </g>
      </g>`;
    return `
<svg class="bo-svg" viewBox="0 -30 400 560" aria-hidden="true">
  <defs>
    <radialGradient id="bo-fur" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="${FUR_L}"/><stop offset=".55" stop-color="${FUR}"/><stop offset="1" stop-color="#4DBE9E"/></radialGradient>
    <radialGradient id="bo-tum" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FFD9AE"/></radialGradient>
    <radialGradient id="bo-nose" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#FFA3BC"/><stop offset=".65" stop-color="#FF5C86"/><stop offset="1" stop-color="#DE4069"/></radialGradient>
    <radialGradient id="bo-hairg" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#C2A8FF"/><stop offset=".6" stop-color="#9270F0"/><stop offset="1" stop-color="#7353D6"/></radialGradient>
  </defs>
  <g class="bo-all">
    <ellipse cx="200" cy="520" rx="150" ry="13" fill="rgba(60,40,90,.16)"/>
    <g class="bo-legL"><rect x="128" y="392" width="60" height="96" rx="28" fill="url(#bo-fur)" stroke="${FUR_D}" stroke-width="4"/>
      <ellipse class="bo-kneeL" cx="158" cy="447" rx="20" ry="16" fill="${FUR_L}" opacity=".9"/></g>
    <g class="bo-legR"><rect x="212" y="392" width="60" height="96" rx="28" fill="url(#bo-fur)" stroke="${FUR_D}" stroke-width="4"/>
      <ellipse class="bo-kneeR" cx="242" cy="447" rx="20" ry="16" fill="${FUR_L}" opacity=".9"/></g>
    <g class="bo-footL"><ellipse cx="143" cy="492" rx="58" ry="27" fill="url(#bo-fur)" stroke="${FUR_D}" stroke-width="4"/>

  const PARTS = {

  PP.registerGame({

    order: 32,

    create(stage, ctx) {
      /* ---------------- DOM ---------------- */

      /* ---------------- rig ---------------- */
      const rig = {};

      let handToken = 0;
      async function handsTo(L, Rr, ms, ease) {

        await ctx.wait(ms);
      }
      function restHands(ms) { handTo('L', arms.L.rest, ms || 380); handTo('R', arms.R.rest, ms || 380); }

      let mouthOverride = null, mouthUntil = 0, talking = false, happyUntil = 0;
      let look = { x: 0, y: 0 }; // pupil offset target
      let lookCur = { x: 0, y: 0 };
      let rollUntil = 0;
      let nextBlink = now + 2.5;

      function setMouth(m) {
        for (const k in mouthEls) mouthEls[k].style.display = k === m ? '' : 'none';
      }
      let mouthShown = 'smile';

      function frame(dt, tms) {
        now = tms / 1000;
        // breathing
        // quantized so the big body group repaints ~8×/s instead of every frame (cheaper on older iPads)
        const br = Math.round(Math.sin(now * TAU * 0.33) * 12) / 12;
        for (const name in rig) {
          const r = rig[name];
          let tx = 0, ty = 0, rot = 0, sx = 1, sy = 1;
          if (name === 'upper') { sy *= 1 + 0.012 * br; sx *= 1 - 0.006 * br; }
          for (let i = r.fx.length - 1; i >= 0; i--) {
            const f = r.fx[i];
            const t = now - f.t0;
            if (t >= f.dur) { r.fx.splice(i, 1); continue; }
            if (t < 0) continue;
            const v = f.fn(t / f.dur, t) || {};
            tx += v.tx || 0; ty += v.ty || 0; rot += v.r || 0;
            if (v.sx != null) sx *= v.sx;
            if (v.sy != null) sy *= v.sy;
            if (v.s != null) { sx *= v.s; sy *= v.s; }
          }
          // blink
          if ((name === 'eyeL' || name === 'eyeR') && now > nextBlink && now < nextBlink + 0.16) sy *= 0.1;
          const tr = (tx || ty || rot || sx !== 1 || sy !== 1)
            ? `translate(${(r.ox + tx).toFixed(2)} ${(r.oy + ty).toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${-r.ox} ${-r.oy})`

          if (tr !== r.last) { r.last = tr; if (tr) r.el.setAttribute('transform', tr); else r.el.removeAttribute('transform'); }

            const e = a.tw.ease(p);
            a.pos[0] = a.tw.from[0] + (a.tw.to[0] - a.tw.from[0]) * e;
            a.pos[1] = a.tw.from[1] + (a.tw.to[1] - a.tw.from[1]) * e;
            if (p >= 1) a.tw = null;

          let px = -dy / len, py = dx / len;

          const bend = 10 + Math.max(0, 70 - len) * 0.25;
          const cx = (sx0 + hx) / 2 + px * bend, cy = (sy0 + hy) / 2 + py * bend;
          const d = `M${sx0} ${sy0}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${hx.toFixed(1)} ${hy.toFixed(1)}`;

      /* ---------------- layout ---------------- */
      let scale = 1;

      function layout() {
        const W = stage.clientWidth, H = stage.clientHeight;

        const cs = getComputedStyle(probe);
        const sf = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };

        floor.style.height = (h * 0.16) + 'px';
        floor.style.top = (y + h * 0.89) + 'px';

        fineOK = scale >= 0.86;
        // the word bubble goes top-centre, or top-right when Bo's head would be underneath it
        const wordBottom = sf.t + (small ? 66 : 84);
        wordEl.classList.toggle('side', y < wordBottom && W > H);
        bubbles.forEach((b, i) => {
          const side = i % 2 ? 1 : -1;
          const free = Math.max(30, (W - w) / 2);
          const bx = side < 0 ? (free * (0.2 + (i % 3) * 0.25)) : W - free * (0.2 + (i % 3) * 0.25) - 30;

      ctx.onResize(layout);

      /* ---------------- helpers ---------------- */
      const enabledFine = (p) => !PARTS[p].fine || fineOK;
      function activeParts() {
        const lv = ctx.level;
        const set = new Set(['nose', 'eyes', 'mouth', 'tummy', 'ears', 'hands', 'feet', 'hair', 'arms']);
        if (lv >= 3) set.add('head');
        if (lv >= 4) { set.add('knees'); if (fineOK) set.add('cheeks'); } else set.add('legs');
        if (lv >= 5 && fineOK) { set.add('toes'); set.add('eyebrows'); }

      }
      function toSvg(x, y) {
        const m = svg.getScreenCTM();
        if (!m) return null;
        const p = svg.createSVGPoint();
        p.x = x; p.y = y;
        return p.matrixTransform(m.inverse());
      }
      function toScreen(x, y) {
        const m = svg.getScreenCTM();
        const p = svg.createSVGPoint();

      function segDist(px, py, ax, ay, bx, by) {
        const vx = bx - ax, vy = by - ay;
        const t = U.clamp(((px - ax) * vx + (py - ay) * vy) / (vx * vx + vy * vy || 1), 0, 1);
        return Math.hypot(px - (ax + vx * t), py - (ay + vy * t));
      }

      /** which part is at svg point (x,y)? */
